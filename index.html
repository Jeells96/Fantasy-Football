<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Football</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;600&display=swap');

:root {
  --bg:#0a0d12;
  --surface:#111520;
  --card:#161c2a;
  --border:#1e2740;
  --accent:#e8c84a;
  --accent2:#4a9de8;
  --text:#e8eaf0;
  --muted:#5a6280;
  --danger:#e84a6a;
  --green:#4ae8a0;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans', sans-serif;
  min-height:100vh;
  padding-bottom:60px;
  line-height:1.5;
}

body.modal-open { overflow:hidden; }

.header {
  background:linear-gradient(135deg,#0a0d12 0%,#111a2e 100%);
  border-bottom:1px solid var(--border);
  padding:24px 20px 20px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.header-top {
  display:flex;
  align-items:baseline;
  gap:12px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.header h1 {
  font-family:'Bebas Neue', sans-serif;
  font-size:2.2rem;
  letter-spacing:3px;
  color:var(--accent);
  line-height:1;
}

.league-name {
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
}

.tabs {
  display:flex;
  gap:8px;
  margin-top:16px;
  flex-wrap:wrap;
}

.tab {
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:10px 20px;
  border-radius:9999px;
  cursor:pointer;
}

.tab.active {
  background:var(--accent);
  border-color:var(--accent);
  color:#000;
  font-weight:600;
}

.content { padding:24px 16px; }

.status {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:80px 20px;
  gap:16px;
}

.spinner {
  width:36px;
  height:36px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .9s linear infinite;
}

@keyframes spin { to { transform:rotate(360deg); } }

.status p {
  font-family:'DM Mono', monospace;
  font-size:.8rem;
  color:var(--muted);
  letter-spacing:1px;
}

.section-label {
  font-family:'DM Mono', monospace;
  font-size:.7rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  margin:28px 0 12px;
}

.year-selector {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.year-select {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-family:'DM Sans', sans-serif;
  font-size:.95rem;
  padding:10px 14px;
  min-width:140px;
}

.info-banner {
  background:rgba(74,157,232,.1);
  border:1px solid rgba(74,157,232,.4);
  border-radius:8px;
  padding:12px 16px;
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  color:var(--accent2);
  margin-bottom:16px;
}

.draft-board {
  overflow-x:auto;
  border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.board-table {
  width:100%;
  border-collapse:collapse;
  font-size:.82rem;
}

.board-table th {
  font-family:'DM Mono', monospace;
  font-size:.65rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  padding:12px 14px;
  text-align:left;
  border-bottom:2px solid var(--border);
  background:var(--surface);
}

.board-table td {
  padding:12px 14px;
  border-bottom:1px solid rgba(30,39,64,.4);
}

.board-table tr:nth-child(even) {
  background:rgba(255,255,255,.03);
}

.pick-num {
  font-family:'Bebas Neue', sans-serif;
  font-size:1.25rem;
  color:var(--accent);
  width:48px;
}

.overall-num {
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  color:var(--accent2);
  white-space:nowrap;
  width:60px;
}

.selection-cell {
  font-weight:600;
  white-space:nowrap;
}

.selection-pos {
  font-family:'DM Mono', monospace;
  font-size:.7rem;
  color:var(--muted);
  margin-left:6px;
}

.injury-tag {
  font-family:'DM Mono', monospace;
  font-size:.62rem;
  font-weight:400;
  color:var(--danger);
  border:1px solid rgba(232,74,106,.4);
  border-radius:4px;
  padding:1px 5px;
  margin-left:8px;
  text-transform:uppercase;
  letter-spacing:1px;
  white-space:nowrap;
}

.record-line {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  letter-spacing:1px;
  margin-top:4px;
}

.roster-mix {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--accent2);
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}

.team-cell { font-weight:600; }

.team-link {
  color:var(--text);
  cursor:pointer;
  text-decoration:underline;
  text-decoration-color:rgba(232,200,74,.45);
  text-underline-offset:3px;
}

.team-link:hover { color:var(--accent); }

.team-with-avatar {
  display:flex;
  align-items:center;
  gap:8px;
}

.avatar {
  border-radius:50%;
  object-fit:cover;
  flex:none;
  vertical-align:middle;
}

.avatar-fallback {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--muted);
  font-family:'DM Mono', monospace;
  font-size:.68rem;
}

.origin-cell {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--accent2);
}

.same { color:var(--muted); }

.round-header td {
  background:var(--surface);
  font-family:'Bebas Neue', sans-serif;
  font-size:1rem;
  letter-spacing:2px;
  color:var(--muted);
  padding:10px 14px;
  border-bottom:2px solid var(--border);
}

.team-panel, .notes-panel, .settings-panel {
  margin-top:22px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
}

.team-panel-top, .notes-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.team-panel h2, .notes-top h2, .settings-panel h2 {
  font-family:'Bebas Neue', sans-serif;
  font-size:1.8rem;
  letter-spacing:2px;
  color:var(--accent);
}

.close-btn, .edit-btn, .save-btn, .cancel-btn, .delete-btn, .back-btn {
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:999px;
  padding:8px 14px;
  font-family:'DM Mono', monospace;
  cursor:pointer;
}

.edit-btn, .save-btn {
  border-color:var(--accent);
  color:var(--accent);
}

.delete-btn {
  border-color:var(--danger);
  color:var(--danger);
}

.back-btn {
  border-color:var(--accent);
  color:var(--accent);
  padding:8px 20px;
  margin-bottom:14px;
}

.modal-overlay {
  position:fixed;
  inset:0;
  background:rgba(5,8,14,.8);
  z-index:300;
  overflow-y:auto;
  padding:16px 12px 48px;
}

.modal-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  max-width:960px;
  margin:0 auto;
  padding:18px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}

.detail-grid {
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

@media (min-width:800px) {
  .detail-grid { grid-template-columns:1fr 1fr; }
}

.detail-box {
  background:rgba(0,0,0,.18);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
}

.detail-title {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
  margin:16px 0 10px;
}

.detail-title:first-child {
  margin-top:0;
}

.roster-list, .owned-picks-list, .notes-list, .list-stack {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.list-stack { gap:12px; }

.roster-row, .owned-pick-row {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 10px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(30,39,64,.5);
  border-radius:6px;
}

.player-name, .owned-pick-main {
  font-weight:600;
}

.player-pos, .owned-pick-sub {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
}

.matchup-grid {
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

@media (min-width:800px) {
  .matchup-grid { grid-template-columns:1fr 1fr; }
}

.matchup-card, .tx-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
}

.matchup-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:7px 0;
}

.matchup-points {
  font-family:'Bebas Neue', sans-serif;
  font-size:1.3rem;
  color:var(--muted);
}

.matchup-row.winner .matchup-points { color:var(--green); }
.matchup-row.winner .team-link { color:var(--green); }

.tx-top {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.tx-badge {
  font-family:'DM Mono', monospace;
  font-size:.62rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  border-radius:4px;
  padding:2px 8px;
  border:1px solid var(--border);
  color:var(--muted);
}

.tx-badge.trade { color:var(--accent); border-color:rgba(232,200,74,.5); }
.tx-badge.waiver { color:var(--accent2); border-color:rgba(74,157,232,.5); }
.tx-badge.free_agent { color:var(--green); border-color:rgba(74,232,160,.45); }
.tx-badge.commissioner { color:var(--danger); border-color:rgba(232,74,106,.45); }

.tx-date {
  font-family:'DM Mono', monospace;
  font-size:.7rem;
  color:var(--muted);
}

.tx-line { font-size:.88rem; padding:2px 0; }
.tx-add { color:var(--green); }
.tx-drop { color:var(--danger); }
.tx-pick { color:var(--accent2); }

.trend-grid {
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

@media (min-width:800px) {
  .trend-grid { grid-template-columns:1fr 1fr; }
}

.trend-count {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--accent2);
  white-space:nowrap;
}

.note-card {
  background:rgba(0,0,0,.22);
  border:1px solid rgba(232,200,74,.22);
  border-radius:10px;
  padding:16px;
}

.note-card-top {
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.note-card h3 {
  font-family:'Bebas Neue', sans-serif;
  letter-spacing:1.5px;
  color:var(--accent);
  font-size:1.35rem;
  margin-bottom:6px;
}

.note-card p {
  color:var(--text);
  font-size:.9rem;
}

.note-card-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.note-form {
  display:none;
  background:rgba(0,0,0,.22);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
  margin-bottom:16px;
}

.note-form.active { display:block; }

.note-input, .note-textarea, .settings-input {
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-family:'DM Sans', sans-serif;
  padding:12px;
  margin-bottom:10px;
}

.settings-input { font-family:'DM Mono', monospace; }

.note-textarea {
  min-height:90px;
  resize:vertical;
}

.note-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.hint {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  margin-bottom:14px;
}

.settings-error {
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  color:var(--danger);
  margin-bottom:10px;
}

.coach-sub {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  margin-bottom:16px;
}

.verdict {
  display:inline-block;
  font-family:'DM Mono', monospace;
  font-size:.66rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  border-radius:4px;
  padding:3px 9px;
  border:1px solid var(--border);
  color:var(--muted);
}

.verdict.contend { color:var(--green); border-color:rgba(74,232,160,.5); }
.verdict.rebuild { color:var(--accent2); border-color:rgba(74,157,232,.5); }

.need-bar-row {
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 0;
}

.need-bar-label {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  width:34px;
  flex:none;
}

.need-bar {
  flex:1;
  height:8px;
  background:rgba(255,255,255,.06);
  border-radius:999px;
  overflow:hidden;
}

.need-bar span {
  display:block;
  height:100%;
  border-radius:999px;
  background:var(--green);
}

.need-bar.weak span { background:var(--danger); }
.need-bar.mid span { background:var(--accent); }

.need-bar-note {
  font-family:'DM Mono', monospace;
  font-size:.68rem;
  color:var(--muted);
  width:82px;
  flex:none;
  text-align:right;
}

.trade-card {
  background:rgba(0,0,0,.22);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
}

.trade-side {
  display:flex;
  gap:8px;
  padding:5px 0;
  align-items:flex-start;
}

.trade-arrow {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  flex:none;
  width:58px;
}

.trade-arrow.get { color:var(--green); }
.trade-arrow.give { color:var(--danger); }

.trade-assets { font-size:.9rem; }

.trade-why {
  font-size:.84rem;
  color:var(--muted);
  border-top:1px solid var(--border);
  margin-top:10px;
  padding-top:10px;
}

.trade-why b { color:var(--text); font-weight:600; }

.news-title {
  font-weight:600;
  color:var(--accent);
  margin:2px 0 6px;
}

.news-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
}
.news-card summary {
  cursor:pointer;
  list-style:none;
}
.news-card summary::-webkit-details-marker { display:none; }
.news-sum-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:baseline;
  flex-wrap:wrap;
}
.news-headline {
  color:var(--text);
  font-weight:600;
  margin-top:4px;
}
.news-card[open] .news-headline { display:none; }
.news-body { margin-top:10px; }
.news-story {
  padding:10px 0;
  border-top:1px solid var(--border);
}
.news-story:first-child { border-top:none; padding-top:4px; }

.coach-modes { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.mode-btn {
  background:none; border:1px solid var(--border); color:var(--muted);
  font-family:'DM Mono', monospace; font-size:.72rem; letter-spacing:1.5px;
  text-transform:uppercase; padding:8px 16px; border-radius:999px; cursor:pointer;
}
.mode-btn.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }

.tb-teams { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
.tb-chip {
  display:inline-flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:999px; padding:6px 8px 6px 12px;
  font-family:'DM Mono', monospace; font-size:.78rem;
}
.tb-chip button { background:none; border:none; color:var(--danger); cursor:pointer; font-size:1rem; line-height:1; padding:0 2px; }
.tb-addteam { background:var(--surface); border:1px dashed var(--border); border-radius:999px; color:var(--muted); font-family:'DM Mono', monospace; font-size:.75rem; padding:7px 12px; }

.tb-board { display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:20px; }
@media (min-width:720px) { .tb-board.multi { grid-template-columns:repeat(2,1fr); } }

.tb-side h3 { font-family:'Bebas Neue', sans-serif; letter-spacing:1.5px; color:var(--accent); font-size:1.25rem; margin-bottom:8px; }
.tb-row { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:7px 9px; background:rgba(255,255,255,.03); border:1px solid rgba(30,39,64,.5); border-radius:6px; margin-bottom:6px; }
.tb-row .tb-meta { font-family:'DM Mono', monospace; font-size:.68rem; color:var(--muted); }
.tb-val { font-family:'DM Mono', monospace; font-size:.76rem; color:var(--accent); white-space:nowrap; }
.tb-add-btn { background:none; border:1px solid var(--accent); color:var(--accent); border-radius:999px; padding:3px 11px; font-family:'DM Mono', monospace; font-size:.7rem; cursor:pointer; white-space:nowrap; }
.tb-remove { background:none; border:none; color:var(--danger); cursor:pointer; font-size:1.1rem; line-height:1; }
.tb-side-total { font-family:'DM Mono', monospace; font-size:.8rem; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); color:var(--muted); }
.tb-net.pos { color:var(--green); }
.tb-net.neg { color:var(--danger); }

.tb-verdict { font-family:'DM Mono', monospace; font-size:.82rem; margin-bottom:16px; padding:12px 14px; border-radius:8px; border:1px solid var(--border); }
.tb-verdict.fair { color:var(--green); border-color:rgba(74,232,160,.4); background:rgba(74,232,160,.08); }
.tb-verdict.close { color:var(--accent); border-color:rgba(232,200,74,.4); background:rgba(232,200,74,.07); }
.tb-verdict.off { color:var(--danger); border-color:rgba(232,74,106,.4); background:rgba(232,74,106,.07); }

.tb-controls { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
.tb-controls label { font-family:'DM Mono', monospace; font-size:.7rem; letter-spacing:1px; text-transform:uppercase; color:var(--muted); display:flex; flex-direction:column; gap:5px; }

/* evaluator (RESULT) */
.tb-result { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:18px; }
.tb-result-head { font-family:'DM Mono', monospace; font-size:.72rem; letter-spacing:2px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.tb-result-msg { text-transform:none; letter-spacing:0; font-family:'DM Sans',sans-serif; font-size:.9rem; color:var(--text); }
.tb-grade { font-family:'Bebas Neue', sans-serif; font-size:1.35rem; letter-spacing:1px; line-height:1; }
.tb-grade.g-a { color:var(--green); }
.tb-grade.g-b { color:var(--accent2); }
.tb-grade.g-c { color:var(--accent); }
.tb-grade.g-d { color:var(--danger); }
.tb-side { border-top:1px solid var(--border); padding-top:12px; margin-top:12px; }
.tb-side:first-of-type { border-top:none; padding-top:0; margin-top:0; }
.tb-side-head { display:flex; align-items:center; gap:10px; font-family:'Bebas Neue',sans-serif; font-size:1.35rem; letter-spacing:1px; color:var(--accent); margin-bottom:8px; }
.tb-side-head .tb-meta { margin-left:auto; }
.tb-side-cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:560px){ .tb-side-cols { grid-template-columns:1fr; } }
.tb-colhead { display:flex; justify-content:space-between; font-family:'DM Mono',monospace; font-size:.72rem; margin-bottom:6px; }

/* column selector */
.tb-search-results { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; margin:10px 0 4px; }
.tb-cols { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; margin-top:12px; }
.tb-col { flex:0 0 240px; background:rgba(0,0,0,.18); border:1px solid var(--border); border-radius:10px; padding:10px; }

.tb-col-body { display:flex; flex-direction:column; gap:7px; max-height:460px; overflow-y:auto; }
.tb-pcard { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; cursor:pointer; }

.tb-pcard.added { opacity:.5; cursor:default; }

.tb-pcard-name { font-weight:600; font-size:.9rem; margin-top:3px; }

.pos-qb { background:rgba(232,74,106,.2); color:#e8607f; }

/* trade history */

@media (max-width:560px){ .th-sides { grid-template-columns:1fr; } }

<body>

<div class="header">
  <div class="header-top">
    <h1>Fantasy Football</h1>
    <span class="league-name" id="leagueName">Loading...</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="board" onclick="showTab('board')">Draft Board</button>
    <button class="tab" data-tab="standings" onclick="showTab('standings')">Draft Order</button>
    <button class="tab" data-tab="activity" onclick="showTab('activity')">Activity</button>
    <button class="tab" data-tab="coach" onclick="showTab('coach')">Trade Calc</button>
    <button class="tab" data-tab="news" onclick="showTab('news')">News</button>
    <button class="tab" data-tab="notes" onclick="showTab('notes')">League Notes</button>
    <button class="tab" data-tab="settings" onclick="showTab('settings')">Settings</button>
  </div>
</div>

<div class="content" id="mainContent">
  <div class="status">
    <div class="spinner"></div>
    <p>Fetching league data...</p>
  </div>
</div>

<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5FkmXaE_lgjZlowSBYN6NyLsiZV7FnyE",
  authDomain: "fantasy-football-f9b7a.firebaseapp.com",
  projectId: "fantasy-football-f9b7a",
  storageBucket: "fantasy-football-f9b7a.firebasestorage.app",
  messagingSenderId: "522378837469",
  appId: "1:522378837469:web:ae6c00679bb62246b3ca34"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const API = 'https://api.sleeper.app/v1';
const DEFAULT_LEAGUE_ID = '1330745662001659904';
const LEAGUE_ID_STORAGE_KEY = 'ff.leagueId';
const NOTE_PASSCODE = '2325';
const NOTES_COLLECTION = 'leagueNotes';
const MAX_WEEKS = 18;

const REAL_NAME_BY_SLEEPER_TEAM = {
  'nacua matada': 'Jaren',
  'ross': 'Ross',
  'dakota': 'Dakota',
  'linn': 'Linn',
  'darnell mooned me': 'Ryder',
  'they hit the second bower': 'Reese',
  'to infinity and bijan': 'Duke',
  'njigbas in paris': 'Dylan'
};

function getStoredLeagueId() {
  try {
    return localStorage.getItem(LEAGUE_ID_STORAGE_KEY) || DEFAULT_LEAGUE_ID;
  } catch(e) {
    return DEFAULT_LEAGUE_ID;
  }
}

let state = {};

function freshState() {
  return {
    leagueId: getStoredLeagueId(),
    league:null,
    users:[],
    rosters:[],
    tradedPicks:[],
    drafts:[],
    players:{},
    ownerMap:{},
    userByRosterId:{},
    draftDetails:{},
    draftPicksBySeason:{},
    nflState:null,
    availableYears:[],
    selectedDraftYear:null,
    selectedWeek:null,
    matchupsByWeek:{},
    transactions:null,
    transactionsLoading:false,
    brackets:null,
    bracketsLoading:false,
    trending:null,
    trendingLoading:false,
    vals:null,
    tradeHistory:null,
    tradeHistoryOpen:{},
    draftOrder:null,
    draftOrderLoading:false,
    newsTeam:null,
    newsByTeam:{},
    tb:null,
    coachMode:'build',
    coachRoster:'',
    activeTab:'board',
    notesUnlocked:false,
    editingNoteId:null,
    notes:[],
    settingsError:''
  };
}

state = freshState();

function normalizeName(name) {
  return String(name || '').trim().toLowerCase();
}

function currentSeasonYear() {
  return String(new Date().getFullYear());
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function getSleeperTeamName(user, rosterId) {
  if (user && user.metadata && user.metadata.team_name) return user.metadata.team_name;
  if (user && user.display_name) return user.display_name;
  return 'Team ' + rosterId;
}

function showLoading(message) {
  document.getElementById('mainContent').innerHTML = `
    <div class="status">
      <div class="spinner"></div>
      <p>${message || 'Fetching league data...'}</p>
    </div>
  `;
}

async function init() {
  // Capture the state object for this load: if the user switches leagues while
  // we're fetching, `state` is replaced and this stale run must not touch it.
  const s = state;

  showLoading();
  closeTeamCard();

  try {
    // Core league data — the site can't work without these three.
    const [league, users, rosters] = await Promise.all([
      fetchJSON(API + '/league/' + s.leagueId),
      fetchJSON(API + '/league/' + s.leagueId + '/users'),
      fetchJSON(API + '/league/' + s.leagueId + '/rosters')
    ]);

    s.league = league;
    s.users = users || [];
    s.rosters = rosters || [];

    // Everything else is best-effort: one failing endpoint shouldn't take the site down.
    const results = await Promise.allSettled([
      fetchJSON(API + '/league/' + s.leagueId + '/traded_picks'),
      fetchJSON(API + '/league/' + s.leagueId + '/drafts'),
      fetchJSON(API + '/players/nfl'),
      fetchJSON(API + '/state/nfl'),
      loadNotes()
    ]);

    s.tradedPicks = results[0].status === 'fulfilled' ? (results[0].value || []) : [];
    s.drafts = results[1].status === 'fulfilled' ? (results[1].value || []) : [];
    s.players = results[2].status === 'fulfilled' ? (results[2].value || {}) : {};
    s.nflState = results[3].status === 'fulfilled' ? results[3].value : null;

    const userById = {};
    s.users.forEach(u => userById[u.user_id] = u);

    s.rosters.forEach(r => {
      const u = userById[r.owner_id];
      const sleeperTeamName = getSleeperTeamName(u, r.roster_id);
      const realName = REAL_NAME_BY_SLEEPER_TEAM[normalizeName(sleeperTeamName)] || sleeperTeamName;
      s.ownerMap[String(r.roster_id)] = realName;
      s.userByRosterId[String(r.roster_id)] = u || null;
    });

    await Promise.all(
      s.drafts.filter(d => d.draft_id).map(async d => {
        try {
          const detail = await fetchJSON(API + '/draft/' + d.draft_id);
          s.draftDetails[String(d.season)] = detail;
        } catch(e) {}

        try {
          const picks = await fetchJSON(API + '/draft/' + d.draft_id + '/picks');
          if (picks && picks.length) {
            const byOverall = {};
            picks.forEach(p => { if (p.pick_no) byOverall[p.pick_no] = p; });
            s.draftPicksBySeason[String(d.season)] = byOverall;
          }
        } catch(e) {}
      })
    );

    const yearSet = new Set();

    s.drafts.forEach(d => {
      if (d.season) yearSet.add(String(d.season));
    });

    s.tradedPicks.forEach(p => {
      if (p.season) yearSet.add(String(p.season));
    });

    s.availableYears = Array.from(yearSet).sort((a,b) => Number(b) - Number(a));

    const thisYear = currentSeasonYear();

    s.selectedDraftYear = s.availableYears.includes(thisYear)
      ? thisYear
      : s.availableYears[0] || thisYear;

    if (s !== state) return;

    const headerBits = [league.name || 'Dynasty League'];
    if (league.season) headerBits.push(league.season);
    if (league.total_rosters) headerBits.push(league.total_rosters + ' Teams');
    document.getElementById('leagueName').textContent = headerBits.join(' · ');

    renderTab();

  } catch(e) {
    if (s !== state) return;

    document.getElementById('mainContent').innerHTML =
      '<div class="error-msg">Failed to load league ' + s.leagueId + ': ' + e.message +
      '<br><br><button class="edit-btn" onclick="showTab(\'settings\')">Open Settings</button></div>';
    document.getElementById('leagueName').textContent = 'League not loaded';
  }
}

function showTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(button => {
    button.classList.toggle('active', button.dataset.tab === tab);
  });
  renderTab();
}

function renderTab() {
  if (state.activeTab === 'notes') renderLeagueNotes();
  else if (state.activeTab === 'standings') renderDraftOrder();
  else if (state.activeTab === 'activity') renderActivity();
  else if (state.activeTab === 'coach') renderCoachTab();
  else if (state.activeTab === 'news') renderNews();
  else if (state.activeTab === 'settings') renderSettings();
  else renderDraftBoard();
}

/* ---------- shared team helpers ---------- */

function teamName(rosterId) {
  return state.ownerMap[String(rosterId)] || 'Roster ' + rosterId;
}

function avatarHtml(rosterId, size) {
  size = size || 22;
  const u = state.userByRosterId[String(rosterId)];
  const initial = teamName(rosterId).charAt(0).toUpperCase();

  if (u && u.avatar) {
    return `<img class="avatar" style="width:${size}px;height:${size}px"
      src="https://sleepercdn.com/avatars/thumbs/${u.avatar}" alt=""
      onerror="this.style.display='none'">`;
  }

  return `<span class="avatar avatar-fallback" style="width:${size}px;height:${size}px">${initial}</span>`;
}

function teamLink(rosterId, withAvatar) {
  const name = `<span class="team-link" onclick="openTeamCard('${String(rosterId)}')">${teamName(rosterId)}</span>`;
  if (!withAvatar) return name;
  return `<span class="team-with-avatar">${avatarHtml(rosterId)}${name}</span>`;
}

function getTeamRecord(roster) {
  const s = (roster && roster.settings) || {};
  return {
    wins: s.wins || 0,
    losses: s.losses || 0,
    ties: s.ties || 0,
    pf: (s.fpts || 0) + (s.fpts_decimal || 0) / 100,
    pa: (s.fpts_against || 0) + (s.fpts_against_decimal || 0) / 100
  };
}

function formatRecord(rec) {
  return rec.wins + '-' + rec.losses + (rec.ties ? '-' + rec.ties : '');
}

function leagueDraftRounds() {
  if (state.league && state.league.settings && state.league.settings.draft_rounds) {
    return parseInt(state.league.settings.draft_rounds, 10);
  }
  return 5;
}

/* ---------- draft board ---------- */

function isRoundReversed(round, detail) {
  const type = detail && detail.type ? detail.type : 'snake';
  if (type !== 'snake') return false;

  const reversalRound = detail && detail.settings && detail.settings.reversal_round
    ? parseInt(detail.settings.reversal_round, 10)
    : 0;

  let reversed = false;
  for (let r = 2; r <= Number(round); r++) {
    // At the reversal round (e.g. 3rd-round reversal) the direction repeats once,
    // then keeps alternating as usual.
    if (!(reversalRound > 0 && r === reversalRound)) reversed = !reversed;
  }
  return reversed;
}

function getPickPosition(year, originalRosterId, round) {
  const detail = state.draftDetails[String(year)];
  if (!detail || !detail.slot_to_roster_id) return null;

  const slotMap = detail.slot_to_roster_id;
  const slots = Object.keys(slotMap).map(Number).sort((a,b) => a - b);
  let order = slots.map(s => String(slotMap[String(s)]));

  if (isRoundReversed(round, detail)) order = [...order].reverse();

  const index = order.findIndex(rid => String(rid) === String(originalRosterId));
  if (index === -1) return null;

  return {
    slot: `${round}.${String(index + 1).padStart(2, '0')}`,
    overall: (Number(round) - 1) * order.length + index + 1
  };
}

function buildFinalOwnerMap(yearPicks) {
  const groups = {};

  yearPicks.forEach(p => {
    const key = String(p.roster_id) + '_' + String(p.round);
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  const result = {};

  Object.keys(groups).forEach(key => {
    const records = groups[key];

    if (records.length === 1) {
      result[key] = String(records[0].owner_id);
    } else {
      const allPreviousOwners = new Set(records.map(r => String(r.previous_owner_id)));
      const terminal = records.find(r => !allPreviousOwners.has(String(r.owner_id)));

      result[key] = terminal
        ? String(terminal.owner_id)
        : String(records[records.length - 1].owner_id);
    }
  });

  return result;
}

function getCurrentOwnerForPick(year, originalRosterId, round) {
  const yearPicks = state.tradedPicks.filter(p => String(p.season) === String(year));
  const finalOwnerMap = buildFinalOwnerMap(yearPicks);
  const key = String(originalRosterId) + '_' + String(round);

  return finalOwnerMap[key] || String(originalRosterId);
}

function getAllOwnedPicks(rosterId) {
  const owned = [];

  state.availableYears.forEach(year => {
    const draftForYear = state.drafts.find(d => String(d.season) === String(year));
    const detail = state.draftDetails[String(year)];

    // Once a draft is complete its picks have been used (they're players now),
    // so they're no longer tradeable assets.
    if (detail && detail.status === 'complete') return;

    let originalRosterIds = Object.keys(state.ownerMap).sort((a,b) => Number(a) - Number(b));
    let numRounds = leagueDraftRounds();

    if (detail && detail.slot_to_roster_id) {
      originalRosterIds = Object.values(detail.slot_to_roster_id).map(String);

      if (detail.settings && detail.settings.rounds) {
        numRounds = parseInt(detail.settings.rounds, 10);
      }
    } else if (draftForYear && draftForYear.settings && draftForYear.settings.rounds) {
      numRounds = parseInt(draftForYear.settings.rounds, 10);
    }

    for (let round = 1; round <= numRounds; round++) {
      originalRosterIds.forEach(originalRosterId => {
        const currentOwner = getCurrentOwnerForPick(year, originalRosterId, round);

        if (String(currentOwner) === String(rosterId)) {
          const pos = getPickPosition(year, originalRosterId, round);

          owned.push({
            year,
            round,
            exactSlot: pos ? pos.slot : '',
            overall: pos ? pos.overall : null,
            originalRosterId,
            origName: teamName(originalRosterId)
          });
        }
      });
    }
  });

  return owned.sort((a,b) => {
    if (Number(a.year) !== Number(b.year)) return Number(a.year) - Number(b.year);
    if (Number(a.round) !== Number(b.round)) return Number(a.round) - Number(b.round);
    return (a.exactSlot || '').localeCompare(b.exactSlot || '');
  });
}

function renderDraftBoard() {
  const year = state.selectedDraftYear;
  const draftForYear = state.drafts.find(d => String(d.season) === String(year));
  const detail = state.draftDetails[String(year)];
  const draftedByOverall = state.draftPicksBySeason[String(year)] || null;

  let snakeOrder = [];
  let hasExactDraftOrder = false;
  let numRounds = leagueDraftRounds();

  if (detail && detail.slot_to_roster_id) {
    const slotMap = detail.slot_to_roster_id;
    const slots = Object.keys(slotMap).map(Number).sort((a,b) => a - b);

    snakeOrder = slots.map(s => String(slotMap[String(s)]));
    hasExactDraftOrder = true;

    if (detail.settings && detail.settings.rounds) {
      numRounds = parseInt(detail.settings.rounds, 10);
    }
  } else {
    snakeOrder = Object.keys(state.ownerMap)
      .map(Number)
      .sort((a,b) => a - b)
      .map(String);

    if (draftForYear && draftForYear.settings && draftForYear.settings.rounds) {
      numRounds = parseInt(draftForYear.settings.rounds, 10);
    }
  }

  const yearPicks = state.tradedPicks.filter(p => String(p.season) === String(year));
  const finalOwnerMap = buildFinalOwnerMap(yearPicks);
  const showSelections = !!draftedByOverall;

  let html = `
    <div class="year-selector">
      <span class="section-label" style="margin:0;">Draft Board</span>

      <select class="year-select" onchange="selectDraftYear(this.value)">
        ${state.availableYears.map(y => `
          <option value="${y}" ${String(y) === String(year) ? 'selected' : ''}>${y}</option>
        `).join('')}
      </select>
    </div>
  `;

  if (hasExactDraftOrder) {
    let banner = `Real draft order from Sleeper · ${year} · ${numRounds} rounds · ${snakeOrder.length} teams`;

    if (detail.status === 'complete') {
      banner += ' · Draft complete';
    } else if (detail.status === 'drafting') {
      banner += ' · Draft in progress';
    } else if (detail.status === 'pre_draft' && detail.start_time) {
      banner += ' · Draft: ' + new Date(detail.start_time).toLocaleString(undefined, {
        month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'
      });
    }

    html += `<div class="info-banner">${banner}</div>`;
  } else {
    html += `<div class="info-banner">Draft order not set yet for ${year} — showing pick ownership by round</div>`;
  }

  html += `<div class="section-label">${year} Draft — ${numRounds} Rounds</div>`;
  html += `<div class="draft-board"><table class="board-table">`;

  let headers = '';
  let colCount = 2;

  if (hasExactDraftOrder) {
    headers += `<th>Pick</th><th>Overall</th>`;
    colCount += 2;
  }

  headers += `<th>Pick Goes To</th>`;

  if (showSelections) {
    headers += `<th>Selection</th>`;
    colCount += 1;
  }

  headers += `<th>Original Slot</th>`;

  html += `<thead><tr>${headers}</tr></thead><tbody>`;

  for (let round = 1; round <= numRounds; round++) {
    html += `<tr class="round-header"><td colspan="${colCount}">Round ${round}</td></tr>`;

    const roundOrder = hasExactDraftOrder && isRoundReversed(round, detail)
      ? [...snakeOrder].reverse()
      : snakeOrder;

    roundOrder.forEach((origRosterId, idx) => {
      const key = String(origRosterId) + '_' + String(round);
      const currentOwner = finalOwnerMap[key] || String(origRosterId);
      const isSame = String(currentOwner) === String(origRosterId);

      html += '<tr>';

      if (hasExactDraftOrder) {
        const slot = `${round}.${String(idx + 1).padStart(2, '0')}`;
        const overall = (round - 1) * roundOrder.length + idx + 1;
        html += `<td class="pick-num">${slot}</td><td class="overall-num">#${overall}</td>`;
      }

      html += `<td class="team-cell">${teamLink(currentOwner)}</td>`;

      if (showSelections) {
        const overall = (round - 1) * roundOrder.length + idx + 1;
        const pick = draftedByOverall[overall];

        if (pick) {
          const md = pick.metadata || {};
          const pname = (md.first_name && md.last_name)
            ? md.first_name + ' ' + md.last_name
            : playerDisplayName(pick.player_id);
          const ppos = md.position || playerPositionOf(pick.player_id);
          html += `<td class="selection-cell">${pname}<span class="selection-pos">${ppos || ''}</span></td>`;
        } else {
          html += `<td class="selection-cell"><span class="selection-pos">—</span></td>`;
        }
      }

      html += `<td class="origin-cell ${isSame ? 'same' : ''}">${isSame ? '—' : teamName(origRosterId)}</td>`;
      html += '</tr>';
    });
  }

  html += `</tbody></table></div>`;

  document.getElementById('mainContent').innerHTML = html;
}

function selectDraftYear(year) {
  state.selectedDraftYear = year;
  renderDraftBoard();
}

/* ---------- players ---------- */

function playerDisplayName(playerId) {
  const p = state.players[String(playerId)];
  if (!p) return 'Player ' + playerId;

  return p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || 'Player ' + playerId;
}

function playerPositionOf(playerId) {
  const p = state.players[String(playerId)];
  return (p && p.position) || '';
}

function playerMeta(playerId) {
  const p = state.players[String(playerId)];
  if (!p) return '';

  const parts = [];
  if (p.position) parts.push(p.position);
  if (p.team) parts.push(p.team);
  if (p.age) parts.push('Age ' + p.age);

  return parts.join(' · ');
}

function playerInjuryTag(playerId) {
  const p = state.players[String(playerId)];
  if (!p || !p.injury_status) return '';
  return `<span class="injury-tag">${p.injury_status}</span>`;
}

function playerRow(pid) {
  return `
    <div class="roster-row">
      <span class="player-name">${playerDisplayName(pid)}${playerInjuryTag(pid)}</span>
      <span class="player-pos">${playerMeta(pid)}</span>
    </div>
  `;
}

function playerSection(title, list) {
  return `
    <div class="detail-title">${title} (${list.length})</div>
    <div class="roster-list">
      ${list.length ? list.map(playerRow).join('') : '<div class="empty">None</div>'}
    </div>
  `;
}

function rosterPositionMix(playerIds) {
  const counts = {};

  playerIds.forEach(pid => {
    const p = state.players[String(pid)];
    const pos = (p && p.position) || 'N/A';
    counts[pos] = (counts[pos] || 0) + 1;
  });

  const order = ['QB','RB','WR','TE','K','DEF'];
  const known = order.filter(pos => counts[pos]).map(pos => counts[pos] + ' ' + pos);
  const other = Object.keys(counts)
    .filter(pos => !order.includes(pos))
    .sort()
    .map(pos => counts[pos] + ' ' + pos);

  return known.concat(other).join(' · ');
}

/* ---------- coach: valuation model ---------- */

// Player and pick values come from KeepTradeCut, via the DynastyProcess data feed —
// crowd-sourced dynasty trade values. We read the 2-QB (superflex) column when the
// league is superflex, otherwise the 1-QB column. These are the same numbers shown on
// KeepTradeCut / FantasyCalc / DynastyCalc.
const STARTABLE_DEPTH = { QB:16, RB:24, WR:24, TE:10 };

// Tiny fallback so deep players KTC doesn't price still sort sensibly beneath everyone
// who does have a market value.
const FALLBACK_PEAK = { QB:650, RB:750, WR:750, TE:450 };
const INJURY_DISCOUNT = { IR:0.72, PUP:0.80, Out:0.80, NA:0.85, Sus:0.82, DNR:0.75, COV:0.95, Questionable:0.97 };

// Older players help you win now more than their dynasty price implies (and young upside
// is the reverse). A light tilt used only to split contenders from rebuilders.
const WINNOW_AGE = {
  QB: [[25,0.90],[30,1.0],[34,1.12],[99,1.20]],
  RB: [[23,0.86],[26,1.0],[28,1.12],[99,1.22]],
  WR: [[24,0.88],[28,1.0],[30,1.12],[99,1.20]],
  TE: [[25,0.90],[30,1.0],[99,1.12]]
};

const VALUES_CSV = 'https://raw.githubusercontent.com/dynastyprocess/data/master/files/values.csv';

function splitCsvLine(line) {
  const out = [];
  let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') { q = true; }
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/);
  const header = splitCsvLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i]) continue;
    const cells = splitCsvLine(lines[i]);
    const row = {};
    header.forEach((h, j) => row[h] = cells[j]);
    rows.push(row);
  }
  return rows;
}

function ktcNameKey(name) {
  return String(name || '').toLowerCase()
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '')
    .replace(/[^a-z]/g, '');
}

// Loads KeepTradeCut dynasty values and indexes them by Sleeper player id (matched by
// name+position against the already-loaded player DB), plus a pick-label -> value map.
async function loadValues() {
  const s = state;
  if (s.vals) return s.vals;

  let rows;
  try {
    const r = await fetch(VALUES_CSV);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    rows = parseCsv(await r.text());
  } catch (e) {
    const failed = { byId:{}, picks:{}, ok:false, err:e.message };
    if (s === state) s.vals = failed;
    return failed;
  }

  const nameIdx = {};
  Object.keys(s.players).forEach(pid => {
    const p = s.players[pid];
    if (!p || ['QB','RB','WR','TE'].indexOf(p.position) === -1) return;
    const k = ktcNameKey(p.full_name) + '|' + p.position;
    if (!nameIdx[k] || (p.active && p.team)) nameIdx[k] = pid;
  });

  const sf = isSuperflex();
  const col = sf ? 'value_2qb' : 'value_1qb';
  const byId = {};
  const picks = {};

  rows.forEach(row => {
    const val = Number(row[col]) || 0;
    if (row.pos === 'PICK') { picks[row.player] = val; return; }
    if (['QB','RB','WR','TE'].indexOf(row.pos) === -1) return;
    const pid = nameIdx[ktcNameKey(row.player) + '|' + row.pos];
    if (pid) byId[String(pid)] = { value: val, age: Number(row.age) || null };
  });

  const posLists = { QB:[], RB:[], WR:[], TE:[] };
  Object.keys(byId).forEach(pid => {
    const pos = (s.players[pid] || {}).position;
    if (posLists[pos]) posLists[pos].push(pid);
  });
  Object.keys(posLists).forEach(pos => {
    posLists[pos].sort((a,b) => byId[b].value - byId[a].value);
    posLists[pos].forEach((pid, i) => byId[pid].posRank = i + 1);
  });

  const vals = { byId:byId, picks:picks, ok:true, sf:sf };
  if (s === state) s.vals = vals;
  return vals;
}

async function fetchGraphQL(query) {
  const r = await fetch('https://sleeper.com/graphql', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: query })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function isSuperflex() {
  const rp = (state.league && state.league.roster_positions) || [];
  return rp.indexOf('SUPER_FLEX') !== -1 || rp.filter(p => p === 'QB').length > 1;
}

function starterCounts() {
  const rp = (state.league && state.league.roster_positions) || [];
  const c = { QB:0, RB:0, WR:0, TE:0, FLEX:0, SUPER_FLEX:0 };
  rp.forEach(p => { if (c[p] !== undefined) c[p]++; });
  if (!c.QB && !c.SUPER_FLEX) c.QB = 1;
  if (!c.RB) c.RB = 2;
  if (!c.WR) c.WR = 2;
  if (!c.TE) c.TE = 1;
  return c;
}

function buildValueModel() {
  const sf = isSuperflex();
  const vals = state.vals || { byId:{}, picks:{} };

  // Fallback ordering (Sleeper search_rank within position) only affects deep players
  // KTC doesn't price — real starters are always on its board.
  const byPos = { QB:[], RB:[], WR:[], TE:[] };
  Object.keys(state.players).forEach(pid => {
    const p = state.players[pid];
    if (!p || !p.active || !p.team) return;
    if (typeof p.search_rank !== 'number' || p.search_rank >= 9000) return;
    if (!byPos[p.position]) return;
    byPos[p.position].push(p);
  });

  const fbRank = {};
  Object.keys(byPos).forEach(pos => {
    byPos[pos].sort((a,b) =>
      (a.search_rank - b.search_rank) || String(a.full_name||'').localeCompare(String(b.full_name||''))
    );
    byPos[pos].forEach((p, i) => fbRank[String(p.player_id)] = i + 1);
  });

  const baseCache = {};
  const dynCache = {};

  function winNowMult(pos, age) {
    const curve = WINNOW_AGE[pos];
    if (!curve || age == null) return 1;
    for (let i = 0; i < curve.length; i++) if (age <= curve[i][0]) return curve[i][1];
    return 1;
  }

  // Dynasty (long-term) value: the KTC market value.
  function dynValue(pid) {
    const key = String(pid);
    if (dynCache[key] !== undefined) return dynCache[key];

    let v = 0;
    const f = vals.byId[key];
    if (f) {
      v = f.value;
    } else {
      const p = state.players[key];
      const r = fbRank[key];
      if (p && r && FALLBACK_PEAK[p.position]) {
        v = FALLBACK_PEAK[p.position] * Math.exp(-(r - 1) / 8) * (INJURY_DISCOUNT[p.injury_status] || 1);
      }
    }
    dynCache[key] = v;
    return v;
  }

  // Win-now proxy: dynasty value tilted by age (KTC has no separate redraft column).
  function baseValue(pid) {
    const key = String(pid);
    if (baseCache[key] !== undefined) return baseCache[key];
    const p = state.players[key] || {};
    const f = vals.byId[key];
    const age = f && f.age != null ? f.age : p.age;
    const v = dynValue(key) * winNowMult(p.position, age);
    baseCache[key] = v;
    return v;
  }

  function posRankOf(pid) {
    const f = vals.byId[String(pid)];
    if (f && f.posRank) return f.posRank;
    return fbRank[String(pid)] || null;
  }

  function startable(pid) {
    const p = state.players[String(pid)];
    if (!p) return false;
    const r = posRankOf(pid);
    return !!(r && STARTABLE_DEPTH[p.position] && r <= STARTABLE_DEPTH[p.position]);
  }

  return { sf, baseValue, dynValue, startable, posRank: posRankOf };
}

const ROUND_ORD = { 1:'1st', 2:'2nd', 3:'3rd', 4:'4th' };

// Maps a pick to its KTC value: exact enumerated slot when the order is known (current
// rookie class), otherwise the Early/Mid/Late tier, then the plain round value.
function pickValue(year, round, overall, numTeams) {
  const picks = (state.vals && state.vals.picks) || {};
  const nt = numTeams || 12;
  const ord = ROUND_ORD[round];

  if (overall) {
    const slot = overall - (round - 1) * nt;
    if (slot >= 1) {
      const exact = picks[year + ' Pick ' + round + '.' + String(slot).padStart(2, '0')];
      if (exact != null) return exact;
    }
  }

  if (ord) {
    let tier = 'Mid';
    if (overall) {
      const frac = (overall - (round - 1) * nt) / nt;
      tier = frac <= 1/3 ? 'Early' : (frac <= 2/3 ? 'Mid' : 'Late');
    }
    const tiered = picks[year + ' ' + tier + ' ' + ord];
    if (tiered != null) return tiered;

    const generic = picks[year + ' ' + ord];
    if (generic != null) return generic;
  }

  // Rounds 5+ (or a year KTC doesn't list) — decay from that year's 4th.
  const anchor = picks[year + ' 4th'] || picks['2028 4th'] || 20;
  return anchor * Math.pow(0.5, Math.max(1, round - 4));
}

function coachPicks(rosterId) {
  const nt = state.rosters.length || 12;
  return getAllOwnedPicks(rosterId).map(p => ({
    label: p.exactSlot ? (p.year + ' ' + p.exactSlot) : (p.year + ' R' + p.round),
    year: p.year,
    round: p.round,
    overall: p.overall,
    value: pickValue(p.year, p.round, p.overall, nt)
  })).sort((a,b) => b.value - a.value);
}

function optimalLineup(playerIds, M) {
  const counts = starterCounts();
  const byPos = {};
  playerIds.forEach(pid => {
    const pos = playerPositionOf(pid);
    if (!byPos[pos]) byPos[pos] = [];
    byPos[pos].push(pid);
  });
  Object.keys(byPos).forEach(k => byPos[k].sort((a,b) => M.baseValue(b) - M.baseValue(a)));

  const used = {};
  const picked = [];
  let total = 0;
  let filled = true;

  ['QB','RB','WR','TE'].forEach(pos => {
    const need = counts[pos] || 0;
    const have = (byPos[pos] || []).filter(p => !used[p]);
    if (have.length < need) filled = false;
    have.slice(0, need).forEach(p => { used[p] = 1; picked.push(p); total += M.baseValue(p); });
  });

  for (let i = 0; i < (counts.FLEX || 0); i++) {
    const pool = playerIds.filter(p => !used[p] && ['RB','WR','TE'].indexOf(playerPositionOf(p)) !== -1)
      .sort((a,b) => M.baseValue(b) - M.baseValue(a));
    if (!pool.length) { filled = false; break; }
    used[pool[0]] = 1; picked.push(pool[0]); total += M.baseValue(pool[0]);
  }

  for (let i = 0; i < (counts.SUPER_FLEX || 0); i++) {
    const pool = playerIds.filter(p => !used[p] && ['QB','RB','WR','TE'].indexOf(playerPositionOf(p)) !== -1)
      .sort((a,b) => M.baseValue(b) - M.baseValue(a));
    if (!pool.length) { filled = false; break; }
    used[pool[0]] = 1; picked.push(pool[0]); total += M.baseValue(pool[0]);
  }

  return { total, filled, picked };
}

function analyzeTeam(rosterId, M) {
  const roster = state.rosters.find(r => String(r.roster_id) === String(rosterId));
  const players = ((roster && roster.players) || []).map(String);

  const byPos = {};
  players.forEach(pid => {
    const pos = playerPositionOf(pid);
    if (!byPos[pos]) byPos[pos] = [];
    byPos[pos].push(pid);
  });
  Object.keys(byPos).forEach(k => byPos[k].sort((a,b) => M.baseValue(b) - M.baseValue(a)));

  const lineup = optimalLineup(players, M);
  const picks = coachPicks(rosterId);
  const counts = starterCounts();

  // Strength at each starting spot = average value of the players who'd fill it.
  const strength = {};
  ['QB','RB','WR','TE'].forEach(pos => {
    const req = (counts[pos] || 0) + (pos === 'QB' && M.sf ? (counts.SUPER_FLEX || 0) : 0);
    const need = Math.max(1, req);
    const have = (byPos[pos] || []).slice(0, need).map(p => M.baseValue(p));
    while (have.length < need) have.push(0);
    strength[pos] = have.reduce((a,b) => a + b, 0) / need;
  });

  const future = players.reduce((sum,p) => sum + M.dynValue(p), 0)
    + picks.reduce((sum,p) => sum + p.value, 0);

  const weighted = players.filter(p => M.baseValue(p) > 500 && state.players[p] && state.players[p].age);
  const wAge = weighted.length
    ? weighted.reduce((s,p) => s + state.players[p].age * M.baseValue(p), 0) /
      weighted.reduce((s,p) => s + M.baseValue(p), 0)
    : 26;

  return { rosterId:String(rosterId), players, byPos, lineup, picks, strength,
           now:lineup.total, future, age:wAge, roster };
}

function analyzeLeague() {
  const M = buildValueModel();
  const teams = {};
  state.rosters.forEach(r => teams[String(r.roster_id)] = analyzeTeam(r.roster_id, M));

  const ids = Object.keys(teams);
  const nows = ids.map(i => teams[i].now).sort((a,b) => a - b);
  const median = nows[Math.floor(nows.length / 2)];

  const avg = {};
  ['QB','RB','WR','TE'].forEach(pos => {
    avg[pos] = ids.reduce((s,i) => s + teams[i].strength[pos], 0) / ids.length;
  });

  ids.forEach(i => {
    const t = teams[i];
    t.mode = t.now >= median ? 'contend' : 'rebuild';
    t.wNow = t.mode === 'contend' ? 0.72 : 0.32;
    t.pickMult = t.mode === 'contend' ? 0.82 : 1.18;
    t.deficit = {};
    t.posMult = {};
    ['QB','RB','WR','TE'].forEach(pos => {
      t.deficit[pos] = avg[pos] > 0 ? Math.max(0, (avg[pos] - t.strength[pos]) / avg[pos]) : 0;
      t.posMult[pos] = 1 + 0.5 * t.deficit[pos];
    });
  });

  return { M, teams, avg, median };
}

/* ---------- coach: trade engine ---------- */

function valueTo(team, pid, M) {
  const v = team.wNow * M.baseValue(pid) + (1 - team.wNow) * M.dynValue(pid);
  return v * (team.posMult[playerPositionOf(pid)] || 1);
}

function surplusPlayers(team, M) {
  const keep = { QB: M.sf ? 2 : 1, RB:3, WR:3, TE:1 };
  const out = [];

  Object.keys(team.byPos).forEach(pos => {
    if (!keep[pos]) return;

    // A rebuilding team should be willing to sell its win-now piece at a spot
    // it's already strong at — that's the whole point of rebuilding.
    const floor = (team.mode === 'rebuild' && team.deficit[pos] === 0) ? 0 : 1;

    team.byPos[pos].forEach((pid, i) => {
      if (M.baseValue(pid) < 350) return;
      if (i >= keep[pos] || (i >= floor && team.deficit[pos] === 0)) out.push(pid);
    });
  });

  return out.sort((a,b) => M.dynValue(b) - M.dynValue(a));
}

function teamWants(team, pid, M) {
  const pos = playerPositionOf(pid);
  if (!team.deficit[pos] && team.deficit[pos] !== 0) return false;

  const counts = starterCounts();
  const req = pos === 'QB' && M.sf
    ? (counts.QB || 0) + (counts.SUPER_FLEX || 0)
    : (counts[pos] || 1);

  const current = (team.byPos[pos] || []).filter(p => M.startable(p));

  // Already stacked at this spot — only a genuine upgrade on their best moves the needle.
  if (current.length > req + 1) {
    return M.baseValue(pid) > M.baseValue(current[0]) * 1.15;
  }
  if (team.deficit[pos] > 0.05) return true;

  const worst = current.length >= req ? M.baseValue(current[req - 1]) : 0;
  return M.baseValue(pid) > worst * 1.25;
}

function combosOf(items, maxN) {
  const res = [];
  const rec = (start, cur, n) => {
    if (cur.length === n) { res.push(cur.slice()); return; }
    for (let i = start; i < items.length; i++) {
      cur.push(items[i]);
      rec(i + 1, cur, n);
      cur.pop();
    }
  };
  for (let n = 1; n <= maxN; n++) rec(0, [], n);
  return res;
}

function tradeViable(team, lose, gain, picksOut, picksIn, M) {
  const loseSet = {};
  lose.forEach(p => loseSet[p] = 1);
  const after = team.players.filter(p => !loseSet[p]).concat(gain);

  const line = optimalLineup(after, M);
  if (!line.filled) return false;

  if (M.sf) {
    const qbs = after.filter(p => playerPositionOf(p) === 'QB')
      .sort((a,b) => M.baseValue(b) - M.baseValue(a));
    if (qbs.length < 2 || M.baseValue(qbs[1]) < 250) return false;
  }

  const outSet = {};
  picksOut.forEach(p => outSet[p.label + '|' + p.value] = 1);

  const futureAfter = after.reduce((s,p) => s + M.dynValue(p), 0)
    + team.picks.filter(p => !outSet[p.label + '|' + p.value]).reduce((s,p) => s + p.value, 0)
    + picksIn.reduce((s,p) => s + p.value, 0);

  // Contenders can't get worse right now; rebuilders must actually gain future value.
  return team.mode === 'contend'
    ? line.total >= team.now * 0.97
    : futureAfter >= team.future * 1.01;
}

function findTrades(meId, league, limit) {
  const M = league.M;
  const me = league.teams[String(meId)];
  const out = [];

  const myPlayers = surplusPlayers(me, M).slice(0, 8);
  const myPicks = me.picks.filter(p => p.value > 700).slice(0, 9);
  const giveOptions = combosOf(
    myPlayers.map(x => ({ t:'p', x })).concat(myPicks.map(x => ({ t:'k', x }))), 3);

  Object.keys(league.teams).forEach(otherId => {
    if (String(otherId) === String(meId)) return;
    const other = league.teams[otherId];

    const theirPlayers = surplusPlayers(other, M).filter(p => teamWants(me, p, M)).slice(0, 6);
    const theirPicks = other.picks.filter(p => p.value > 1500).slice(0, 2);
    const getOptions = combosOf(
      theirPlayers.map(x => ({ t:'p', x })).concat(theirPicks.map(x => ({ t:'k', x }))), 2);

    getOptions.forEach(get => {
      const gp = get.filter(i => i.t === 'p').map(i => i.x);
      const gk = get.filter(i => i.t === 'k').map(i => i.x);
      const getN = gp.reduce((s,p) => s + M.dynValue(p), 0) + gk.reduce((s,p) => s + p.value, 0);
      if (getN < 900) return;

      giveOptions.forEach(give => {
        const sp = give.filter(i => i.t === 'p').map(i => i.x);
        const sk = give.filter(i => i.t === 'k').map(i => i.x);
        const giveN = sp.reduce((s,p) => s + M.dynValue(p), 0) + sk.reduce((s,p) => s + p.value, 0);
        if (giveN <= 0) return;

        // Fair on a neutral dynasty board, and never a recommendation to overpay.
        if (Math.abs(giveN - getN) / Math.max(giveN, getN) > 0.15) return;
        if (getN < giveN * 0.90) return;
        if (sp.length && !sp.some(p => teamWants(other, p, M))) return;

        const myGain = gp.reduce((s,p) => s + valueTo(me,p,M), 0) + gk.reduce((s,p) => s + p.value*me.pickMult, 0)
                     - sp.reduce((s,p) => s + valueTo(me,p,M), 0) - sk.reduce((s,p) => s + p.value*me.pickMult, 0);
        const thGain = sp.reduce((s,p) => s + valueTo(other,p,M), 0) + sk.reduce((s,p) => s + p.value*other.pickMult, 0)
                     - gp.reduce((s,p) => s + valueTo(other,p,M), 0) - gk.reduce((s,p) => s + p.value*other.pickMult, 0);
        if (myGain <= 50 || thGain <= 50) return;

        if (!tradeViable(me, sp, gp, sk, gk, M)) return;
        if (!tradeViable(other, gp, sp, gk, sk, M)) return;

        out.push({ otherId:String(otherId), gp, gk, sp, sk, myGain, thGain,
                   score: Math.min(myGain, thGain), getN, giveN });
      });
    });
  });

  out.sort((a,b) => b.score - a.score);

  // One suggestion per partner keeps the board varied.
  const seen = {};
  const final = [];
  out.forEach(t => {
    if (seen[t.otherId]) return;
    seen[t.otherId] = 1;
    final.push(t);
  });

  return final.slice(0, limit || 5);
}

/* ---------- coach: report ---------- */

function assetLabel(pid, M) {
  const p = state.players[String(pid)] || {};
  const bits = [p.position, p.team, p.age ? 'age ' + p.age : ''].filter(Boolean).join(' · ');
  const r = M.posRank(pid);
  return `<b>${playerDisplayName(pid)}</b> <span class="player-pos">${bits}${r ? ' · ' + p.position + r : ''}</span>`;
}

function packageHtml(players, picks, M) {
  return players.map(p => assetLabel(p, M))
    .concat(picks.map(k => `<b>${k.label}</b>`))
    .join('<br>');
}

function weakestSpots(team) {
  return ['QB','RB','WR','TE']
    .filter(pos => team.deficit[pos] > 0.05)
    .sort((a,b) => team.deficit[b] - team.deficit[a]);
}

function tradeRationale(t, me, other, M) {
  const myGot = {};
  t.gp.forEach(p => myGot[playerPositionOf(p)] = 1);
  const fixes = Object.keys(myGot).filter(pos => me.deficit[pos] > 0.05);

  const theirGot = {};
  t.sp.forEach(p => theirGot[playerPositionOf(p)] = 1);
  const theirFixes = Object.keys(theirGot).filter(pos => other.deficit[pos] > 0.05);

  const youBits = [];
  if (fixes.length) youBits.push('upgrades your weakest starting spot' + (fixes.length > 1 ? 's' : '') + ' (' + fixes.join(', ') + ')');
  if (t.gk.length) youBits.push('adds draft capital');
  if (t.sk.length) youBits.push('spends from your ' + me.picks.length + '-pick stockpile instead of your starters');
  if (t.sp.length && !fixes.length) youBits.push('converts surplus depth into a better starter');
  if (!youBits.length) youBits.push('nets you more value than it costs');

  const themBits = [];
  if (theirFixes.length) themBits.push('fills their ' + theirFixes.join('/') + ' hole');
  if (other.mode === 'rebuild') {
    if (t.sk.length) themBits.push('they are rebuilding and bank future picks');
    else themBits.push('they are rebuilding and get the younger side of the deal');
  } else {
    themBits.push('they are contending and this makes their lineup better now');
  }

  const oldest = t.sp.concat(t.gp)
    .map(p => state.players[String(p)])
    .filter(p => p && p.age);

  let note = '';
  const risky = t.gp.filter(p => {
    const pl = state.players[String(p)];
    return pl && pl.injury_status;
  });
  if (risky.length) {
    note = ' Heads up: ' + risky.map(p =>
      playerDisplayName(p) + ' is listed ' + state.players[String(p)].injury_status).join(', ') + '.';
  }

  return `<b>Why you do it:</b> ${youBits.join('; ')}. <b>Why they say yes:</b> ${themBits.join('; ')}.${note}`;
}

function coachReport(rosterId) {
  const league = analyzeLeague();
  const M = league.M;
  const me = league.teams[String(rosterId)];

  if (!me) return '<div class="empty">No roster found</div>';

  const weak = weakestSpots(me);
  const counts = starterCounts();

  let html = `
    <div class="team-panel-top">
      <div class="team-with-avatar">
        ${avatarHtml(rosterId, 40)}
        <div>
          <h2>${teamName(rosterId)}</h2>
          <div class="record-line">
            <span class="verdict ${me.mode}">${me.mode === 'contend' ? 'Contending' : 'Rebuilding'}</span>
            &nbsp;avg age ${me.age.toFixed(1)} · ${me.picks.length} picks
          </div>
        </div>
      </div>
    </div>
  `;

  // Positional strength
  const maxStrength = Math.max.apply(null, ['QB','RB','WR','TE'].map(p => league.avg[p] * 1.6));

  html += `<div class="detail-box"><div class="detail-title">Starting Lineup Strength vs League</div>`;
  ['QB','RB','WR','TE'].forEach(pos => {
    const pct = Math.max(3, Math.min(100, (me.strength[pos] / maxStrength) * 100));
    const d = me.deficit[pos];
    const cls = d > 0.25 ? 'weak' : (d > 0.05 ? 'mid' : '');
    const note = d > 0.25 ? 'weak spot' : (d > 0.05 ? 'below avg' : 'strength');
    html += `
      <div class="need-bar-row">
        <span class="need-bar-label">${pos}</span>
        <span class="need-bar ${cls}"><span style="width:${pct}%"></span></span>
        <span class="need-bar-note">${note}</span>
      </div>
    `;
  });
  html += `</div>`;

  // Lineup check
  // Only compare the spots this model actually values — DEF/K aren't scored here.
  const setStarters = ((me.roster && me.roster.starters) || [])
    .map(String)
    .filter(p => p && p !== '0' && ['QB','RB','WR','TE'].indexOf(playerPositionOf(p)) !== -1);
  const optimal = me.lineup.picked.map(String);
  const shouldStart = optimal.filter(p => setStarters.indexOf(p) === -1);
  const shouldSit = setStarters.filter(p => optimal.indexOf(p) === -1);

  if (shouldStart.length && setStarters.length) {
    html += `<div class="detail-title">Lineup Check</div><div class="detail-box">`;
    html += `<div class="tx-line"><span class="tx-add">Start:</span> ${shouldStart.map(p => assetLabel(p, M)).join(', ')}</div>`;
    if (shouldSit.length) {
      html += `<div class="tx-line"><span class="tx-drop">Over:</span> ${shouldSit.map(p => assetLabel(p, M)).join(', ')}</div>`;
    }
    html += `<div class="trade-why">Based on current production value. In the offseason Sleeper often holds a stale lineup, so re-check once games start.</div>`;
    html += `</div>`;
  }

  // Trades
  const trades = findTrades(rosterId, league, 5);

  html += `<div class="detail-title">Trades Worth Offering</div>`;

  if (!trades.length) {
    html += `<div class="empty">No trade clears the fairness bar right now — every match either overpays or leaves one side's lineup worse.</div>`;
  } else {
    html += `<div class="list-stack">`;
    trades.forEach(t => {
      const other = league.teams[t.otherId];
      const otherWeak = weakestSpots(other);
      html += `
        <div class="trade-card">
          <div class="tx-top">
            <span class="tx-badge trade">with ${teamName(t.otherId)}</span>
            <span class="verdict ${other.mode}">${other.mode === 'contend' ? 'contending' : 'rebuilding'}</span>
            <span class="tx-date">${otherWeak.length ? 'needs ' + otherWeak.join('/') : 'needs depth'}</span>
          </div>
          <div class="trade-side">
            <span class="trade-arrow get">You get</span>
            <span class="trade-assets">${packageHtml(t.gp, t.gk, M)}</span>
          </div>
          <div class="trade-side">
            <span class="trade-arrow give">You send</span>
            <span class="trade-assets">${packageHtml(t.sp, t.sk, M)}</span>
          </div>
          <div class="trade-why">${tradeRationale(t, me, other, M)}</div>
        </div>
      `;
    });
    html += `</div>`;
  }

  // Sell-high / hold-risk: players about to fall off the dynasty age cliff
  const cliff = me.players
    .filter(p => {
      const pl = state.players[String(p)];
      if (!pl || !pl.age || M.baseValue(p) < 900) return false;
      const drop = M.dynValue(p) / M.baseValue(p);
      return drop < 0.92;
    })
    .sort((a,b) => M.baseValue(b) - M.baseValue(a))
    .slice(0, 5);

  if (cliff.length) {
    html += `<div class="detail-title">Sell Before the Cliff</div><div class="detail-box"><div class="roster-list">`;
    cliff.forEach(p => {
      const pl = state.players[String(p)];
      html += `
        <div class="roster-row">
          <span class="player-name">${playerDisplayName(p)}${playerInjuryTag(p)}</span>
          <span class="player-pos">${pl.position} · age ${pl.age} · still produces, dynasty value falling</span>
        </div>
      `;
    });
    html += `</div><div class="trade-why">These still carry real win-now value, which is exactly why a contender will pay for them. Value drops fastest in the next 12 months.</div></div>`;
  }

  // Free agents worth a look
  const rostered = {};
  state.rosters.forEach(r => (r.players || []).forEach(p => rostered[String(p)] = 1));

  // No value filter here on purpose: search_rank lags breaking news, so a spike in
  // adds is often the only signal that something just happened to this player.
  const fa = ((state.trending && state.trending.add) || [])
    .map(t => String(t.player_id))
    .filter(pid => {
      const p = state.players[pid];
      return !rostered[pid] && p && ['QB','RB','WR','TE'].indexOf(p.position) !== -1;
    })
    .slice(0, 6);

  if (fa.length) {
    html += `<div class="detail-title">Free Agents the Market Is Moving On</div><div class="detail-box"><div class="roster-list">`;
    fa.forEach(pid => {
      html += `
        <div class="roster-row">
          <span class="player-name">${playerDisplayName(pid)}${playerInjuryTag(pid)}</span>
          <span class="player-pos">${playerMeta(pid)}</span>
        </div>
      `;
    });
    html += `</div><div class="trade-why">Unrostered in your league and among the most-added players across Sleeper in the last 24 hours — the closest thing the API gives to a live news signal.</div></div>`;
  }

  return html;
}

/* ---------- coach: interactive trade builder ---------- */

function ownerOfPlayer(pid) {
  const r = state.rosters.find(x => (x.players || []).map(String).indexOf(String(pid)) !== -1);
  return r ? String(r.roster_id) : '';
}

function tbEnsureInit() {
  if (state.tb) return;
  state.tb = { teams: [], assets: [], search: '', pending: null };
}

function tbRender() {
  const body = document.getElementById('coachBody');
  if (!body) return;

  const searchFocused = document.activeElement && document.activeElement.id === 'tbSearchInput';
  body.innerHTML = tradeBuilderHtml();

  if (searchFocused) {
    const inp = document.getElementById('tbSearchInput');
    if (inp) { inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
  }
}

function tbAddTeam(rid) {
  rid = String(rid);
  if (!rid) return;
  if (state.tb.teams.indexOf(rid) === -1) state.tb.teams.push(rid);
  state.tb.pending = null;
  tbRender();
}

function tbRemoveTeam(rid) {
  rid = String(rid);
  state.tb.teams = state.tb.teams.filter(t => t !== rid);
  state.tb.assets = state.tb.assets.filter(a => a.to !== rid && a.from !== rid);
  state.tb.pending = null;
  tbRender();
}

function tbSetSearch(v) { state.tb.search = v; tbRender(); }

function tbHasPlayer(pid) {
  return state.tb.assets.some(a => a.kind === 'player' && a.pid === String(pid));
}
function tbHasPick(from, label) {
  return state.tb.assets.some(a => a.kind === 'pick' && a.from === String(from) && a.label === label);
}

// Clicking an asset: with two teams the destination is simply the other team; with three
// or more we ask which team receives it (a player can't be added twice).
function tbPickPlayer(pid, from) {
  if (tbHasPlayer(pid)) return;
  const parts = state.tb.teams;
  if (parts.length === 2) tbAddPlayer(pid, from, parts.find(t => t !== from) || parts[0]);
  else { state.tb.pending = { kind:'player', pid:String(pid), from:String(from) }; tbRender(); }
}
function tbPickPick(from, label, value) {
  if (tbHasPick(from, label)) return;
  const parts = state.tb.teams;
  if (parts.length === 2) tbAddPick(from, label, value, parts.find(t => t !== from) || parts[0]);
  else { state.tb.pending = { kind:'pick', from:String(from), label:label, value:Number(value) }; tbRender(); }
}
function tbChooseDest(to) {
  const pd = state.tb.pending;
  if (!pd) return;
  state.tb.pending = null;
  if (pd.kind === 'player') tbAddPlayer(pd.pid, pd.from, to);
  else tbAddPick(pd.from, pd.label, pd.value, to);
}
function tbCancelPending() { state.tb.pending = null; tbRender(); }

function tbAddPlayer(pid, from, to) {
  if (!to || tbHasPlayer(pid)) { tbRender(); return; }
  state.tb.assets.push({ kind:'player', pid:String(pid), from:String(from || ''), to:String(to) });
  tbRender();
}
function tbAddPick(from, label, value, to) {
  if (!to || tbHasPick(from, label)) { tbRender(); return; }
  state.tb.assets.push({ kind:'pick', label:label, value:Number(value) || 0, from:String(from), to:String(to) });
  tbRender();
}
function tbRemoveAsset(i) { state.tb.assets.splice(i, 1); tbRender(); }
function tbClear() { state.tb.assets = []; state.tb.pending = null; tbRender(); }

const POS_ORDER = { QB:0, RB:1, WR:2, TE:3, K:4, DEF:5 };

// Letter grade for one side, from how far short it came as a share of the larger package.
// Calibrated to DynastyCalc: a ~22%-imbalanced deal grades B, ~13% grades B+, even is A+.
function tbGrade(netPct) {
  if (netPct >= -0.05) return 'A+';
  if (netPct >= -0.15) return 'A';
  if (netPct >= -0.27) return 'B+';
  if (netPct >= -0.38) return 'B';
  if (netPct >= -0.50) return 'C';
  if (netPct >= -0.62) return 'D';
  return 'F';
}

// "Won by" percentage, the way DynastyCalc shows it: gap over the combined value.
function wonByPct(hi, lo) {
  return (hi + lo) > 0 ? (hi - lo) / (hi + lo) : 0;
}
function tbGradeClass(g) {
  if (g === 'A+' || g === 'A') return 'g-a';
  if (g === 'B+' || g === 'B') return 'g-b';
  if (g === 'C') return 'g-c';
  return 'g-d';
}

function tradeBuilderHtml() {
  const M = buildValueModel();
  const tb = state.tb;
  const parts = tb.teams;
  const multi = parts.length > 2;

  const assetVal = a => a.kind === 'pick' ? (a.value || 0) : M.dynValue(a.pid);
  const fmt = v => Math.round(v).toLocaleString();

  const recv = {}, give = {};
  parts.forEach(t => { recv[t] = 0; give[t] = 0; });
  tb.assets.forEach(a => {
    if (recv[a.to] !== undefined) recv[a.to] += assetVal(a);
    if (give[a.from] !== undefined) give[a.from] += assetVal(a);
  });

  // Participating teams + add-team control
  const notIn = state.rosters.map(r => String(r.roster_id)).filter(t => parts.indexOf(t) === -1)
    .sort((a,b) => teamName(a).localeCompare(teamName(b)));

  let html = `<div class="section-label" style="margin-top:0;">Trade Builder</div>`;
  html += `<div class="tb-teams">`;
  parts.forEach(t => {
    html += `<span class="tb-chip">${teamName(t)} <button title="Remove team" onclick="tbRemoveTeam('${t}')">&times;</button></span>`;
  });
  if (notIn.length) {
    html += `<select class="tb-addteam" onchange="if(this.value)tbAddTeam(this.value)">
      <option value="">${parts.length ? '+ Add team' : '+ Choose a team'}</option>
      ${notIn.map(t => `<option value="${t}">${teamName(t)}</option>`).join('')}
    </select>`;
  }
  html += `</div>`;

  // Nothing to trade until at least two teams are chosen.
  if (parts.length < 2) {
    html += `<div class="tb-verdict close">Pick the teams making this trade — add ${parts.length ? 'one more team' : 'two or more teams'} to start. You can build 2-team or multi-team deals.</div>`;
    return html;
  }

  // Pending destination chooser (3+ team trades)
  if (tb.pending) {
    const label = tb.pending.kind === 'player' ? playerDisplayName(tb.pending.pid) : tb.pending.label;
    html += `<div class="tb-verdict close"><b>Send ${escHtml(label)} to:</b> ` +
      parts.filter(t => t !== tb.pending.from).map(t =>
        `<button class="tb-add-btn" onclick="tbChooseDest('${t}')">${teamName(t)}</button>`).join(' ') +
      ` <button class="tb-remove" onclick="tbCancelPending()" title="Cancel">&times;</button></div>`;
  }

  // RESULT / evaluator
  if (tb.assets.length) {
    const sides = parts.map(t => {
      const netPct = (recv[t] >= give[t])
        ? (give[t] > 0 ? (recv[t] - give[t]) / Math.max(recv[t], give[t]) : (recv[t] > 0 ? 1 : 0))
        : (recv[t] - give[t]) / Math.max(recv[t], give[t], 1);
      const g = tbGrade(netPct);
      const lab = Math.abs(netPct) < 0.05 ? 'Even' : (netPct > 0 ? 'Wins' : 'Overpays');
      return { t: t, netPct: netPct, g: g, lab: lab };
    });
    const worst = Math.min.apply(null, sides.map(s => s.netPct));
    const best = sides.slice().sort((a,b) => b.netPct - a.netPct)[0];
    const totalsArr = parts.map(t => recv[t]);
    const wonBy = wonByPct(Math.max.apply(null, totalsArr), Math.min.apply(null, totalsArr));
    const overallGrade = tbGrade(worst);
    const overallMsg = wonBy <= 0.05 ? 'All teams got a fair deal'
      : teamName(best.t) + ' comes out ahead by ' + Math.round(wonBy * 100) + '%';

    html += `<div class="tb-result">
      <div class="tb-result-head">RESULT
        <span class="tb-grade ${tbGradeClass(overallGrade)}">${overallGrade}</span>
        <span class="tb-result-msg">${overallMsg}</span>
      </div>`;

    sides.forEach(s => {
      const gets = tb.assets.map((a,i) => ({a:a,i:i})).filter(x => x.a.to === s.t);
      const gives = tb.assets.map((a,i) => ({a:a,i:i})).filter(x => x.a.from === s.t);
      html += `<div class="tb-side">
        <div class="tb-side-head">${teamName(s.t)}
          <span class="tb-grade ${tbGradeClass(s.g)}">${s.g}</span>
          <span class="tb-meta">${s.lab}</span>
        </div>
        <div class="tb-side-cols">
          <div class="tb-getcol">
            <div class="tb-colhead"><span class="tx-add">Gets</span><span class="tb-val">${fmt(recv[s.t])}</span></div>
            ${gets.length ? gets.map(x => `<div class="tb-row"><span>${tbAssetName(x.a)}</span><span><span class="tb-val">${fmt(assetVal(x.a))}</span> <button class="tb-remove" onclick="tbRemoveAsset(${x.i})" title="Remove">&times;</button></span></div>`).join('') : '<div class="tb-meta">—</div>'}
          </div>
          <div class="tb-getcol">
            <div class="tb-colhead"><span class="tx-drop">Sends</span><span class="tb-val">${fmt(give[s.t])}</span></div>
            ${gives.length ? gives.map(x => `<div class="tb-row" style="opacity:.8"><span>${tbAssetName(x.a)}</span><span class="tb-val">${fmt(assetVal(x.a))}</span></div>`).join('') : '<div class="tb-meta">—</div>'}
          </div>
        </div>
      </div>`;
    });

    html += `<div style="margin-top:12px;"><button class="cancel-btn" onclick="tbClear()">Clear trade</button></div>`;
    html += `</div>`;
  }

  // Selector: search + one column per team
  html += `<div class="detail-title">Select players &amp; picks${multi ? " — you'll choose who receives each" : ''}</div>`;
  html += `<input class="settings-input" id="tbSearchInput" placeholder="Search any player to add…" value="${escHtml(tb.search || '')}" oninput="tbSetSearch(this.value)">`;

  const q = (tb.search || '').trim().toLowerCase();
  if (q.length >= 2) {
    const matches = Object.keys(state.players)
      .filter(pid => { const p = state.players[pid]; return p && ['QB','RB','WR','TE'].indexOf(p.position) !== -1 && String(p.full_name||'').toLowerCase().indexOf(q) !== -1; })
      .sort((a,b) => M.dynValue(b) - M.dynValue(a)).slice(0, 20);
    html += `<div class="tb-search-results">` +
      (matches.length ? matches.map(pid => tbCardHtml(pid, ownerOfPlayer(pid), M, tbHasPlayer(pid), true)).join('') : '<div class="tb-meta">No matches.</div>') +
      `</div>`;
  }

  html += `<div class="tb-cols">`;
  parts.forEach(t => {
    const roster = state.rosters.find(r => String(r.roster_id) === String(t));
    const rec = getTeamRecord(roster);
    const players = ((roster && roster.players) || []).map(String)
      .filter(pid => { const p = state.players[pid]; return p && ['QB','RB','WR','TE','K','DEF'].indexOf(p.position) !== -1; })
      .sort((a,b) => (POS_ORDER[playerPositionOf(a)] == null ? 9 : POS_ORDER[playerPositionOf(a)]) -
                     (POS_ORDER[playerPositionOf(b)] == null ? 9 : POS_ORDER[playerPositionOf(b)]) ||
                     M.dynValue(b) - M.dynValue(a));

    html += `<div class="tb-col">
      <div class="tb-col-head">${avatarHtml(t, 24)}<div><b>${teamName(t)}</b><div class="tb-meta">${formatRecord(rec)}</div></div></div>
      <div class="tb-col-body">`;
    players.forEach(pid => { html += tbCardHtml(pid, t, M, tbHasPlayer(pid), false); });
    coachPicks(t).forEach(pk => {
      const added = tbHasPick(t, pk.label);
      html += `<div class="tb-pcard ${added ? 'added' : ''}" ${added ? '' : `onclick="tbPickPick('${t}','${pk.label}',${Math.round(pk.value)})"`}>
        <div class="tb-pcard-top"><span class="pos-badge pos-pick">PICK</span><span class="tb-val" style="margin-left:auto">${fmt(pk.value)}</span></div>
        <div class="tb-pcard-name">${pk.label}${added ? ' <span class="tb-meta">✓ added</span>' : ''}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;

  return html;
}

function tbCardHtml(pid, from, M, added, isSearch) {
  const p = state.players[String(pid)] || {};
  const pos = p.position || '';
  const team = p.team || 'FA';
  const owner = isSearch ? ownerOfPlayer(pid) : from;
  const sub = isSearch ? (owner ? teamName(owner) : 'Free agent') : (p.age ? 'Age ' + p.age : '');
  const click = added ? '' : `onclick="tbPickPlayer('${pid}','${owner}')"`;
  return `<div class="tb-pcard ${added ? 'added' : ''}" ${click}>
    <div class="tb-pcard-top"><span class="pos-badge pos-${pos.toLowerCase()}">${pos}</span><span class="tb-meta"> ${team}</span><span class="tb-val" style="margin-left:auto">${Math.round(M.dynValue(pid)).toLocaleString()}</span></div>
    <div class="tb-pcard-name">${playerDisplayName(pid)}${playerInjuryTag(pid)}${added ? ' <span class="tb-meta">✓ added</span>' : ''}</div>
    ${sub ? `<div class="tb-meta">${escHtml(sub)}</div>` : ''}
  </div>`;
}

function tbAssetName(a) {
  if (a.kind === 'pick') {
    return `<b>${a.label}</b> <span class="tb-meta">pick${a.from ? ' · from ' + teamName(a.from) : ''}</span>`;

  return `<b>${playerDisplayName(a.pid)}</b>${playerInjuryTag(a.pid)} <span class="tb-meta">${meta}${fromTxt}</span>`;
}
