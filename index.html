<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Football</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;600&display=swap');

:root {
  --bg:#0a0d12;
  --surface:#111520;
  --card:#161c2a;
  --border:#1e2740;
  --accent:#e8c84a;
  --accent2:#4a9de8;
  --text:#e8eaf0;
  --muted:#5a6280;
  --danger:#e84a6a;
  --green:#4ae8a0;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans', sans-serif;
  min-height:100vh;
  padding-bottom:60px;
  line-height:1.5;
}

body.modal-open { overflow:hidden; }

.header {
  background:linear-gradient(135deg,#0a0d12 0%,#111a2e 100%);
  border-bottom:1px solid var(--border);
  padding:24px 20px 20px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.header-top {
  display:flex;
  align-items:baseline;
  gap:12px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.header h1 {
  font-family:'Bebas Neue', sans-serif;
  font-size:2.2rem;
  letter-spacing:3px;
  color:var(--accent);
  line-height:1;
}

.league-name {
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
}

.tabs {
  display:flex;
  gap:8px;
  margin-top:16px;
  flex-wrap:wrap;
}

.tab {
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:10px 20px;
  border-radius:9999px;
  cursor:pointer;
}

.tab.active {
  background:var(--accent);
  border-color:var(--accent);
  color:#000;
  font-weight:600;
}

.content { padding:24px 16px; }

.status {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:80px 20px;
  gap:16px;
}

.spinner {
  width:36px;
  height:36px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .9s linear infinite;
}

@keyframes spin { to { transform:rotate(360deg); } }

.status p {
  font-family:'DM Mono', monospace;
  font-size:.8rem;
  color:var(--muted);
  letter-spacing:1px;
}

.section-label {
  font-family:'DM Mono', monospace;
  font-size:.7rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  margin:28px 0 12px;
}

.year-selector {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.year-select {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-family:'DM Sans', sans-serif;
  font-size:.95rem;
  padding:10px 14px;
  min-width:140px;
}

.info-banner {
  background:rgba(74,157,232,.1);
  border:1px solid rgba(74,157,232,.4);
  border-radius:8px;
  padding:12px 16px;
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  color:var(--accent2);
  margin-bottom:16px;
}

.draft-board {
  overflow-x:auto;
  border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.board-table {
  width:100%;
  border-collapse:collapse;
  font-size:.82rem;
}

.board-table th {
  font-family:'DM Mono', monospace;
  font-size:.65rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  padding:12px 14px;
  text-align:left;
  border-bottom:2px solid var(--border);
  background:var(--surface);
}

.board-table td {
  padding:12px 14px;
  border-bottom:1px solid rgba(30,39,64,.4);
}

.board-table tr:nth-child(even) {
  background:rgba(255,255,255,.03);
}

.pick-num {
  font-family:'Bebas Neue', sans-serif;
  font-size:1.25rem;
  color:var(--accent);
  width:48px;
}

.overall-num {
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  color:var(--accent2);
  white-space:nowrap;
  width:60px;
}

.selection-cell {
  font-weight:600;
  white-space:nowrap;
}

.selection-pos {
  font-family:'DM Mono', monospace;
  font-size:.7rem;
  color:var(--muted);
  margin-left:6px;
}

.injury-tag {
  font-family:'DM Mono', monospace;
  font-size:.62rem;
  font-weight:400;
  color:var(--danger);
  border:1px solid rgba(232,74,106,.4);
  border-radius:4px;
  padding:1px 5px;
  margin-left:8px;
  text-transform:uppercase;
  letter-spacing:1px;
  white-space:nowrap;
}

.record-line {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  letter-spacing:1px;
  margin-top:4px;
}

.roster-mix {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--accent2);
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}

.team-cell { font-weight:600; }

.team-link {
  color:var(--text);
  cursor:pointer;
  text-decoration:underline;
  text-decoration-color:rgba(232,200,74,.45);
  text-underline-offset:3px;
}

.team-link:hover { color:var(--accent); }

.team-with-avatar {
  display:flex;
  align-items:center;
  gap:8px;
}

.avatar {
  border-radius:50%;
  object-fit:cover;
  flex:none;
  vertical-align:middle;
}

.avatar-fallback {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--muted);
  font-family:'DM Mono', monospace;
  font-size:.68rem;
}

.origin-cell {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--accent2);
}

.same { color:var(--muted); }

.round-header td {
  background:var(--surface);
  font-family:'Bebas Neue', sans-serif;
  font-size:1rem;
  letter-spacing:2px;
  color:var(--muted);
  padding:10px 14px;
  border-bottom:2px solid var(--border);
}

.team-panel, .notes-panel, .settings-panel {
  margin-top:22px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
}

.team-panel-top, .notes-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.team-panel h2, .notes-top h2, .settings-panel h2 {
  font-family:'Bebas Neue', sans-serif;
  font-size:1.8rem;
  letter-spacing:2px;
  color:var(--accent);
}

.close-btn, .edit-btn, .save-btn, .cancel-btn, .delete-btn, .back-btn {
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:999px;
  padding:8px 14px;
  font-family:'DM Mono', monospace;
  cursor:pointer;
}

.edit-btn, .save-btn {
  border-color:var(--accent);
  color:var(--accent);
}

.delete-btn {
  border-color:var(--danger);
  color:var(--danger);
}

.back-btn {
  border-color:var(--accent);
  color:var(--accent);
  padding:8px 20px;
  margin-bottom:14px;
}

.modal-overlay {
  position:fixed;
  inset:0;
  background:rgba(5,8,14,.8);
  z-index:300;
  overflow-y:auto;
  padding:16px 12px 48px;
}

.modal-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  max-width:960px;
  margin:0 auto;
  padding:18px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}

.detail-grid {
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

@media (min-width:800px) {
  .detail-grid { grid-template-columns:1fr 1fr; }
}

.detail-box {
  background:rgba(0,0,0,.18);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
}

.detail-title {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
  margin:16px 0 10px;
}

.detail-title:first-child {
  margin-top:0;
}

.roster-list, .owned-picks-list, .notes-list, .list-stack {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.list-stack { gap:12px; }

.roster-row, .owned-pick-row {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 10px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(30,39,64,.5);
  border-radius:6px;
}

.player-name, .owned-pick-main {
  font-weight:600;
}

.player-pos, .owned-pick-sub {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
}

.matchup-grid {
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

@media (min-width:800px) {
  .matchup-grid { grid-template-columns:1fr 1fr; }
}

.matchup-card, .tx-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
}

.matchup-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:7px 0;
}

.matchup-points {
  font-family:'Bebas Neue', sans-serif;
  font-size:1.3rem;
  color:var(--muted);
}

.matchup-row.winner .matchup-points { color:var(--green); }
.matchup-row.winner .team-link { color:var(--green); }

.tx-top {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.tx-badge {
  font-family:'DM Mono', monospace;
  font-size:.62rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  border-radius:4px;
  padding:2px 8px;
  border:1px solid var(--border);
  color:var(--muted);
}

.tx-badge.trade { color:var(--accent); border-color:rgba(232,200,74,.5); }
.tx-badge.waiver { color:var(--accent2); border-color:rgba(74,157,232,.5); }
.tx-badge.free_agent { color:var(--green); border-color:rgba(74,232,160,.45); }
.tx-badge.commissioner { color:var(--danger); border-color:rgba(232,74,106,.45); }

.tx-date {
  font-family:'DM Mono', monospace;
  font-size:.7rem;
  color:var(--muted);
}

.tx-line { font-size:.88rem; padding:2px 0; }
.tx-add { color:var(--green); }
.tx-drop { color:var(--danger); }
.tx-pick { color:var(--accent2); }

.trend-grid {
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

@media (min-width:800px) {
  .trend-grid { grid-template-columns:1fr 1fr; }
}

.trend-count {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--accent2);
  white-space:nowrap;
}

.note-card {
  background:rgba(0,0,0,.22);
  border:1px solid rgba(232,200,74,.22);
  border-radius:10px;
  padding:16px;
}

.note-card-top {
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.note-card h3 {
  font-family:'Bebas Neue', sans-serif;
  letter-spacing:1.5px;
  color:var(--accent);
  font-size:1.35rem;
  margin-bottom:6px;
}

.note-card p {
  color:var(--text);
  font-size:.9rem;
}

.note-card-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.note-form {
  display:none;
  background:rgba(0,0,0,.22);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
  margin-bottom:16px;
}

.note-form.active { display:block; }

.note-input, .note-textarea, .settings-input {
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-family:'DM Sans', sans-serif;
  padding:12px;
  margin-bottom:10px;
}

.settings-input { font-family:'DM Mono', monospace; }

.note-textarea {
  min-height:90px;
  resize:vertical;
}

.note-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.hint {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  margin-bottom:14px;
}

.settings-error {
  font-family:'DM Mono', monospace;
  font-size:.75rem;
  color:var(--danger);
  margin-bottom:10px;
}

.coach-sub {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  margin-bottom:16px;
}

.verdict {
  display:inline-block;
  font-family:'DM Mono', monospace;
  font-size:.66rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  border-radius:4px;
  padding:3px 9px;
  border:1px solid var(--border);
  color:var(--muted);
}

.verdict.contend { color:var(--green); border-color:rgba(74,232,160,.5); }
.verdict.rebuild { color:var(--accent2); border-color:rgba(74,157,232,.5); }

.need-bar-row {
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 0;
}

.need-bar-label {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  color:var(--muted);
  width:34px;
  flex:none;
}

.need-bar {
  flex:1;
  height:8px;
  background:rgba(255,255,255,.06);
  border-radius:999px;
  overflow:hidden;
}

.need-bar span {
  display:block;
  height:100%;
  border-radius:999px;
  background:var(--green);
}

.need-bar.weak span { background:var(--danger); }
.need-bar.mid span { background:var(--accent); }

.need-bar-note {
  font-family:'DM Mono', monospace;
  font-size:.68rem;
  color:var(--muted);
  width:82px;
  flex:none;
  text-align:right;
}

.trade-card {
  background:rgba(0,0,0,.22);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
}

.trade-side {
  display:flex;
  gap:8px;
  padding:5px 0;
  align-items:flex-start;
}

.trade-arrow {
  font-family:'DM Mono', monospace;
  font-size:.72rem;
  flex:none;
  width:58px;
}

.trade-arrow.get { color:var(--green); }
.trade-arrow.give { color:var(--danger); }

.trade-assets { font-size:.9rem; }

.trade-why {
  font-size:.84rem;
  color:var(--muted);
  border-top:1px solid var(--border);
  margin-top:10px;
  padding-top:10px;
}

.trade-why b { color:var(--text); font-weight:600; }

.news-title {
  font-weight:600;
  color:var(--accent);
  margin:2px 0 6px;
}

.news-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
}
.news-card summary {
  cursor:pointer;
  list-style:none;
}
.news-card summary::-webkit-details-marker { display:none; }
.news-sum-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:baseline;
  flex-wrap:wrap;
}
.news-headline {
  color:var(--text);
  font-weight:600;
  margin-top:4px;
}
.news-card[open] .news-headline { display:none; }
.mt-row { display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; }
.mt-nonews { color:var(--muted); font-style:italic; }
.news-body { margin-top:10px; }
.news-story {
  padding:10px 0;
  border-top:1px solid var(--border);
}
.news-story:first-child { border-top:none; padding-top:4px; }

.coach-modes { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.mode-btn {
  background:none; border:1px solid var(--border); color:var(--muted);
  font-family:'DM Mono', monospace; font-size:.72rem; letter-spacing:1.5px;
  text-transform:uppercase; padding:8px 16px; border-radius:999px; cursor:pointer;
}
.mode-btn.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }

.tb-teams { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
.tb-chip {
  display:inline-flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:999px; padding:6px 8px 6px 12px;
  font-family:'DM Mono', monospace; font-size:.78rem;
}
.tb-chip button { background:none; border:none; color:var(--danger); cursor:pointer; font-size:1rem; line-height:1; padding:0 2px; }
.tb-addteam { background:var(--surface); border:1px dashed var(--border); border-radius:999px; color:var(--muted); font-family:'DM Mono', monospace; font-size:.75rem; padding:7px 12px; }

.tb-board { display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:20px; }
@media (min-width:720px) { .tb-board.multi { grid-template-columns:repeat(2,1fr); } }

.tb-side h3 { font-family:'Bebas Neue', sans-serif; letter-spacing:1.5px; color:var(--accent); font-size:1.25rem; margin-bottom:8px; }
.tb-row { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:7px 9px; background:rgba(255,255,255,.03); border:1px solid rgba(30,39,64,.5); border-radius:6px; margin-bottom:6px; }
.tb-row .tb-meta { font-family:'DM Mono', monospace; font-size:.68rem; color:var(--muted); }
.tb-val { font-family:'DM Mono', monospace; font-size:.76rem; color:var(--accent); white-space:nowrap; }
.tb-add-btn { background:none; border:1px solid var(--accent); color:var(--accent); border-radius:999px; padding:3px 11px; font-family:'DM Mono', monospace; font-size:.7rem; cursor:pointer; white-space:nowrap; }
.tb-remove { background:none; border:none; color:var(--danger); cursor:pointer; font-size:1.1rem; line-height:1; }
.tb-side-total { font-family:'DM Mono', monospace; font-size:.8rem; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); color:var(--muted); }
.tb-net.pos { color:var(--green); }
.tb-net.neg { color:var(--danger); }

.tb-verdict { font-family:'DM Mono', monospace; font-size:.82rem; margin-bottom:16px; padding:12px 14px; border-radius:8px; border:1px solid var(--border); }
.tb-verdict.fair { color:var(--green); border-color:rgba(74,232,160,.4); background:rgba(74,232,160,.08); }
.tb-verdict.close { color:var(--accent); border-color:rgba(232,200,74,.4); background:rgba(232,200,74,.07); }
.tb-verdict.off { color:var(--danger); border-color:rgba(232,74,106,.4); background:rgba(232,74,106,.07); }

.tb-controls { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
.tb-controls label { font-family:'DM Mono', monospace; font-size:.7rem; letter-spacing:1px; text-transform:uppercase; color:var(--muted); display:flex; flex-direction:column; gap:5px; }

/* evaluator (RESULT) */
.tb-result { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:18px; }
.tb-result-head { font-family:'DM Mono', monospace; font-size:.72rem; letter-spacing:2px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.tb-result-msg { text-transform:none; letter-spacing:0; font-family:'DM Sans',sans-serif; font-size:.9rem; color:var(--text); }
.tb-grade { font-family:'Bebas Neue', sans-serif; font-size:1.35rem; letter-spacing:1px; line-height:1; }
.tb-grade.g-a { color:var(--green); }
.tb-grade.g-b { color:var(--accent2); }
.tb-grade.g-c { color:var(--accent); }
.tb-grade.g-d { color:var(--danger); }
.tb-side { border-top:1px solid var(--border); padding-top:12px; margin-top:12px; }
.tb-side:first-of-type { border-top:none; padding-top:0; margin-top:0; }
.tb-side-head { display:flex; align-items:center; gap:10px; font-family:'Bebas Neue',sans-serif; font-size:1.35rem; letter-spacing:1px; color:var(--accent); margin-bottom:8px; }
.tb-side-head .tb-meta { margin-left:auto; }
.tb-side-cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:560px){ .tb-side-cols { grid-template-columns:1fr; } }
.tb-colhead { display:flex; justify-content:space-between; font-family:'DM Mono',monospace; font-size:.72rem; margin-bottom:6px; }
.tb-adj { background:rgba(232,200,74,.08); border-color:rgba(232,200,74,.35); color:var(--accent); }

    <button class="tab" data-tab="activity" onclick="showTab('activity')">Activity</button>

    <button class="tab" data-tab="news" onclick="showTab('news')">My Team</button>
    <button class="tab" data-tab="notes" onclick="showTab('notes')">League Notes</button>
  </div>
</div>

<div class="content" id="mainContent">
  <div class="status">
    <div class="spinner"></div>
    <p>Fetching league data...</p>
  </div>
</div>

<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5FkmXaE_lgjZlowSBYN6NyLsiZV7FnyE",
  authDomain: "fantasy-football-f9b7a.firebaseapp.com",
  projectId: "fantasy-football-f9b7a",
  storageBucket: "fantasy-football-f9b7a.firebasestorage.app",
  messagingSenderId: "522378837469",
  appId: "1:522378837469:web:ae6c00679bb62246b3ca34"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const API = 'https://api.sleeper.app/v1';
const DEFAULT_LEAGUE_ID = '1330745662001659904';
const LEAGUE_ID_STORAGE_KEY = 'ff.leagueId';
// The league is found the way DynastyCalc does it: by Sleeper username + the league's name.
// This survives the yearly league-ID change automatically, so there's no ID to maintain.
const SLEEPER_USERNAME = 'JarenE';
const LEAGUE_NAME_MATCH = 'dynasty';
const NOTE_PASSCODE = '2325';
const NOTES_COLLECTION = 'leagueNotes';
const TRADE_GRADES_COLLECTION = 'tradeGrades';
const MAX_WEEKS = 18;

// The bulletproof mapping: each person keyed by their STABLE Sleeper user id. A user id
// never changes, so no team rename can ever combine or split people. This is the primary
// source of truth for who a roster belongs to.
const REAL_NAME_BY_USER_ID = {
  '1039993023658221568': 'Jaren',   // JarenE
  '499746762370576384':  'Dakota',  // Dakota95
  '1008927999934185472': 'Ryder',   // RyderEells23
  '1040359416794697728': 'Reese',   // RFizzle92
  '1040374877913567232': 'Linn',    // Linnerd728
  '1040421815778238464': 'Duke',    // DJC90
  '1181756414651662336': 'Dylan',   // DylanK05
  '1184203934121218048': 'Ross'     // Toelobe
};

// Fallback for anyone not in the user-id map (e.g. a future new member): maps a Sleeper
// team name (lowercased) to the real person. Used only when the user id isn't recognized.
const REAL_NAME_BY_SLEEPER_TEAM = {
  'nacua matada': 'Jaren',
  'ross': 'Ross',
  'dakota': 'Dakota',
  'linn': 'Linn',
  'pierce my penix': 'Linn',
  'darnell mooned me': 'Ryder',
  'they hit the second bower': 'Reese',
  'gibbs/bijan pound patrol': 'Reese',
  'to infinity and bijan': 'Duke',
  'unsolicited nix pics': 'Duke',
  'unsolicited nix pix': 'Duke',
  'njigbas in paris': 'Dylan'
};

function getStoredLeagueId() {
  try {
    return localStorage.getItem(LEAGUE_ID_STORAGE_KEY) || DEFAULT_LEAGUE_ID;
  } catch(e) {
    return DEFAULT_LEAGUE_ID;
  }
}

const MY_TEAM_STORAGE_KEY = 'ff.myTeam';
function getStoredMyTeam() {
  try { return localStorage.getItem(MY_TEAM_STORAGE_KEY) || ''; } catch(e) { return ''; }
}
function setMyTeam(rid) {
  state.myTeam = String(rid || '');
  try { localStorage.setItem(MY_TEAM_STORAGE_KEY, state.myTeam); } catch(e) {}
}
// The roster that is "mine": a locally-saved choice, else the roster owned by the resolved
// Sleeper user (JarenE), else a sensible fallback. Used to default the My Team tab, the
// Team Analyzer, and the first team in the Trade Builder.
function myRosterId() {
  const has = rid => state.rosters.some(r => String(r.roster_id) === String(rid));
  const stored = state.myTeam || getStoredMyTeam();
  if (stored && has(stored)) return String(stored);
  const byUser = state.myUserId && state.rosters.find(r => String(r.owner_id) === String(state.myUserId));
  if (byUser) return String(byUser.roster_id);
  const byName = state.rosters.find(r => teamName(r.roster_id) === 'Jaren');
  return String(byName ? byName.roster_id : (state.rosters[0] ? state.rosters[0].roster_id : ''));
}

let state = {};

function freshState() {
  return {
    leagueId: getStoredLeagueId(),
    league:null,
    users:[],
    rosters:[],
    tradedPicks:[],
    drafts:[],
    players:{},
    ownerMap:{},
    personByUserId:{},
    myUserId:'',
    myTeam:getStoredMyTeam(),
    userByRosterId:{},
    draftDetails:{},
    draftPicksBySeason:{},
    nflState:null,
    availableYears:[],
    selectedDraftYear:null,
    selectedWeek:null,
    matchupsByWeek:{},
    transactions:null,
    transactionsLoading:false,
    brackets:null,
    bracketsLoading:false,
    trending:null,
    trendingLoading:false,
    vals:null,
    tradeHistory:null,
    frozenGrades:null,
    frozenGradesLoaded:false,
    draftOrder:null,
    draftOrderLoading:false,
    newsTeam:null,
    newsByTeam:{},
    tb:null,
    coachMode:'build',
    coachRoster:'',
    tradeHistFilter:'',
    draftMode:'board',
    draftHistYear:null,
    activeTab:'draft',
    notesUnlocked:false,
    editingNoteId:null,
    notes:[],
    settingsError:''
  };
}

state = freshState();

function normalizeName(name) {
  return String(name || '').trim().toLowerCase();
}

function currentSeasonYear() {
  return String(new Date().getFullYear());
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Find the current league ID from the Sleeper username + league name (the "dynasty" league),
// so a new season's league ID is picked up automatically. Falls back to the last-loaded ID
// (cached) or the built-in default if the lookup fails (offline, rename, etc.).
async function resolveLeagueId() {
  const cached = getStoredLeagueId();
  try {
    const user = await fetchJSON(API + '/user/' + encodeURIComponent(SLEEPER_USERNAME));
    if (user && user.user_id) {
      state.myUserId = String(user.user_id);
      const yr = Number(currentSeasonYear());
      let leagues = [];
      for (const season of [yr, yr - 1]) {   // current season, then last (offseason rollover)
        leagues = await fetchJSON(API + '/user/' + user.user_id + '/leagues/nfl/' + season).catch(() => []);
        if (leagues && leagues.length) break;
      }
      const want = LEAGUE_NAME_MATCH.toLowerCase();
      const match = (leagues || []).find(l => String(l.name || '').toLowerCase().includes(want)) || (leagues || [])[0];
      if (match && match.league_id) {
        try { localStorage.setItem(LEAGUE_ID_STORAGE_KEY, match.league_id); } catch (e) {}
        return match.league_id;
      }
    }
  } catch (e) {}
  return cached;
}

function getSleeperTeamName(user, rosterId) {
  if (user && user.metadata && user.metadata.team_name) return user.metadata.team_name;
  if (user && user.display_name) return user.display_name;
  return 'Team ' + rosterId;
}

function showLoading(message) {
  document.getElementById('mainContent').innerHTML = `
    <div class="status">
      <div class="spinner"></div>
      <p>${message || 'Fetching league data...'}</p>
    </div>
  `;
}

async function init() {
  // Capture the state object for this load: if the user switches leagues while
  // we're fetching, `state` is replaced and this stale run must not touch it.
  const s = state;

  showLoading();
  closeTeamCard();

  try {
    // Resolve the league from the Sleeper username + name (auto-follows the yearly ID change).
    s.leagueId = await resolveLeagueId();

    // Core league data — the site can't work without these three.
    const [league, users, rosters] = await Promise.all([
      fetchJSON(API + '/league/' + s.leagueId),
      fetchJSON(API + '/league/' + s.leagueId + '/users'),
      fetchJSON(API + '/league/' + s.leagueId + '/rosters')
    ]);

    s.league = league;
    s.users = users || [];
    s.rosters = rosters || [];

    // Everything else is best-effort: one failing endpoint shouldn't take the site down.
    const results = await Promise.allSettled([
      fetchJSON(API + '/league/' + s.leagueId + '/traded_picks'),
      fetchJSON(API + '/league/' + s.leagueId + '/drafts'),
      fetchJSON(API + '/players/nfl'),
      fetchJSON(API + '/state/nfl'),
      loadNotes(),
      loadFrozenGrades()
    ]);

    s.tradedPicks = results[0].status === 'fulfilled' ? (results[0].value || []) : [];
    s.drafts = results[1].status === 'fulfilled' ? (results[1].value || []) : [];
    s.players = results[2].status === 'fulfilled' ? (results[2].value || {}) : {};
    s.nflState = results[3].status === 'fulfilled' ? results[3].value : null;

    const userById = {};
    s.users.forEach(u => userById[u.user_id] = u);

    s.rosters.forEach(r => {
      const u = userById[r.owner_id];
      const sleeperTeamName = getSleeperTeamName(u, r.roster_id);
      // Stable user id first (rename-proof), then the team-name alias, then the raw name.
      const realName = REAL_NAME_BY_USER_ID[String(r.owner_id)] ||
        REAL_NAME_BY_SLEEPER_TEAM[normalizeName(sleeperTeamName)] || sleeperTeamName;
      s.ownerMap[String(r.roster_id)] = realName;
      s.userByRosterId[String(r.roster_id)] = u || null;
      if (r.owner_id) s.personByUserId[String(r.owner_id)] = realName;
    });

    await Promise.all(
      s.drafts.filter(d => d.draft_id).map(async d => {
        try {
          const detail = await fetchJSON(API + '/draft/' + d.draft_id);
          s.draftDetails[String(d.season)] = detail;
        } catch(e) {}

        try {
          const picks = await fetchJSON(API + '/draft/' + d.draft_id + '/picks');
          if (picks && picks.length) {
            const byOverall = {};
            picks.forEach(p => { if (p.pick_no) byOverall[p.pick_no] = p; });
            s.draftPicksBySeason[String(d.season)] = byOverall;
          }
        } catch(e) {}
      })
    );

    const yearSet = new Set();

    s.drafts.forEach(d => {
      if (d.season) yearSet.add(String(d.season));
    });

    s.tradedPicks.forEach(p => {
      if (p.season) yearSet.add(String(p.season));
    });

    s.availableYears = Array.from(yearSet).sort((a,b) => Number(b) - Number(a));

    const thisYear = currentSeasonYear();

    s.selectedDraftYear = s.availableYears.includes(thisYear)
      ? thisYear
      : s.availableYears[0] || thisYear;

    if (s !== state) return;

    const headerBits = [league.name || 'Dynasty League'];
    if (league.season) headerBits.push(league.season);
    if (league.total_rosters) headerBits.push(league.total_rosters + ' Teams');
    document.getElementById('leagueName').textContent = headerBits.join(' · ');

    renderTab();

  } catch(e) {
    if (s !== state) return;

    document.getElementById('mainContent').innerHTML =
      '<div class="error-msg">Failed to load league ' + s.leagueId + ': ' + e.message +
      '<br><br><button class="edit-btn" onclick="showTab(\'settings\')">Open Settings</button></div>';
    document.getElementById('leagueName').textContent = 'League not loaded';
  }
}

function getTeamRecord(roster) {
  const s = (roster && roster.settings) || {};
  return {
    wins: s.wins || 0,

    pf: (s.fpts || 0) + (s.fpts_decimal || 0) / 100,
    pa: (s.fpts_against || 0) + (s.fpts_against_decimal || 0) / 100
  };

function formatRecord(rec) {
  return rec.wins + '-' + rec.losses + (rec.ties ? '-' + rec.ties : '');
}

function leagueDraftRounds() {
  if (state.league && state.league.settings && state.league.settings.draft_rounds) {
    return parseInt(state.league.settings.draft_rounds, 10);
  }
  return 5;
}

/* ---------- draft board ---------- */

function isRoundReversed(round, detail) {
  const type = detail && detail.type ? detail.type : 'snake';
  if (type !== 'snake') return false;

  const reversalRound = detail && detail.settings && detail.settings.reversal_round
    ? parseInt(detail.settings.reversal_round, 10)
    : 0;

  let reversed = false;
  for (let r = 2; r <= Number(round); r++) {
    // At the reversal round (e.g. 3rd-round reversal) the direction repeats once,
    // then keeps alternating as usual.
    if (!(reversalRound > 0 && r === reversalRound)) reversed = !reversed;
  }
  return reversed;
}

function getPickPosition(year, originalRosterId, round) {
  const detail = state.draftDetails[String(year)];
  if (!detail || !detail.slot_to_roster_id) return null;

  const slotMap = detail.slot_to_roster_id;
  const slots = Object.keys(slotMap).map(Number).sort((a,b) => a - b);
  let order = slots.map(s => String(slotMap[String(s)]));

  if (isRoundReversed(round, detail)) order = [...order].reverse();

  const index = order.findIndex(rid => String(rid) === String(originalRosterId));
  if (index === -1) return null;

  return {
    slot: `${round}.${String(index + 1).padStart(2, '0')}`,
    overall: (Number(round) - 1) * order.length + index + 1
  };
}

function buildFinalOwnerMap(yearPicks) {
  const groups = {};

  yearPicks.forEach(p => {
    const key = String(p.roster_id) + '_' + String(p.round);
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  const result = {};

  Object.keys(groups).forEach(key => {
    const records = groups[key];

    if (records.length === 1) {
      result[key] = String(records[0].owner_id);
    } else {
      const allPreviousOwners = new Set(records.map(r => String(r.previous_owner_id)));
      const terminal = records.find(r => !allPreviousOwners.has(String(r.owner_id)));

      result[key] = terminal
        ? String(terminal.owner_id)
        : String(records[records.length - 1].owner_id);
    }
  });

  return result;
}

function getCurrentOwnerForPick(year, originalRosterId, round) {
  const yearPicks = state.tradedPicks.filter(p => String(p.season) === String(year));
  const finalOwnerMap = buildFinalOwnerMap(yearPicks);
  const key = String(originalRosterId) + '_' + String(round);

  return finalOwnerMap[key] || String(originalRosterId);
}

function getAllOwnedPicks(rosterId) {
  const owned = [];

  state.availableYears.forEach(year => {
    const draftForYear = state.drafts.find(d => String(d.season) === String(year));
    const detail = state.draftDetails[String(year)];

    // Once a draft is complete its picks have been used (they're players now),
    // so they're no longer tradeable assets.
    if (detail && detail.status === 'complete') return;

    let originalRosterIds = Object.keys(state.ownerMap).sort((a,b) => Number(a) - Number(b));
    let numRounds = leagueDraftRounds();

    if (detail && detail.slot_to_roster_id) {
      originalRosterIds = Object.values(detail.slot_to_roster_id).map(String);

      if (detail.settings && detail.settings.rounds) {
        numRounds = parseInt(detail.settings.rounds, 10);
      }
    } else if (draftForYear && draftForYear.settings && draftForYear.settings.rounds) {
      numRounds = parseInt(draftForYear.settings.rounds, 10);
    }

    for (let round = 1; round <= numRounds; round++) {
      originalRosterIds.forEach(originalRosterId => {
        const currentOwner = getCurrentOwnerForPick(year, originalRosterId, round);

        if (String(currentOwner) === String(rosterId)) {
          const pos = getPickPosition(year, originalRosterId, round);

          owned.push({
            year,
            round,
            exactSlot: pos ? pos.slot : '',
            overall: pos ? pos.overall : null,
            originalRosterId,
            origName: teamName(originalRosterId)
          });
        }
      });
    }
  });

  return owned.sort((a,b) => {
    if (Number(a.year) !== Number(b.year)) return Number(a.year) - Number(b.year);
    if (Number(a.round) !== Number(b.round)) return Number(a.round) - Number(b.round);
    return (a.exactSlot || '').localeCompare(b.exactSlot || '');
  });
}

// name+pos -> Sleeper pid, for resolving hard-coded startup names to clickable players.
let _nameToPid = null;
function nameToPid(name, pos) {
  if (!_nameToPid) {
    _nameToPid = {};
    Object.keys(state.players).forEach(pid => {
      const p = state.players[pid];
      if (!p || ['QB','RB','WR','TE'].indexOf(p.position) === -1) return;
      const k = ktcNameKey(p.full_name) + '|' + p.position;
      if (!(k in _nameToPid)) _nameToPid[k] = pid;
    });
  }
  let key = ktcNameKey(name);
  if (STARTUP_ALIAS[key]) key = STARTUP_ALIAS[key];
  return _nameToPid[key + '|' + pos];
}

function startupDraftHtml() {
  let html = `<div class="info-banner">The original startup draft, run on ESPN in 2024 before the league moved to Sleeper.</div>`;
  html += `<div class="draft-board"><table class="board-table"><thead><tr><th>Pick</th><th>Player</th><th>Drafted By</th></tr></thead><tbody>`;
  let lastR = null;
  STARTUP_DRAFT.forEach(e => {
    if (e.r !== lastR) { html += `<tr class="round-header"><td colspan="3">Round ${e.r}</td></tr>`; lastR = e.r; }
    const pid = nameToPid(e.n, e.pos);
    const nameHtml = pid ? pLink(pid) : escHtml(e.n);
    html += `<tr>
      <td class="pick-num">${e.r}.${String(e.p).padStart(2, '0')}</td>
      <td>${nameHtml} <span class="tb-meta">${e.pos}</span></td>

    </tr>`;

function sleeperDraftHtml(season) {
  const th = state.tradeHistory;
  const sd = (th.seasonDraft && th.seasonDraft[season]) || {};
  const teams = sd.teams || (state.rosters.length || 8);
  const picks = Object.keys(th.draftedBy)
    .map(pid => Object.assign({ pid: pid }, th.draftedBy[pid]))
    .filter(d => String(d.season) === String(season))
    .sort((a,b) => (a.pick || 0) - (b.pick || 0));

  if (!picks.length) return '<div class="empty">No draft data recorded for this season.</div>';

  let html = `<div class="info-banner">${season} Sleeper rookie draft · ${picks.length} picks</div>`;
  html += `<div class="draft-board"><table class="board-table"><thead><tr><th>Pick</th><th>Player</th><th>Drafted By</th></tr></thead><tbody>`;
  let lastR = null;
  picks.forEach(d => {
    if (d.round !== lastR) { html += `<tr class="round-header"><td colspan="3">Round ${d.round}</td></tr>`; lastR = d.round; }
    const slot = (d.pick || 1) - (d.round - 1) * teams;
    const nm = (th.nameByLeague[d.leagueId] || {})[d.rosterId] || teamName(d.rosterId);
    const pos = (state.players[d.pid] || {}).position || '';
    html += `<tr>
      <td class="pick-num">${d.round}.${String(slot).padStart(2, '0')}</td>
      <td>${pLink(d.pid)} <span class="tb-meta">${pos}</span></td>
      <td class="team-cell">${nm}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function renderDraftBoard() {
  const year = state.selectedDraftYear;
  const draftForYear = state.drafts.find(d => String(d.season) === String(year));
  const detail = state.draftDetails[String(year)];
  const draftedByOverall = state.draftPicksBySeason[String(year)] || null;

  let snakeOrder = [];
  let hasExactDraftOrder = false;
  let numRounds = leagueDraftRounds();

  if (detail && detail.slot_to_roster_id) {
    const slotMap = detail.slot_to_roster_id;
    const slots = Object.keys(slotMap).map(Number).sort((a,b) => a - b);

    snakeOrder = slots.map(s => String(slotMap[String(s)]));
    hasExactDraftOrder = true;

    if (detail.settings && detail.settings.rounds) {
      numRounds = parseInt(detail.settings.rounds, 10);
    }
  } else {
    snakeOrder = Object.keys(state.ownerMap)
      .map(Number)
      .sort((a,b) => a - b)
      .map(String);

    if (draftForYear && draftForYear.settings && draftForYear.settings.rounds) {
      numRounds = parseInt(draftForYear.settings.rounds, 10);
    }
  }

  const yearPicks = state.tradedPicks.filter(p => String(p.season) === String(year));
  const finalOwnerMap = buildFinalOwnerMap(yearPicks);
  const showSelections = !!draftedByOverall;

  let html = `
    <div class="year-selector">
      <span class="section-label" style="margin:0;">Draft Board</span>

      <select class="year-select" onchange="selectDraftYear(this.value)">
        ${state.availableYears.map(y => `
          <option value="${y}" ${String(y) === String(year) ? 'selected' : ''}>${y}</option>
        `).join('')}
      </select>
    </div>
  `;

  if (hasExactDraftOrder) {
    let banner = `Real draft order from Sleeper · ${year} · ${numRounds} rounds · ${snakeOrder.length} teams`;

    if (detail.status === 'complete') {
      banner += ' · Draft complete';
    } else if (detail.status === 'drafting') {
      banner += ' · Draft in progress';
    } else if (detail.status === 'pre_draft' && detail.start_time) {
      banner += ' · Draft: ' + new Date(detail.start_time).toLocaleString(undefined, {
        month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'
      });
    }

    html += `<div class="info-banner">${banner}</div>`;
  } else {
    html += `<div class="info-banner">Draft order not set yet for ${year} — showing pick ownership by round</div>`;
  }

  html += `<div class="section-label">${year} Draft — ${numRounds} Rounds</div>`;
  html += `<div class="draft-board"><table class="board-table">`;

  let headers = '';
  let colCount = 2;

  if (hasExactDraftOrder) {
    headers += `<th>Pick</th><th>Overall</th>`;
    colCount += 2;
  }

  headers += `<th>Pick Goes To</th>`;

  if (showSelections) {
    headers += `<th>Selection</th>`;
    colCount += 1;
  }

  headers += `<th>Original Slot</th>`;

  html += `<thead><tr>${headers}</tr></thead><tbody>`;

  for (let round = 1; round <= numRounds; round++) {
    html += `<tr class="round-header"><td colspan="${colCount}">Round ${round}</td></tr>`;

    const roundOrder = hasExactDraftOrder && isRoundReversed(round, detail)
      ? [...snakeOrder].reverse()
      : snakeOrder;

    roundOrder.forEach((origRosterId, idx) => {
      const key = String(origRosterId) + '_' + String(round);
      const currentOwner = finalOwnerMap[key] || String(origRosterId);
      const isSame = String(currentOwner) === String(origRosterId);

      html += '<tr>';

      if (hasExactDraftOrder) {
        const slot = `${round}.${String(idx + 1).padStart(2, '0')}`;
        const overall = (round - 1) * roundOrder.length + idx + 1;
        html += `<td class="pick-num">${slot}</td><td class="overall-num">#${overall}</td>`;
      }

      html += `<td class="team-cell">${teamLink(currentOwner)}</td>`;

      if (showSelections) {
        const overall = (round - 1) * roundOrder.length + idx + 1;
        const pick = draftedByOverall[overall];

        if (pick) {
          const md = pick.metadata || {};
          const pname = pick.player_id ? pLink(pick.player_id)
            : ((md.first_name || '') + ' ' + (md.last_name || '')).trim();
          const ppos = md.position || playerPositionOf(pick.player_id);
          html += `<td class="selection-cell">${pname}<span class="selection-pos">${ppos || ''}</span></td>`;
        } else {
          html += `<td class="selection-cell"><span class="selection-pos">—</span></td>`;
        }
      }

      html += `<td class="origin-cell ${isSame ? 'same' : ''}">${isSame ? '—' : teamName(origRosterId)}</td>`;
      html += '</tr>';
    });
  }

  html += `</tbody></table></div>`;

  draftBody().innerHTML = html;
}

function selectDraftYear(year) {
  state.selectedDraftYear = year;
  renderDraftBoard();
}

/* ---------- players ---------- */

function playerDisplayName(playerId) {
  const p = state.players[String(playerId)];
  if (!p) return 'Player ' + playerId;

  return p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || 'Player ' + playerId;
}

function playerPositionOf(playerId) {
  const p = state.players[String(playerId)];
  return (p && p.position) || '';
}

function playerMeta(playerId) {
  const p = state.players[String(playerId)];
  if (!p) return '';

  const parts = [];
  if (p.position) parts.push(p.position);
  if (p.team) parts.push(p.team);
  if (p.age) parts.push('Age ' + p.age);

  return parts.join(' · ');
}

function playerInjuryTag(playerId) {
  const p = state.players[String(playerId)];
  if (!p || !p.injury_status) return '';
  return `<span class="injury-tag">${p.injury_status}</span>`;
}

function playerRow(pid) {
  return `
    <div class="roster-row">
      <span class="player-name">${pLink(pid)}${playerInjuryTag(pid)}</span>
      <span class="player-pos">${playerMeta(pid)}</span>
    </div>
  `;
}

function playerSection(title, list) {
  return `
    <div class="detail-title">${title} (${list.length})</div>
    <div class="roster-list">
      ${list.length ? list.map(playerRow).join('') : '<div class="empty">None</div>'}
    </div>
  `;
}

function rosterPositionMix(playerIds) {
  const counts = {};

  playerIds.forEach(pid => {
    const p = state.players[String(pid)];
    const pos = (p && p.position) || 'N/A';
    counts[pos] = (counts[pos] || 0) + 1;
  });

  const order = ['QB','RB','WR','TE','K','DEF'];
  const known = order.filter(pos => counts[pos]).map(pos => counts[pos] + ' ' + pos);
  const other = Object.keys(counts)
    .filter(pos => !order.includes(pos))
    .sort()
    .map(pos => counts[pos] + ' ' + pos);

  return known.concat(other).join(' · ');
}

/* ---------- team card (modal) ---------- */

function teamCardContent(rosterId) {
  const roster = state.rosters.find(r => String(r.roster_id) === String(rosterId));
  const ownedPicks = getAllOwnedPicks(rosterId);

  if (!roster) {
    return `<div class="empty">No roster found</div>`;
  }

  const starters = roster.starters || [];
  const allPlayers = roster.players || [];
  const injured = roster.reserve || [];
  const taxi = roster.taxi || [];

  const starterSet = new Set(starters.map(String));
  const injuredSet = new Set(injured.map(String));
  const taxiSet = new Set(taxi.map(String));

  const bench = allPlayers.filter(pid =>
    !starterSet.has(String(pid)) &&
    !injuredSet.has(String(pid)) &&
    !taxiSet.has(String(pid))
  );

  const picksHtml = ownedPicks.length
    ? ownedPicks.map(p => `
        <div class="owned-pick-row">
          <div>
            <div class="owned-pick-main">${p.exactSlot ? p.exactSlot : p.year + ' Round ' + p.round}</div>
            <div class="owned-pick-sub">${p.year}${p.overall ? ' · Pick #' + p.overall : ''} · Original: ${p.origName}</div>
          </div>
        </div>
      `).join('')
    : '<div class="empty">No picks found</div>';

  const rec = getTeamRecord(roster);
  const hasPlayed = (rec.wins + rec.losses + rec.ties) > 0 || rec.pf > 0;
  const mix = rosterPositionMix(allPlayers);
  const totalMoves = roster.settings && roster.settings.total_moves ? roster.settings.total_moves : 0;
  const waiverPos = roster.settings && roster.settings.waiver_position ? roster.settings.waiver_position : null;

  const subBits = [];
  if (hasPlayed) subBits.push(formatRecord(rec) + ' · ' + rec.pf.toFixed(1) + ' PF · ' + rec.pa.toFixed(1) + ' PA');
  if (waiverPos) subBits.push('Waiver #' + waiverPos);
  if (totalMoves) subBits.push(totalMoves + ' moves');

  return `
    <div class="team-panel-top">
      <div class="team-with-avatar">
        ${avatarHtml(rosterId, 40)}
        <div>
          <h2>${teamName(rosterId)}</h2>
          ${subBits.length ? `<div class="record-line">${subBits.join(' · ')}</div>` : ''}
        </div>
      </div>
    </div>

    <div class="detail-grid">
      <div class="detail-box">
        ${mix ? `<div class="roster-mix">${mix}</div>` : ''}
        ${playerSection('Starters', starters)}
        ${playerSection('Bench', bench)}
        ${taxi.length ? playerSection('Taxi Squad', taxi) : ''}
        ${playerSection('Injured / Reserve', injured)}
      </div>

      <div class="detail-box">
        <div class="detail-title">Draft Picks</div>
        <div class="owned-picks-list">${picksHtml}</div>
      </div>
    </div>
  `;
}

  const root = document.getElementById('modalRoot');

  root.innerHTML = `

/* ---------- coach: valuation model ---------- */

// Player and pick values come from FantasyCalc's public API, keyed by Sleeper id and

let _startupByPid = null;

// pid -> {r, p, t} for the ESPN startup, resolved once against the player DB by name+pos.
function startupByPid() {
  if (_startupByPid) return _startupByPid;
  const idx = {};
  Object.keys(state.players).forEach(pid => {
    const p = state.players[pid];
    if (!p || ['QB','RB','WR','TE'].indexOf(p.position) === -1) return;
    const k = ktcNameKey(p.full_name) + '|' + p.position;
    if (!(k in idx)) idx[k] = pid;
  });
  const out = {};
  STARTUP_DRAFT.forEach(e => {
    let key = ktcNameKey(e.n);
    if (STARTUP_ALIAS[key]) key = STARTUP_ALIAS[key];
    const pid = idx[key + '|' + e.pos];
    if (pid) out[pid] = { r: e.r, p: e.p, t: e.t };
  });
  _startupByPid = out;
  return out;
}

function splitCsvLine(line) {
  const out = [];
  let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') { q = true; }
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/);
  const header = splitCsvLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i]) continue;
    const cells = splitCsvLine(lines[i]);
    const row = {};
    header.forEach((h, j) => row[h] = cells[j]);
    rows.push(row);
  }
  return rows;
}

function ktcNameKey(name) {
  return String(name || '').toLowerCase()
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '')
    .replace(/[^a-z]/g, '');
}

// values + win-now come from), theffdynasty's crowd rankings, DynastyProcess's published
// value feed, and DynastyCalc's rankings. The secondary sources sit on different scales, so
// each is mapped by rank onto FantasyCalc's value curve, then all present sources are
// averaged. Any source that's unreachable/stale is simply dropped from the average.
