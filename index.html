// Best possible score from a week's players_points, respecting the lineup slots.
function bestBallPoints(playersPoints) {
  const counts = starterCounts();
  const rp = (state.league && state.league.roster_positions) || [];
  const defN = rp.filter(x => x === 'DEF').length;
  const kN = rp.filter(x => x === 'K').length;

  const pool = {};
  Object.keys(playersPoints || {}).forEach(pid => {
    const pos = playerPositionOf(pid);
    (pool[pos] = pool[pos] || []).push({ pid: pid, pts: playersPoints[pid] || 0 });
  });
  Object.keys(pool).forEach(k => pool[k].sort((a,b) => b.pts - a.pts));

  const used = {};
  let total = 0;
  const take = pos => {
    const arr = pool[pos] || [];
    for (let i = 0; i < arr.length; i++) if (!used[arr[i].pid]) { used[arr[i].pid] = 1; total += arr[i].pts; return; }
  };
  const takeFlex = (kinds, n) => {
    for (let i = 0; i < n; i++) {
      let best = null;
      kinds.forEach(pos => (pool[pos] || []).forEach(x => { if (!used[x.pid] && (!best || x.pts > best.pts)) best = x; }));
      if (best) { used[best.pid] = 1; total += best.pts; }
    }
  };
  ['QB','RB','WR','TE'].forEach(pos => { for (let i = 0; i < (counts[pos] || 0); i++) take(pos); });
  takeFlex(['RB','WR','TE'], counts.FLEX || 0);
  takeFlex(['QB','RB','WR','TE'], counts.SUPER_FLEX || 0);
  for (let i = 0; i < defN; i++) take('DEF');
  for (let i = 0; i < kN; i++) take('K');
  return total;
}

async function loadDraftOrder() {
  const s = state;
  if (s.draftOrder || s.draftOrderLoading) return s.draftOrder;
  s.draftOrderLoading = true;

  const pstart = (s.league.settings && s.league.settings.playoff_week_start) || 15;
  const regWeeks = [];
  for (let w = 1; w < pstart; w++) regWeeks.push(w);
  const playoffWeeks = [pstart, pstart + 1, pstart + 2];
  const allWeeks = regWeeks.concat(playoffWeeks);

  const results = await Promise.all(
    allWeeks.map(w => fetchJSON(API + '/league/' + s.leagueId + '/matchups/' + w).catch(() => []))
  );
  const byWeek = {};
  allWeeks.forEach((w, i) => byWeek[w] = results[i] || []);

  const stats = {};
  s.rosters.forEach(r => stats[String(r.roster_id)] = { actual: 0, possible: 0, weeks: 0 });

  regWeeks.forEach(w => {
    (byWeek[w] || []).forEach(m => {
      if (!m || (m.points || 0) <= 0) return; // week not played for this team
      const st = stats[String(m.roster_id)];
      if (!st) return;
      st.actual += m.points || 0;
      st.possible += bestBallPoints(m.players_points || {});
      st.weeks++;
    });
  });

  if (!s.brackets) {
    const [w, l] = await Promise.all([
      fetchJSON(API + '/league/' + s.leagueId + '/winners_bracket').catch(() => []),
      fetchJSON(API + '/league/' + s.leagueId + '/losers_bracket').catch(() => [])
    ]);
    s.brackets = { winners: w || [], losers: l || [] };
  }

  s.draftOrder = { stats: stats, byWeek: byWeek, regWeeks: regWeeks, pstart: pstart, winners: s.brackets.winners };
  s.draftOrderLoading = false;
  return s.draftOrder;
}

function renderDraftOrder() {

    <div id="draftOrderArea"><div class="status"><div class="spinner"></div><p>Crunching points possible…</p></div></div>
  `;
  loadDraftOrder().then(() => {
    if (state.activeTab !== 'draft' || state.draftMode !== 'order') return;
    const el = document.getElementById('draftOrderArea');
    if (el) el.innerHTML = draftOrderHtml();
  }).catch(e => {
    const el = document.getElementById('draftOrderArea');
    if (el) el.innerHTML = '<div class="error-msg">Could not load draft order: ' + e.message + '</div>';

function draftOrderHtml() {
  const d = state.draftOrder;
  const ids = state.rosters.map(r => String(r.roster_id));
  const played = ids.reduce((n, id) => n + (d.stats[id] ? d.stats[id].weeks : 0), 0);

  const rules = `<div class="coach-sub" style="margin-bottom:16px;">
    Picks 1–4 go to the four non-playoff teams, worst <b>points&nbsp;possible</b> picking first.
    Picks 5–8 go to the playoff teams by finish: champion picks last (8th), runner-up 7th, and the two
    semifinal losers take 5th &amp; 6th by their points possible in the 3rd-place game.
  </div>`;

  if (!played) {
    return rules + `<div class="info-banner">No games played yet for ${state.league.season}. Order and lineup efficiency fill in each week as scores post — it tracks your league's real points-possible tiebreakers.</div>`;
  }

  // playoff teams / finish from the winners bracket
  const wb = d.winners || [];
  const champMatch = wb.find(m => m.p === 1);
  const champ = champMatch && champMatch.w ? String(champMatch.w) : null;
  const runnerUp = champMatch && champ ? [champMatch.t1, champMatch.t2].map(String).find(x => x && x !== champ) : null;
  const thirdMatch = wb.find(m => m.p === 3);
  const round1 = wb.filter(m => (m.r || 1) === 1);
  const playoffSet = {};
  round1.forEach(m => { [m.t1, m.t2].forEach(x => { if (x) playoffSet[String(x)] = 1; }); });
  const bracketDone = !!champ;

  const possible = id => d.stats[id] ? d.stats[id].possible : 0;
  const order = []; // [{rosterId, pick, basis}]

  if (bracketDone) {
    const nonPlayoff = ids.filter(id => !playoffSet[id]).sort((a,b) => possible(a) - possible(b));
    nonPlayoff.forEach((id, i) => order.push({ id: id, pick: i + 1, basis: 'Missed playoffs · ' + possible(id).toFixed(0) + ' pts possible' }));

    const semiLosers = Object.keys(playoffSet).filter(id => id !== champ && id !== runnerUp);
    const thirdWeek = thirdMatch ? d.pstart + ((thirdMatch.r || 2) - 1) : null;
    const ppThatWeek = id => {
      const wk = thirdWeek && d.byWeek[thirdWeek];
      const m = wk && wk.find(x => String(x.roster_id) === id);
      return m ? bestBallPoints(m.players_points || {}) : possible(id);
    };
    semiLosers.sort((a,b) => ppThatWeek(a) - ppThatWeek(b));
    semiLosers.forEach((id, i) => order.push({ id: id, pick: 5 + i, basis: '3rd-place game · ' + ppThatWeek(id).toFixed(0) + ' pts possible' }));
    if (runnerUp) order.push({ id: runnerUp, pick: 7, basis: 'Runner-up' });
    if (champ) order.push({ id: champ, pick: 8, basis: 'Champion' });
  } else {
    // Season in progress — project from points possible, worst first.
    ids.slice().sort((a,b) => possible(a) - possible(b)).forEach((id, i) =>
      order.push({ id: id, pick: i + 1, basis: possible(id).toFixed(0) + ' pts possible (projected)' }));
  }

  order.sort((a,b) => a.pick - b.pick);

  let html = rules;
  if (!bracketDone) html += `<div class="info-banner">Projected order — playoffs haven't finished, so this ranks everyone by points possible so far. Finish-based picks (5–8) lock in once the bracket completes.</div>`;

  html += `<div class="draft-board"><table class="board-table"><thead><tr><th>Pick</th><th>Team</th><th>Basis</th></tr></thead><tbody>`;
  order.forEach(o => {
    html += `<tr>
      <td class="pick-num">${o.pick}.01</td>
      <td class="team-cell">${teamLink(o.id, true)}</td>
      <td class="tb-meta">${o.basis}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  // Lineup efficiency — who left the most points on the bench
  const eff = ids.filter(id => d.stats[id] && d.stats[id].possible > 0).map(id => {
    const st = d.stats[id];
    return { id: id, actual: st.actual, possible: st.possible, left: st.possible - st.actual, pct: st.actual / st.possible };
  }).sort((a,b) => b.left - a.left);

  if (eff.length) {
    html += `<div class="section-label">Lineup Efficiency — points left on the bench</div>`;
    html += `<div class="draft-board"><table class="board-table"><thead><tr><th>Team</th><th>Scored</th><th>Possible</th><th>Left Out</th><th>Efficiency</th></tr></thead><tbody>`;
    eff.forEach(e => {
      html += `<tr>
        <td class="team-cell">${teamLink(e.id, true)}</td>
        <td>${e.actual.toFixed(1)}</td>
        <td>${e.possible.toFixed(1)}</td>
        <td class="tb-net neg">${e.left.toFixed(1)}</td>
        <td>${(e.pct * 100).toFixed(1)}%</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  return html;
}

async function loadBrackets() {
  const s = state;

  if (!s.brackets && !s.bracketsLoading) {
    s.bracketsLoading = true;

    const [winners, losers] = await Promise.all([
      fetchJSON(API + '/league/' + s.leagueId + '/winners_bracket').catch(() => []),
      fetchJSON(API + '/league/' + s.leagueId + '/losers_bracket').catch(() => [])
    ]);

    s.brackets = { winners: winners || [], losers: losers || [] };
    s.bracketsLoading = false;
  }

  if (s !== state || state.activeTab !== 'standings' || !state.brackets) return;

  const target = document.getElementById('bracketSection');
  if (!target) return;

  target.innerHTML =
    bracketHtml('Playoff Bracket', state.brackets.winners, true) +
    bracketHtml('Consolation Bracket', state.brackets.losers, false);
}

function bracketTeamLabel(match, side) {
  const direct = match[side];
  if (direct) return teamLink(direct);

  const from = match[side + '_from'];
  if (from && from.w) return `<span class="player-pos">Winner of Match ${from.w}</span>`;
  if (from && from.l) return `<span class="player-pos">Loser of Match ${from.l}</span>`;

  return `<span class="player-pos">TBD</span>`;
}

function bracketHtml(title, matches, isWinners) {
  if (!matches || !matches.length) return '';

  const rounds = {};
  matches.forEach(m => {
    const r = m.r || 1;
    if (!rounds[r]) rounds[r] = [];
    rounds[r].push(m);
  });

  let html = `<div class="section-label">${title}</div><div class="list-stack">`;

  Object.keys(rounds).map(Number).sort((a,b) => a - b).forEach(r => {
    rounds[r].sort((a,b) => (a.m || 0) - (b.m || 0)).forEach(m => {
      let label = `Round ${r} · Match ${m.m}`;
      if (m.p === 1) label = isWinners ? 'Championship' : 'Toilet Bowl Final';
      else if (m.p === 3) label = '3rd Place Game';
      else if (m.p) label = `Place ${m.p} Game`;

      const t1 = bracketTeamLabel(m, 't1');
      const t2 = bracketTeamLabel(m, 't2');
      const winner = m.w ? `<span class="tx-add">Winner: ${teamName(m.w)}</span>` : `<span class="player-pos">Winner: TBD</span>`;

      html += `
        <div class="tx-card">
          <div class="tx-top">
            <span class="tx-badge">${label}</span>
          </div>
          <div class="tx-line">${t1} <span class="player-pos">vs</span> ${t2}</div>
          <div class="tx-line">${winner}</div>
        </div>
      `;
    });
  });

  html += `</div>`;
  return html;
}

/* ---------- matchups ---------- */

function currentNflWeek() {
  const st = state.nflState;

  if (st && state.league && String(st.season) === String(state.league.season)) {
    const wk = parseInt(st.display_week || st.week, 10);
    if (wk >= 1 && wk <= MAX_WEEKS) return wk;
  }

  return 1;
}

function renderMatchups() {
  if (state.selectedWeek == null) state.selectedWeek = currentNflWeek();

  const week = state.selectedWeek;

  let html = `
    <div class="year-selector">
      <span class="section-label" style="margin:0;">Matchups</span>

      <select class="year-select" onchange="selectWeek(this.value)">
        ${Array.from({length: MAX_WEEKS}, (_, i) => i + 1).map(w => `
          <option value="${w}" ${w === week ? 'selected' : ''}>Week ${w}</option>
        `).join('')}
      </select>
    </div>
    <div id="matchupArea">
      <div class="status"><div class="spinner"></div><p>Loading week ${week}...</p></div>
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;

  loadMatchups(week);
}

function selectWeek(week) {
  state.selectedWeek = parseInt(week, 10);
  renderMatchups();
}

async function loadMatchups(week) {
  const s = state;

  if (s.matchupsByWeek[week] === undefined) {
    try {
      s.matchupsByWeek[week] = await fetchJSON(API + '/league/' + s.leagueId + '/matchups/' + week) || [];
    } catch(e) {
      s.matchupsByWeek[week] = [];
    }
  }

  // The user may have changed league, tab, or week while we were fetching.
  if (s !== state || state.activeTab !== 'matchups' || state.selectedWeek !== week) return;

  const target = document.getElementById('matchupArea');
  if (!target) return;

  const matchups = state.matchupsByWeek[week];

  if (!matchups.length) {
    target.innerHTML = `<div class="empty">No matchups for week ${week} yet — check back once the season starts</div>`;
    return;
  }

  const byMatchup = {};
  const byes = [];

  matchups.forEach(m => {
    if (m.matchup_id == null) {
      byes.push(m);
      return;
    }
    if (!byMatchup[m.matchup_id]) byMatchup[m.matchup_id] = [];
    byMatchup[m.matchup_id].push(m);
  });

  let html = `<div class="matchup-grid">`;

  Object.keys(byMatchup).map(Number).sort((a,b) => a - b).forEach(mid => {
    const pair = byMatchup[mid];
    const scored = pair.some(m => (m.points || 0) > 0);
    const top = Math.max(...pair.map(m => m.points || 0));

    html += `<div class="matchup-card">`;

    pair.forEach(m => {
      const isWinner = scored && (m.points || 0) === top && pair.filter(x => (x.points || 0) === top).length === 1;

      html += `
        <div class="matchup-row ${isWinner ? 'winner' : ''}">
          <span class="team-with-avatar">${avatarHtml(m.roster_id)}${teamLink(m.roster_id)}</span>
          <span class="matchup-points">${(m.points || 0).toFixed(2)}</span>
        </div>
      `;
    });

    html += `</div>`;
  });

  byes.forEach(m => {
    html += `
      <div class="matchup-card">
        <div class="matchup-row">
          <span class="team-with-avatar">${avatarHtml(m.roster_id)}${teamLink(m.roster_id)}</span>
          <span class="player-pos">BYE</span>
        </div>
      </div>
    `;
  });

  html += `</div>`;
  target.innerHTML = html;
}

/* ---------- activity (transactions) ---------- */

function renderActivity() {
  document.getElementById('mainContent').innerHTML = `
    <div class="section-label">League Activity</div>
    <div id="activityArea">
      <div class="status"><div class="spinner"></div><p>Loading transactions...</p></div>
    </div>
  `;

  loadActivity();
}

async function loadActivity() {
  const s = state;

  if (!s.transactions && !s.transactionsLoading) {
    s.transactionsLoading = true;

    const weeks = Array.from({length: MAX_WEEKS}, (_, i) => i + 1);
    const results = await Promise.all(
      weeks.map(w => fetchJSON(API + '/league/' + s.leagueId + '/transactions/' + w).catch(() => []))
    );

    const seen = new Set();
    const all = [];

    results.flat().forEach(t => {
      if (!t || !t.transaction_id || seen.has(t.transaction_id)) return;
      seen.add(t.transaction_id);
      if (t.status === 'complete') all.push(t);
    });

    all.sort((a,b) => (b.status_updated || 0) - (a.status_updated || 0));
    s.transactions = all;
    s.transactionsLoading = false;
  }

  if (s !== state || state.activeTab !== 'activity' || !state.transactions) return;

  const target = document.getElementById('activityArea');
  if (!target) return;

  const txs = state.transactions;

  if (!txs.length) {
    target.innerHTML = `<div class="empty">No completed transactions yet</div>`;
    return;
  }

  const shown = txs.slice(0, 60);

  let html = `<div class="list-stack">${shown.map(txCardHtml).join('')}</div>`;

  if (txs.length > shown.length) {
    html += `<div class="hint" style="margin-top:14px;">Showing the ${shown.length} most recent of ${txs.length} transactions</div>`;
  }

  target.innerHTML = html;
}

function txTypeLabel(type) {
  if (type === 'free_agent') return 'Free Agent';
  return String(type || 'move').replace(/_/g, ' ');
}

function txCardHtml(t) {
  const date = t.status_updated
    ? new Date(t.status_updated).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })
    : '';

  let lines = '';

  if (t.type === 'trade') {
    (t.roster_ids || []).forEach(rid => {
      const gets = [];

      Object.keys(t.adds || {}).forEach(pid => {
        if (String(t.adds[pid]) === String(rid)) gets.push(playerDisplayName(pid));
      });

      (t.draft_picks || []).forEach(p => {
        if (String(p.owner_id) === String(rid)) {
          const pos = getPickPosition(p.season, p.roster_id, p.round);
          gets.push(`<span class="tx-pick">${p.season} Round ${p.round}${pos ? ' (' + pos.slot + ')' : ''}</span> <span class="player-pos">orig ${teamName(p.roster_id)}</span>`);
        }
      });

      (Array.isArray(t.waiver_budget) ? t.waiver_budget : []).forEach(wb => {
        if (String(wb.receiver) === String(rid)) gets.push(`$${wb.amount} FAAB`);
      });

      lines += `<div class="tx-line">${teamLink(rid)} receives: ${gets.length ? gets.join(', ') : '<span class="player-pos">nothing</span>'}</div>`;
    });
  } else {
    (t.roster_ids || []).forEach(rid => {
      const added = Object.keys(t.adds || {}).filter(pid => String(t.adds[pid]) === String(rid));
      const dropped = Object.keys(t.drops || {}).filter(pid => String(t.drops[pid]) === String(rid));

      const bits = [];
      added.forEach(pid => bits.push(`<span class="tx-add">+ ${playerDisplayName(pid)}</span>`));
      dropped.forEach(pid => bits.push(`<span class="tx-drop">&minus; ${playerDisplayName(pid)}</span>`));

      const bid = t.settings && t.settings.waiver_bid != null ? ` <span class="player-pos">($${t.settings.waiver_bid} bid)</span>` : '';

      if (bits.length) {
        lines += `<div class="tx-line">${teamLink(rid)}: ${bits.join(' · ')}${bid}</div>`;
      }
    });
  }

  if (!lines) lines = `<div class="tx-line"><span class="player-pos">No player movement recorded</span></div>`;

  return `
    <div class="tx-card">
      <div class="tx-top">
        <span class="tx-badge ${t.type}">${txTypeLabel(t.type)}</span>
        <span class="tx-date">${date}</span>
      </div>
      ${lines}
    </div>
  `;
}

/* ---------- news (Sleeper player news) ---------- */

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Escape a string for safe use inside a single-quoted JS string in an inline onclick.
function escJs(s) {
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

// The "My Team" tab: your roster (with each player's latest news) plus your draft picks.
// Which team is "yours" is saved locally and defaults to your Sleeper account's team; it
// also drives the Team Analyzer and the first team in the Trade Builder.
function renderNews() {
  const rid = myRosterId();

  const options = state.rosters
    .map(r => String(r.roster_id))
    .sort((a,b) => teamName(a).localeCompare(teamName(b)))
    .map(x => `<option value="${x}" ${String(x) === String(rid) ? 'selected' : ''}>${teamName(x)}</option>`)
    .join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="year-selector">
      <span class="section-label" style="margin:0;">My Team</span>
      <select class="year-select" onchange="selectMyTeam(this.value)">${options}</select>
    </div>
    <div class="coach-sub">Your roster in lineup order with each player's latest news, plus your draft picks. Pick a different team above to set which one is yours (saved on this device).</div>
    <div id="myTeamArea">
      <div class="status"><div class="spinner"></div><p>Loading your team...</p></div>
    </div>
  `;

  loadMyTeam(rid);
}

// Selecting a team here sets "my team" everywhere (saved locally).
function selectMyTeam(rid) {
  setMyTeam(rid);
  renderNews();
}

async function loadMyTeam(rid) {
  const s = state;
  try { await loadValues(); } catch(e) {}

  if (!s.newsByTeam[rid]) {
    const roster = s.rosters.find(r => String(r.roster_id) === String(rid));

    // Order players the way Sleeper shows the lineup: starters in slot order
    // (QB, RB, RB, WR, ...), then the bench grouped by position.
    const POS_PRI = { QB:0, RB:1, WR:2, TE:3, K:4, DEF:5 };
    const eligible = pid => {
      const p = s.players[pid];
      return p && ['QB','RB','WR','TE','K'].indexOf(p.position) !== -1;
    };

    const ordered = [];
    const seenPid = {};
    ((roster && roster.starters) || []).map(String).forEach(pid => {
      if (pid && pid !== '0' && !seenPid[pid] && eligible(pid)) { ordered.push(pid); seenPid[pid] = 1; }
    });

    const bench = ((roster && roster.players) || []).map(String)
      .filter(pid => !seenPid[pid] && eligible(pid))
      .sort((a,b) => {
        const pa = s.players[a] || {}, pb = s.players[b] || {};
        const pr = (POS_PRI[pa.position] == null ? 9 : POS_PRI[pa.position]) -
                   (POS_PRI[pb.position] == null ? 9 : POS_PRI[pb.position]);
        if (pr) return pr;
        return (pb.news_updated || 0) - (pa.news_updated || 0);
      });
    bench.forEach(pid => { ordered.push(pid); seenPid[pid] = 1; });

    const orderIdx = {};
    ordered.forEach((pid, i) => orderIdx[pid] = i);

    const ids = ordered.slice(0, 40);

    const items = [];
    const chunks = [];
    for (let i = 0; i < ids.length; i += 20) chunks.push(ids.slice(i, i + 20));

    try {
      const responses = await Promise.all(chunks.map(chunk => {
        const q = 'query{' + chunk.map(pid =>
          'n' + pid + ': get_player_news(sport:"nfl",player_id:"' + pid + '",limit:5)' +
          '{metadata published source}'
        ).join(' ') + '}';
        return fetchGraphQL(q).catch(() => ({ data:{} }));
      }));

      // Collect every story, grouped by player, newest first within each player.
      const byPid = {};
      const seen = {};
      responses.forEach(res => {
        const data = (res && res.data) || {};
        Object.keys(data).forEach(alias => {
          const pid = alias.slice(1);
          (data[alias] || []).forEach(n => {
            const md = n.metadata || {};
            if (!md.title && !md.description) return;
            const key = pid + '|' + (n.published || 0) + '|' + (md.title || '');
            if (seen[key]) return;
            seen[key] = 1;
            (byPid[pid] = byPid[pid] || []).push({
              title: md.title || '',
              description: md.description || '',
              analysis: md.analysis || '',
              source: n.source || '',
              published: n.published || 0
            });
          });
        });
      });

      Object.keys(byPid).forEach(pid => byPid[pid].sort((a,b) => b.published - a.published));
      // Keep the full lineup-ordered roster so players WITHOUT news still show as roster rows.
      s.newsByTeam[rid] = { byPid: byPid, ordered: ordered };
    } catch (e) {
      s.newsByTeam[rid] = { error: e.message, byPid: {}, ordered: [] };
    }
  }

  if (s !== state || state.activeTab !== 'news' || String(myRosterId()) !== String(rid)) return;

  const target = document.getElementById('myTeamArea');
  if (!target) return;

  const data = s.newsByTeam[rid];
  const M = buildValueModel();

  // Draft picks section
  const picks = coachPicks(rid);
  let html = `<div class="detail-title" style="margin-top:0;">Draft Picks</div>`;
  html += picks.length
    ? `<div class="roster-list">` + picks.map(pk =>
        `<div class="roster-row"><span><span class="pos-badge pos-pick">PICK</span> ${pk.label}${pk.via ? ` <span class="tb-meta">via ${escHtml(pk.via)}</span>` : ''}</span><span class="tb-val">${Math.round(pk.value).toLocaleString()}</span></div>`
      ).join('') + `</div>`
    : `<div class="empty">No tradeable draft picks.</div>`;

  // Roster section — every player in lineup order; a news card if there's news, else a plain row.
  html += `<div class="detail-title">Roster &amp; News</div>`;
  if (data.error) {
    html += `<div class="error-msg">Could not load news: ${escHtml(data.error)}</div>`;
  }
  const ordered = data.ordered || [];
  if (!ordered.length) {
    html += `<div class="empty">No roster players found.</div>`;
  } else {
    html += `<div class="list-stack">` + ordered.map(pid => {
      const items = (data.byPid || {})[pid];
      if (items && items.length) return newsGroupHtml({ pid: pid, items: items });
      return myTeamPlayerRow(pid, M);
    }).join('') + `</div>`;
  }

  target.innerHTML = html;
}

// A roster player with no recent news: a compact row (position, name, dynasty value).
function myTeamPlayerRow(pid, M) {
  const p = state.players[String(pid)] || {};
  const pos = p.position || '';
  return `<div class="mt-row">
    <span class="team-with-avatar">${pos ? `<span class="pos-badge pos-${pos.toLowerCase()}">${pos}</span> ` : ''}<b>${pLink(pid)}</b>${playerInjuryTag(pid)}
      <span class="tx-date">${escHtml([p.team, p.age ? 'Age ' + p.age : ''].filter(Boolean).join(' · '))}</span></span>
    <span class="tx-date">${Math.round(M.dynValue(pid)).toLocaleString()} · <span class="mt-nonews">no recent news</span></span>
  </div>`;
}

function newsDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}

// One player = one collapsed card showing the latest headline; expands to every story.
function newsGroupHtml(g) {
  const p = state.players[String(g.pid)] || {};
  const posMeta = [p.position, p.team].filter(Boolean).join(' · ');
  const latest = g.items[0];
  const more = g.items.length - 1;

  const story = (n, i) => `
    <div class="news-story">
      <div class="tx-date">${escHtml([n.source, newsDate(n.published)].filter(Boolean).join(' · '))}</div>
      ${n.title ? `<div class="news-title">${escHtml(n.title)}</div>` : ''}
      ${n.description ? `<div class="tx-line">${escHtml(n.description)}</div>` : ''}
      ${n.analysis && n.analysis !== n.description ? `<div class="trade-why">${escHtml(n.analysis)}</div>` : ''}
    </div>
  `;

  return `
    <details class="news-card">
      <summary>
        <div class="news-sum-top">
          <span class="team-with-avatar"><b>${pLink(g.pid)}</b>${playerInjuryTag(g.pid)}
            <span class="tx-date">${escHtml(posMeta)}</span></span>
          <span class="tx-date">${escHtml(newsDate(latest.published))}${more > 0 ? ' · +' + more : ''}</span>
        </div>
        <div class="news-headline">${escHtml(latest.title || latest.description)}</div>
      </summary>
      <div class="news-body">${g.items.map(story).join('')}</div>
    </details>
  `;
}

/* ---------- settings ---------- */

function scoringLabel() {
  const s = state.league && state.league.scoring_settings;
  if (!s || s.rec == null) return '';
  if (s.rec === 1) return 'PPR';
  if (s.rec === 0.5) return 'Half PPR';
  if (s.rec === 0) return 'Standard';
  return s.rec + ' PPR';
}

function renderSettings() {
  const league = state.league;

  const infoRows = [];

  if (league) {
    infoRows.push(['League', league.name || '—']);
    infoRows.push(['Season', league.season || '—']);
    infoRows.push(['Status', String(league.status || '—').replace(/_/g, ' ')]);
    infoRows.push(['Teams', league.total_rosters || '—']);

    const scoring = scoringLabel();
    if (scoring) infoRows.push(['Scoring', scoring]);

    if (league.settings && league.settings.draft_rounds) {
      infoRows.push(['Draft rounds', league.settings.draft_rounds]);
    }

    if (league.settings && league.settings.playoff_week_start) {
      infoRows.push(['Playoffs start', 'Week ' + league.settings.playoff_week_start]);
    }

    if (league.roster_positions) {
      const starters = league.roster_positions.filter(p => p !== 'BN');
      infoRows.push(['Lineup', starters.join(', ')]);
    }
  }

  const isCustom = state.leagueId !== DEFAULT_LEAGUE_ID;

  const html = `
    <div class="settings-panel" style="margin-top:0;">
      <h2>Settings</h2>

      <div class="detail-title">Sleeper League ID</div>
      <div class="hint">The site follows whatever league ID you save here — it's stored on this device, so the website travels with you. Paste a new ID any time your league changes.</div>

      ${state.settingsError ? `<div class="settings-error">${state.settingsError}</div>` : ''}

      <input class="settings-input" id="leagueIdInput" value="${state.leagueId}" placeholder="Sleeper league ID">

      <div class="note-actions">
        <button class="save-btn" id="saveLeagueBtn" onclick="saveLeagueId()">Save &amp; Load League</button>
        ${isCustom ? `<button class="cancel-btn" onclick="resetLeagueId()">Reset to Home League</button>` : ''}
      </div>

      ${league ? `
        <div class="detail-title" style="margin-top:24px;">Current League</div>
        <div class="detail-box">
          <div class="roster-list">
            ${infoRows.map(([k, v]) => `
              <div class="roster-row">
                <span class="player-pos">${k}</span>
                <span style="text-align:right;">${v}</span>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;
}

async function saveLeagueId() {
  const input = document.getElementById('leagueIdInput');
  const newId = (input ? input.value : '').trim();

  if (!newId) {
    state.settingsError = 'Enter a league ID first.';
    renderSettings();
    return;
  }

  const btn = document.getElementById('saveLeagueBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking...'; }

  try {
    await fetchJSON(API + '/league/' + newId);
  } catch(e) {
    state.settingsError = 'Could not find a Sleeper league with ID "' + newId + '" (' + e.message + ')';
    renderSettings();
    return;
  }

  try { localStorage.setItem(LEAGUE_ID_STORAGE_KEY, newId); } catch(e) {}

  applyLeagueChange();
}

function resetLeagueId() {
  try { localStorage.removeItem(LEAGUE_ID_STORAGE_KEY); } catch(e) {}
  applyLeagueChange();
}

function applyLeagueChange() {
  const notesUnlocked = state.notesUnlocked;
  state = freshState();
  state.notesUnlocked = notesUnlocked;
  state.activeTab = 'draft';

  document.querySelectorAll('.tab').forEach(button => {
    button.classList.toggle('active', button.dataset.tab === 'draft');
  });

  init();
}

/* ---------- league notes ---------- */

async function loadNotes() {
  const snap = await db.collection(NOTES_COLLECTION).get();

  state.notes = snap.docs.map((doc, index) => {
    const data = doc.data();
    return {
      id: doc.id,
      order: data.order ?? index,
      ...data
    };
  }).sort((a,b) => {
    const ao = a.order ?? 9999;
    const bo = b.order ?? 9999;
    return ao - bo;
  });
}

function unlockNotes() {
  const pass = prompt('Enter league notes passcode:');

  if (pass === NOTE_PASSCODE) {
    state.notesUnlocked = true;
    renderLeagueNotes();
  } else if (pass !== null) {
    alert('Incorrect passcode.');
  }
}

function showNoteForm() {
  if (!state.notesUnlocked) {
    unlockNotes();
    return;
  }

  state.editingNoteId = null;

  const form = document.getElementById('noteForm');
  const header = document.getElementById('noteHeader');
  const description = document.getElementById('noteDescription');
  const saveButton = document.getElementById('noteSaveButton');

  if (header) header.value = '';
  if (description) description.value = '';
  if (saveButton) saveButton.textContent = 'Save Note';
  if (form) form.classList.add('active');
}

function cancelNote() {
  state.editingNoteId = null;

  const header = document.getElementById('noteHeader');
  const description = document.getElementById('noteDescription');
  const form = document.getElementById('noteForm');
  const saveButton = document.getElementById('noteSaveButton');

  if (header) header.value = '';
  if (description) description.value = '';
  if (saveButton) saveButton.textContent = 'Save Note';
  if (form) form.classList.remove('active');
}

function editExistingNote(noteId) {
  if (!state.notesUnlocked) {
    unlockNotes();
    return;
  }

  const note = state.notes.find(n => n.id === noteId);
  if (!note) return;

  state.editingNoteId = noteId;

  const form = document.getElementById('noteForm');
  const header = document.getElementById('noteHeader');
  const description = document.getElementById('noteDescription');
  const saveButton = document.getElementById('noteSaveButton');

  if (header) header.value = note.header || '';
  if (description) description.value = note.description || '';
  if (saveButton) saveButton.textContent = 'Update Note';
  if (form) form.classList.add('active');

  setTimeout(() => {
    if (form) form.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 50);
}

async function saveNote() {
  if (!state.notesUnlocked) {
    unlockNotes();
    return;
  }

  const header = document.getElementById('noteHeader').value.trim();
  const description = document.getElementById('noteDescription').value.trim();

  if (!header || !description) {
    alert('Add both a header and description.');
    return;
  }

  if (state.editingNoteId) {
    await db.collection(NOTES_COLLECTION).doc(state.editingNoteId).update({
      header,
      description,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } else {
    await db.collection(NOTES_COLLECTION).add({
      header,
      description,
      order: state.notes.length,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  state.editingNoteId = null;
  await loadNotes();
  renderLeagueNotes();
}

async function moveNote(noteId, direction) {
  if (!state.notesUnlocked) {
    unlockNotes();
    return;
  }

  const index = state.notes.findIndex(n => n.id === noteId);
  if (index === -1) return;

  const swapIndex = direction === 'up' ? index - 1 : index + 1;
  if (swapIndex < 0 || swapIndex >= state.notes.length) return;

  const current = state.notes[index];
  const swap = state.notes[swapIndex];

  const currentOrder = current.order ?? index;
  const swapOrder = swap.order ?? swapIndex;

  await db.collection(NOTES_COLLECTION).doc(current.id).update({
    order: swapOrder,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  await db.collection(NOTES_COLLECTION).doc(swap.id).update({
    order: currentOrder,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  await loadNotes();
  renderLeagueNotes();
}

async function deleteNote(noteId) {
  if (!state.notesUnlocked) {
    unlockNotes();
    return;
  }

  const ok = confirm('Delete this league note?');
  if (!ok) return;

  await db.collection(NOTES_COLLECTION).doc(noteId).delete();

  await loadNotes();

  const batch = db.batch();
  state.notes.forEach((note, index) => {
    const ref = db.collection(NOTES_COLLECTION).doc(note.id);
    batch.update(ref, { order: index });
  });
  await batch.commit();

  await loadNotes();
  renderLeagueNotes();
}

function renderLeagueNotes() {
  let html = `
    <div class="notes-panel">
      <div class="notes-top">
        <h2>League Notes</h2>
        <button class="edit-btn" onclick="showNoteForm()">Edit</button>
      </div>

      <div class="note-form" id="noteForm">
        <input class="note-input" id="noteHeader" placeholder="Note Header">
        <textarea class="note-textarea" id="noteDescription" placeholder="Brief Description"></textarea>
        <div class="note-actions">
          <button class="save-btn" id="noteSaveButton" onclick="saveNote()">Save Note</button>
          <button class="cancel-btn" onclick="cancelNote()">Cancel</button>
        </div>
      </div>

      <div class="notes-list">
  `;

  if (!state.notes.length) {
    html += `<div class="empty">No league notes added yet</div>`;
  } else {
    state.notes.forEach((note, index) => {
      html += `
        <div class="note-card">
          <div class="note-card-top">
            <div>
              <h3>${note.header || ''}</h3>
              <p>${note.description || ''}</p>
            </div>

            ${state.notesUnlocked ? `
              <div class="note-card-actions">
                <button class="edit-btn" onclick="moveNote('${note.id}', 'up')" ${index === 0 ? 'disabled' : ''}>↑</button>
                <button class="edit-btn" onclick="moveNote('${note.id}', 'down')" ${index === state.notes.length - 1 ? 'disabled' : ''}>↓</button>
                <button class="edit-btn" onclick="editExistingNote('${note.id}')">Edit</button>
                <button class="delete-btn" onclick="deleteNote('${note.id}')">Delete</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    });
  }

  html += `
      </div>
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;
}

init();
</script>

</body>
</html>
