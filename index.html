function dcTeamCountKey() {
  const n = state.rosters.length || 12;
  let best = 12, bd = 1e9;
  [8, 10, 12, 14, 16].forEach(o => { const d = Math.abs(o - n); if (d < bd) { bd = d; best = o; } });
  return String(best);
}

// Map a {pid: score} table onto a sorted descending list of FantasyCalc values, by rank.
function rankMapOntoFc(scoreByPid, fcValsDesc) {
  const out = {};
  const items = Object.keys(scoreByPid).map(pid => [pid, scoreByPid[pid]]).sort((a,b) => b[1] - a[1]);
  const n = items.length, nfc = fcValsDesc.length;
  if (!n || !nfc) return out;
  items.forEach((it, i) => {
    const idx = n <= 1 ? 0 : Math.min(nfc - 1, Math.round(i / (n - 1) * (nfc - 1)));
    out[it[0]] = fcValsDesc[idx];
  });
  return out;
}

async function loadValues() {
  const s = state;
  if (s.vals) return s.vals;

  const numQbs = isSuperflex() ? 2 : 1;
  const numTeams = s.rosters.length || 12;
  const rec = s.league && s.league.scoring_settings && s.league.scoring_settings.rec;
  const ppr = (rec == null ? 1 : rec);
  const sf = isSuperflex();
  const tePrem = !!(s.league && s.league.scoring_settings && s.league.scoring_settings.bonus_rec_te);

  const fcUrl = 'https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=' +
    numQbs + '&numTeams=' + numTeams + '&ppr=' + ppr;
  const ffFormat = sf ? (tePrem ? 'dynasty-sf-ppr-tep' : 'dynasty-sf-ppr') : 'dynasty-1qb-ppr-tep';
  const ffUrl = FF_SUPA_URL + '?format_id=eq.' + ffFormat + '&select=player_id,score&limit=3000';

  // FantasyCalc is the scale anchor (required); the other two are best-effort.
  let fcRows;
  try {
    fcRows = await fetchJSON(fcUrl);
  } catch (e) {
    const failed = { byId:{}, picks:{}, ok:false, err:e.message };
    if (s === state) s.vals = failed;
    return failed;
  }

  let ffRows = null, dpText = null, dcText = null;
  await Promise.all([
    (async () => {
      try {
        const r = await fetch(ffUrl, { headers: { apikey: FF_ANON_KEY, Authorization: 'Bearer ' + FF_ANON_KEY } });
        if (r.ok) ffRows = await r.json();
      } catch (e) { ffRows = null; }
    })(),
    (async () => {
      try {
        const r = await fetch(DP_VALUES_URL);
        if (r.ok) dpText = await r.text();
      } catch (e) { dpText = null; }
    })(),
    (async () => {
      try {
        const r = await fetch(DC_RANKINGS_URL);
        if (r.ok) dcText = await r.text();
      } catch (e) { dcText = null; }
    })()
  ]);

  const fc = {};
  const fcPicks = {};
  (fcRows || []).forEach(row => {
    const p = row.player || {};
    if (p.position === 'PICK') { fcPicks[p.name] = row.value || 0; return; }
    if (!p.sleeperId) return;
    fc[String(p.sleeperId)] = { value: row.value || 0, redraft: (row.redraftValue != null ? row.redraftValue : row.value) || 0 };
  });

  // Draft-pick values come from DynastyCalc (its calculator data chunk), keyed to the league's
  // team count + format. Fall back to FantasyCalc's picks only if DynastyCalc is unreachable.
  const dcTc = dcTeamCountKey();
  const dcValKey = tePrem ? (sf ? 'tepSf' : 'tep') : (sf ? 'superflex' : 'value');
  const dcPicks = dcText ? await loadDcPicks(dcText, dcTc, dcValKey) : {};
  const picks = Object.keys(dcPicks).length ? dcPicks : fcPicks;
  const picksSource = Object.keys(dcPicks).length ? 'DynastyCalc' : 'FantasyCalc';

  const fcValsDesc = Object.keys(fc).map(k => fc[k].value).sort((a,b) => b - a);

  // name+pos -> sleeper id, for the CSV source
  const nameIdx = {};
  Object.keys(s.players).forEach(pid => {
    const p = s.players[pid];
    if (!p || ['QB','RB','WR','TE'].indexOf(p.position) === -1) return;
    const k = ktcNameKey(p.full_name) + '|' + p.position;
    if (!(k in nameIdx) || (p.active && p.team)) nameIdx[k] = pid;
  });

  // theffdynasty scores keyed by Sleeper id
  const ffScore = {};
  (ffRows || []).forEach(r => {
    const pid = String(r.player_id);
    if (/^\d+$/.test(pid) && s.players[pid]) ffScore[pid] = r.score;
  });

  // DynastyProcess values keyed to Sleeper id by name
  const dpScore = {};
  if (dpText) {
    const col = sf ? 'value_2qb' : 'value_1qb';
    parseCsv(dpText).forEach(row => {
      if (['QB','RB','WR','TE'].indexOf(row.pos) === -1) return;
      const pid = nameIdx[ktcNameKey(row.player) + '|' + row.pos];
      const v = Number(row[col]) || 0;
      if (pid && v) dpScore[pid] = v;
    });
  }

  // DynastyCalc values from its rankings page (best-effort scrape), keyed to Sleeper id by name
  const dcScore = {};
  if (dcText) {
    const tc = dcTc;
    const valKey = dcValKey;
    const rt = dcText.replace(/\\"/g, '"');
    const dcRe = new RegExp('"name":"((?:\\\\.|[^"\\\\])*)","position":"(QB|RB|WR|TE)","team":"[^"]*","age":\\d+,"values":\\{[\\s\\S]*?"' + tc + '":\\{"value":(\\d+),"superflex":(\\d+),"tep":(\\d+),"tepSf":(\\d+)\\}', 'g');
    let m;
    while ((m = dcRe.exec(rt))) {
      const pid = nameIdx[ktcNameKey(m[1]) + '|' + m[2]];
      if (pid && s.players[pid]) {
        const vals = { value: +m[3], superflex: +m[4], tep: +m[5], tepSf: +m[6] };
        dcScore[pid] = vals[valKey] || vals.value;
      }
    }
  }

  const ffScaled = rankMapOntoFc(ffScore, fcValsDesc);
  const dpScaled = rankMapOntoFc(dpScore, fcValsDesc);
  const dcScaled = rankMapOntoFc(dcScore, fcValsDesc);

  const sources = ['FantasyCalc'];
  if (Object.keys(ffScaled).length) sources.push('theffdynasty');
  if (Object.keys(dpScaled).length) sources.push('DynastyProcess');
  if (Object.keys(dcScaled).length) sources.push('DynastyCalc');

  const byId = {};
  const allPids = {};
  [fc, ffScaled, dpScaled, dcScaled].forEach(map => Object.keys(map).forEach(pid => allPids[pid] = 1));
  Object.keys(allPids).forEach(pid => {
    if (!s.players[pid]) return;
    // parts: each source's contribution (on FantasyCalc's scale) that feeds the average
    const parts = [];
    if (fc[pid]) parts.push({ src:'FantasyCalc', value: fc[pid].value });
    if (ffScaled[pid] != null) parts.push({ src:'theffdynasty', value: ffScaled[pid] });
    if (dpScaled[pid] != null) parts.push({ src:'DynastyProcess', value: dpScaled[pid] });
    if (dcScaled[pid] != null) parts.push({ src:'DynastyCalc', value: dcScaled[pid] });
    if (!parts.length) return;
    const value = parts.reduce((a,b) => a + b.value, 0) / parts.length;
    byId[pid] = { value: value, redraft: fc[pid] ? fc[pid].redraft : value, posRank: null, parts: parts };
  });

  // Positional rank from the blended values.
  const posLists = { QB:[], RB:[], WR:[], TE:[] };
  Object.keys(byId).forEach(pid => {
    const pos = (s.players[pid] || {}).position;
    if (posLists[pos]) posLists[pos].push(pid);
  });
  Object.keys(posLists).forEach(pos => {
    posLists[pos].sort((a,b) => byId[b].value - byId[a].value);
    posLists[pos].forEach((pid, i) => byId[pid].posRank = i + 1);
  });

  const vals = { byId:byId, picks:picks, picksSource:picksSource, ok: Object.keys(byId).length > 0, sf:sf, sources:sources };
  if (!vals.ok) vals.err = 'no values returned';
  if (s === state) s.vals = vals;
  return vals;
}

function valueSourceLabel() {
  const src = (state.vals && state.vals.sources) || ['FantasyCalc'];
  return src.length > 1 ? 'avg of ' + src.join(' + ') : src[0];
}

async function fetchGraphQL(query) {
  const r = await fetch('https://sleeper.com/graphql', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: query })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function isSuperflex() {
  const rp = (state.league && state.league.roster_positions) || [];
  return rp.indexOf('SUPER_FLEX') !== -1 || rp.filter(p => p === 'QB').length > 1;
}

function starterCounts() {
  const rp = (state.league && state.league.roster_positions) || [];
  const c = { QB:0, RB:0, WR:0, TE:0, FLEX:0, SUPER_FLEX:0 };
  rp.forEach(p => { if (c[p] !== undefined) c[p]++; });
  if (!c.QB && !c.SUPER_FLEX) c.QB = 1;
  if (!c.RB) c.RB = 2;
  if (!c.WR) c.WR = 2;
  if (!c.TE) c.TE = 1;
  return c;
}

function buildValueModel() {
  const sf = isSuperflex();
  const vals = state.vals || { byId:{}, picks:{} };

  // Fallback ordering (Sleeper search_rank within position) only affects deep players
  // FantasyCalc doesn't price — real starters are always on its board.
  const byPos = { QB:[], RB:[], WR:[], TE:[] };
  Object.keys(state.players).forEach(pid => {
    const p = state.players[pid];
    if (!p || !p.active || !p.team) return;
    if (typeof p.search_rank !== 'number' || p.search_rank >= 9000) return;
    if (!byPos[p.position]) return;
    byPos[p.position].push(p);
  });

  const fbRank = {};
  Object.keys(byPos).forEach(pos => {
    byPos[pos].sort((a,b) =>
      (a.search_rank - b.search_rank) || String(a.full_name||'').localeCompare(String(b.full_name||''))
    );
    byPos[pos].forEach((p, i) => fbRank[String(p.player_id)] = i + 1);
  });

  const baseCache = {};
  const dynCache = {};

  function winNowMult(pos, age) {
    const curve = WINNOW_AGE[pos];
    if (!curve || age == null) return 1;
    for (let i = 0; i < curve.length; i++) if (age <= curve[i][0]) return curve[i][1];
    return 1;
  }

  // Dynasty (long-term) value: FantasyCalc's dynasty value.
  function dynValue(pid) {
    const key = String(pid);
    if (dynCache[key] !== undefined) return dynCache[key];

    let v = 0;
    const f = vals.byId[key];
    if (f) {
      v = f.value;
    } else {
      const p = state.players[key];
      const r = fbRank[key];
      if (p && r && FALLBACK_PEAK[p.position]) {
        v = FALLBACK_PEAK[p.position] * Math.exp(-(r - 1) / 8) * (INJURY_DISCOUNT[p.injury_status] || 1);
      }
    }
    dynCache[key] = v;
    return v;
  }

  // Win-now value: FantasyCalc's redraftValue; deep players not on its board fall back to
  // an age-tilted dynasty value.
  function baseValue(pid) {
    const key = String(pid);
    if (baseCache[key] !== undefined) return baseCache[key];
    const f = vals.byId[key];
    let v;
    if (f) {
      v = f.redraft || f.value;
    } else {
      const p = state.players[key] || {};
      v = dynValue(key) * winNowMult(p.position, p.age);
    }
    baseCache[key] = v;
    return v;
  }

  function posRankOf(pid) {
    const f = vals.byId[String(pid)];
    if (f && f.posRank) return f.posRank;
    return fbRank[String(pid)] || null;
  }

  function startable(pid) {
    const p = state.players[String(pid)];
    if (!p) return false;
    const r = posRankOf(pid);
    return !!(r && STARTABLE_DEPTH[p.position] && r <= STARTABLE_DEPTH[p.position]);
  }

  return { sf, baseValue, dynValue, startable, posRank: posRankOf };
}

const ROUND_ORD = { 1:'1st', 2:'2nd', 3:'3rd', 4:'4th', 5:'5th', 6:'6th', 7:'7th' };

// Maps a pick to its value. Prefers DynastyCalc's pick values (keyed either by exact overall
// slot "2026 Pick 12", or by tier "2027 Early 1st Round"); falls back to FantasyCalc's naming
// if DynastyCalc picks weren't reachable.
function pickValue(year, round, overall, numTeams) {
  const picks = (state.vals && state.vals.picks) || {};
  const nt = numTeams || 12;
  const ord = ROUND_ORD[round];
  let tier = 'Mid';
  if (overall) {
    const frac = (overall - (round - 1) * nt) / nt;
    tier = frac <= 1/3 ? 'Early' : (frac <= 2/3 ? 'Mid' : 'Late');
  }

  // DynastyCalc keys
  if (overall) {
    const dcExact = picks[year + ' Pick ' + overall];
    if (dcExact != null) return dcExact;
  }
  if (ord) {
    const dcTier = picks[year + ' ' + tier + ' ' + ord + ' Round'];
    if (dcTier != null) return dcTier;
    const dcMid = picks[year + ' Mid ' + ord + ' Round'];
    if (dcMid != null) return dcMid;
  }

  // FantasyCalc-style fallback
  if (overall) {
    const slot = overall - (round - 1) * nt;
    if (slot >= 1) {
      const exact = picks[year + ' Pick ' + round + '.' + String(slot).padStart(2, '0')];
      if (exact != null) return exact;
    }
  }
  if (ord) {
    const tiered = picks[year + ' ' + ord + ' (' + tier + ')'];
    if (tiered != null) return tiered;
    const generic = picks[year + ' ' + ord];
    if (generic != null) return generic;
  }

  // Rounds DynastyCalc doesn't list (6th+): decay from the 5th (already tiny) so a deeper
  // pick is never worth more than a shallower one. Fall back to the 4th only if no 5th exists.
  const a5 = picks[year + ' Mid 5th Round'] || picks['2028 Mid 5th Round'] || picks['2029 Mid 5th Round'];
  if (a5 != null) return Math.max(1, Math.round(a5 * Math.pow(0.6, Math.max(1, round - 5))));
  const a4 = picks[year + ' Mid 4th Round'] || picks[year + ' 4th'] || picks['2028 Mid 4th Round'] || 20;
  return Math.max(1, Math.round(a4 * Math.pow(0.5, Math.max(1, round - 4))));
}

// Fetch DynastyCalc's pick values from its data chunk (the rankings page references it).
// Best-effort: stops at the first chunk that carries the pick table, returns {} on failure.
async function loadDcPicks(rankingsHtml, tc, valKey) {
  try {
    const base = 'https://www.dynastycalc.com';
    const urls = Array.from(new Set((rankingsHtml.match(/\/_next\/static\/chunks\/[A-Za-z0-9_.-]+\.js/g) || [])))
      .filter(u => !/turbopack/.test(u));
    for (const u of urls) {
      let txt = '';
      try { const r = await fetch(base + u); if (r.ok) txt = await r.text(); } catch (e) { continue; }
      if (txt.indexOf('id:"dp') !== -1 && /1st Round/.test(txt)) return parseDcPicks(txt, tc, valKey);
    }
  } catch (e) {}
  return {};
}
// Parse the pick objects out of the chunk into { "<DynastyCalc pick name>": value }.
function parseDcPicks(chunk, tc, valKey) {
  const out = {};
  const nameRe = /name:"(20\d\d (?:Pick \d+|(?:Early|Mid|Late) \d(?:st|nd|rd|th) Round))"/g;
  const valRe = new RegExp('[,{]' + tc + ':\\{value:(\\d+),superflex:(\\d+),tep:(\\d+),tepSf:(\\d+)\\}');
  let m;
  while ((m = nameRe.exec(chunk))) {
    const vm = chunk.slice(m.index, m.index + 500).match(valRe);
    if (!vm) continue;
    const vals = { value: +vm[1], superflex: +vm[2], tep: +vm[3], tepSf: +vm[4] };
    out[m[1]] = vals[valKey] || vals.value;
  }
  return out;
}

/* ---------- Value Adjustment (KeepTradeCut-style consolidation/stud premium) ----------
   Raw addition says "a pile of picks = one stud" — but one elite player takes a single
   roster spot and is far harder to acquire. So we credit the side that CONSOLIDATES: gives
   up more pieces than it takes back. A 1-for-1 (or any even piece count) gets no premium.
   Calibrated to KTC: their Amon-Ra example is +2,783 at gap 2 and +4,289 at gap 3, i.e.
   ≈ 0.175 × value × gap. It updates live as pieces are added to either side. */
const VA_EXPLAIN = "Value Adjustment\n\nTrading is more than simple addition. We add value to the side that gives up more pieces than it gets back — because consolidating into one stud uses a single roster spot and is far harder to acquire than a pile of picks. A 1-for-1 swap gets no adjustment. This counters calculators that call 12 late picks a fair deal for a superstar, and updates as players are added to either side.";
const VA_STUD_FLOOR = 3000;   // below this, a player is a role piece (no premium)
const VA_STUD_CEIL = 8000;    // at/above this, fully "elite" on our blended scale
const VA_RATE = 0.175;        // premium per net piece consolidated (matches KTC's examples)
const VA_GAP_CAP = 6;

function vaStudWeight(v) {
  return Math.max(0, Math.min(1, (v - VA_STUD_FLOOR) / (VA_STUD_CEIL - VA_STUD_FLOOR)));
}
// Premium credited to a side that consolidates: gap = (pieces it GAVE) − (pieces it GOT).
// Zero for a 1-for-1 or a side taking back more pieces than it sends. Scales with the top
// asset received (its "stud factor") so consolidating into an elite is worth the most.
function valueAdjustment(receivedValues, piecesGiven) {
  if (!receivedValues.length) return 0;
  const top = Math.max.apply(null, receivedValues);
  const gap = Math.max(0, (piecesGiven || 0) - receivedValues.length);
  return Math.round(top * vaStudWeight(top) * VA_RATE * Math.min(gap, VA_GAP_CAP));
}

function coachPicks(rosterId) {
  const nt = state.rosters.length || 12;
  return getAllOwnedPicks(rosterId).map(p => {
    const ord = ROUND_ORD[p.round];
    const base = p.exactSlot ? (p.year + ' ' + p.exactSlot) : (p.year + ' ' + (ord || ('R' + p.round)));
    // Multiple identical future picks (e.g. two 2027 1sts) are distinguished by their
    // original team, and get a unique id so each can be added to a trade independently.
    return {
      id: p.year + '|' + p.round + '|' + p.originalRosterId,
      label: base,
      via: String(p.originalRosterId) !== String(rosterId) ? p.origName : '',
      year: p.year,
      round: p.round,
      overall: p.overall,
      value: pickValue(p.year, p.round, p.overall, nt)
    };
  }).sort((a,b) => b.value - a.value);
}

function optimalLineup(playerIds, M) {
  const counts = starterCounts();
  const byPos = {};
  playerIds.forEach(pid => {
    const pos = playerPositionOf(pid);
    if (!byPos[pos]) byPos[pos] = [];
    byPos[pos].push(pid);
  });
  Object.keys(byPos).forEach(k => byPos[k].sort((a,b) => M.baseValue(b) - M.baseValue(a)));

  const used = {};
  const picked = [];
  let total = 0;
  let filled = true;

  ['QB','RB','WR','TE'].forEach(pos => {
    const need = counts[pos] || 0;
    const have = (byPos[pos] || []).filter(p => !used[p]);
    if (have.length < need) filled = false;
    have.slice(0, need).forEach(p => { used[p] = 1; picked.push(p); total += M.baseValue(p); });
  });

  for (let i = 0; i < (counts.FLEX || 0); i++) {
    const pool = playerIds.filter(p => !used[p] && ['RB','WR','TE'].indexOf(playerPositionOf(p)) !== -1)
      .sort((a,b) => M.baseValue(b) - M.baseValue(a));
    if (!pool.length) { filled = false; break; }
    used[pool[0]] = 1; picked.push(pool[0]); total += M.baseValue(pool[0]);
  }

  for (let i = 0; i < (counts.SUPER_FLEX || 0); i++) {
    const pool = playerIds.filter(p => !used[p] && ['QB','RB','WR','TE'].indexOf(playerPositionOf(p)) !== -1)
      .sort((a,b) => M.baseValue(b) - M.baseValue(a));
    if (!pool.length) { filled = false; break; }
    used[pool[0]] = 1; picked.push(pool[0]); total += M.baseValue(pool[0]);
  }

  return { total, filled, picked };
}

function analyzeTeam(rosterId, M) {
  const roster = state.rosters.find(r => String(r.roster_id) === String(rosterId));
  const players = ((roster && roster.players) || []).map(String);

  const byPos = {};
  players.forEach(pid => {
    const pos = playerPositionOf(pid);
    if (!byPos[pos]) byPos[pos] = [];
    byPos[pos].push(pid);
  });
  Object.keys(byPos).forEach(k => byPos[k].sort((a,b) => M.baseValue(b) - M.baseValue(a)));

  const lineup = optimalLineup(players, M);
  const picks = coachPicks(rosterId);
  const counts = starterCounts();

  // Strength at each starting spot = average value of the players who'd fill it.
  const strength = {};
  ['QB','RB','WR','TE'].forEach(pos => {
    const req = (counts[pos] || 0) + (pos === 'QB' && M.sf ? (counts.SUPER_FLEX || 0) : 0);
    const need = Math.max(1, req);
    const have = (byPos[pos] || []).slice(0, need).map(p => M.baseValue(p));
    while (have.length < need) have.push(0);
    strength[pos] = have.reduce((a,b) => a + b, 0) / need;
  });

  const future = players.reduce((sum,p) => sum + M.dynValue(p), 0)
    + picks.reduce((sum,p) => sum + p.value, 0);

  const weighted = players.filter(p => M.baseValue(p) > 500 && state.players[p] && state.players[p].age);
  const wAge = weighted.length
    ? weighted.reduce((s,p) => s + state.players[p].age * M.baseValue(p), 0) /
      weighted.reduce((s,p) => s + M.baseValue(p), 0)
    : 26;

  return { rosterId:String(rosterId), players, byPos, lineup, picks, strength,
           now:lineup.total, future, age:wAge, roster };
}

function analyzeLeague() {
  const M = buildValueModel();
  const teams = {};
  state.rosters.forEach(r => teams[String(r.roster_id)] = analyzeTeam(r.roster_id, M));

  const ids = Object.keys(teams);
  const nows = ids.map(i => teams[i].now).sort((a,b) => a - b);
  const median = nows[Math.floor(nows.length / 2)];

  const avg = {};
  ['QB','RB','WR','TE'].forEach(pos => {
    avg[pos] = ids.reduce((s,i) => s + teams[i].strength[pos], 0) / ids.length;
  });

  ids.forEach(i => {
    const t = teams[i];
    t.mode = t.now >= median ? 'contend' : 'rebuild';
    t.wNow = t.mode === 'contend' ? 0.72 : 0.32;
    t.pickMult = t.mode === 'contend' ? 0.82 : 1.18;
    t.deficit = {};
    t.posMult = {};
    ['QB','RB','WR','TE'].forEach(pos => {
      t.deficit[pos] = avg[pos] > 0 ? Math.max(0, (avg[pos] - t.strength[pos]) / avg[pos]) : 0;
      t.posMult[pos] = 1 + 0.5 * t.deficit[pos];
    });
  });

  return { M, teams, avg, median };
}

/* ---------- coach: trade engine ---------- */

function valueTo(team, pid, M) {
  const v = team.wNow * M.baseValue(pid) + (1 - team.wNow) * M.dynValue(pid);
  return v * (team.posMult[playerPositionOf(pid)] || 1);
}

function surplusPlayers(team, M) {
  const keep = { QB: M.sf ? 2 : 1, RB:3, WR:3, TE:1 };
  const out = [];

  Object.keys(team.byPos).forEach(pos => {
    if (!keep[pos]) return;

    // A rebuilding team should be willing to sell its win-now piece at a spot
    // it's already strong at — that's the whole point of rebuilding.
    const floor = (team.mode === 'rebuild' && team.deficit[pos] === 0) ? 0 : 1;

    team.byPos[pos].forEach((pid, i) => {
      if (M.baseValue(pid) < 350) return;
      if (i >= keep[pos] || (i >= floor && team.deficit[pos] === 0)) out.push(pid);
    });
  });

  return out.sort((a,b) => M.dynValue(b) - M.dynValue(a));
}

function teamWants(team, pid, M) {
  const pos = playerPositionOf(pid);
  if (!team.deficit[pos] && team.deficit[pos] !== 0) return false;

  const counts = starterCounts();
  const req = pos === 'QB' && M.sf
    ? (counts.QB || 0) + (counts.SUPER_FLEX || 0)
    : (counts[pos] || 1);

  const current = (team.byPos[pos] || []).filter(p => M.startable(p));

  // Already stacked at this spot — only a genuine upgrade on their best moves the needle.
  if (current.length > req + 1) {
    return M.baseValue(pid) > M.baseValue(current[0]) * 1.15;
  }
  if (team.deficit[pos] > 0.05) return true;

  const worst = current.length >= req ? M.baseValue(current[req - 1]) : 0;
  return M.baseValue(pid) > worst * 1.25;
}

function combosOf(items, maxN) {
  const res = [];
  const rec = (start, cur, n) => {
    if (cur.length === n) { res.push(cur.slice()); return; }
    for (let i = start; i < items.length; i++) {
      cur.push(items[i]);
      rec(i + 1, cur, n);
      cur.pop();
    }
  };
  for (let n = 1; n <= maxN; n++) rec(0, [], n);
  return res;
}

function tradeViable(team, lose, gain, picksOut, picksIn, M) {
  const loseSet = {};
  lose.forEach(p => loseSet[p] = 1);
  const after = team.players.filter(p => !loseSet[p]).concat(gain);

  const line = optimalLineup(after, M);
  if (!line.filled) return false;

  if (M.sf) {
    const qbs = after.filter(p => playerPositionOf(p) === 'QB')
      .sort((a,b) => M.baseValue(b) - M.baseValue(a));
    if (qbs.length < 2 || M.baseValue(qbs[1]) < 250) return false;
  }

  const outSet = {};
  picksOut.forEach(p => outSet[p.label + '|' + p.value] = 1);

  const futureAfter = after.reduce((s,p) => s + M.dynValue(p), 0)
    + team.picks.filter(p => !outSet[p.label + '|' + p.value]).reduce((s,p) => s + p.value, 0)
    + picksIn.reduce((s,p) => s + p.value, 0);

  // Contenders can't get worse right now; rebuilders must actually gain future value.
  return team.mode === 'contend'
    ? line.total >= team.now * 0.97
    : futureAfter >= team.future * 1.01;
}

function findTrades(meId, league, limit) {
  const M = league.M;
  const me = league.teams[String(meId)];
  const out = [];

  const myPlayers = surplusPlayers(me, M).slice(0, 8);
  const myPicks = me.picks.filter(p => p.value > 700).slice(0, 9);
  const giveOptions = combosOf(
    myPlayers.map(x => ({ t:'p', x })).concat(myPicks.map(x => ({ t:'k', x }))), 3);

  Object.keys(league.teams).forEach(otherId => {
    if (String(otherId) === String(meId)) return;
    const other = league.teams[otherId];

    const theirPlayers = surplusPlayers(other, M).filter(p => teamWants(me, p, M)).slice(0, 6);
    const theirPicks = other.picks.filter(p => p.value > 1500).slice(0, 2);
    const getOptions = combosOf(
      theirPlayers.map(x => ({ t:'p', x })).concat(theirPicks.map(x => ({ t:'k', x }))), 2);

    getOptions.forEach(get => {
      const gp = get.filter(i => i.t === 'p').map(i => i.x);
      const gk = get.filter(i => i.t === 'k').map(i => i.x);
      const getN = gp.reduce((s,p) => s + M.dynValue(p), 0) + gk.reduce((s,p) => s + p.value, 0);
      if (getN < 900) return;

      giveOptions.forEach(give => {
        const sp = give.filter(i => i.t === 'p').map(i => i.x);
        const sk = give.filter(i => i.t === 'k').map(i => i.x);
        const giveN = sp.reduce((s,p) => s + M.dynValue(p), 0) + sk.reduce((s,p) => s + p.value, 0);
        if (giveN <= 0) return;

        // Fair on a neutral dynasty board, and never a recommendation to overpay.
        if (Math.abs(giveN - getN) / Math.max(giveN, getN) > 0.15) return;
        if (getN < giveN * 0.90) return;
        if (sp.length && !sp.some(p => teamWants(other, p, M))) return;

        const myGain = gp.reduce((s,p) => s + valueTo(me,p,M), 0) + gk.reduce((s,p) => s + p.value*me.pickMult, 0)
                     - sp.reduce((s,p) => s + valueTo(me,p,M), 0) - sk.reduce((s,p) => s + p.value*me.pickMult, 0);
        const thGain = sp.reduce((s,p) => s + valueTo(other,p,M), 0) + sk.reduce((s,p) => s + p.value*other.pickMult, 0)
                     - gp.reduce((s,p) => s + valueTo(other,p,M), 0) - gk.reduce((s,p) => s + p.value*other.pickMult, 0);
        if (myGain <= 50 || thGain <= 50) return;

        if (!tradeViable(me, sp, gp, sk, gk, M)) return;
        if (!tradeViable(other, gp, sp, gk, sk, M)) return;

        out.push({ otherId:String(otherId), gp, gk, sp, sk, myGain, thGain,
                   score: Math.min(myGain, thGain), getN, giveN });
      });
    });
  });

  out.sort((a,b) => b.score - a.score);

  // One suggestion per partner keeps the board varied.
  const seen = {};
  const final = [];
  out.forEach(t => {
    if (seen[t.otherId]) return;
    seen[t.otherId] = 1;
    final.push(t);
  });

  return final.slice(0, limit || 5);
}

/* ---------- coach: report ---------- */

function assetLabel(pid, M) {
  const p = state.players[String(pid)] || {};
  const bits = [p.position, p.team, p.age ? 'age ' + p.age : ''].filter(Boolean).join(' · ');
  const r = M.posRank(pid);
  return `<b>${pLink(pid)}</b> <span class="player-pos">${bits}${r ? ' · ' + p.position + r : ''}</span>`;
}

function packageHtml(players, picks, M) {
  return players.map(p => assetLabel(p, M))
    .concat(picks.map(k => `<b>${k.label}</b>`))
    .join('<br>');
}

function weakestSpots(team) {
  return ['QB','RB','WR','TE']
    .filter(pos => team.deficit[pos] > 0.05)
    .sort((a,b) => team.deficit[b] - team.deficit[a]);
}

function tradeRationale(t, me, other, M) {
  const myGot = {};
  t.gp.forEach(p => myGot[playerPositionOf(p)] = 1);
  const fixes = Object.keys(myGot).filter(pos => me.deficit[pos] > 0.05);

  const theirGot = {};
  t.sp.forEach(p => theirGot[playerPositionOf(p)] = 1);
  const theirFixes = Object.keys(theirGot).filter(pos => other.deficit[pos] > 0.05);

  const youBits = [];
  if (fixes.length) youBits.push('upgrades your weakest starting spot' + (fixes.length > 1 ? 's' : '') + ' (' + fixes.join(', ') + ')');
  if (t.gk.length) youBits.push('adds draft capital');
  if (t.sk.length) youBits.push('spends from your ' + me.picks.length + '-pick stockpile instead of your starters');
  if (t.sp.length && !fixes.length) youBits.push('converts surplus depth into a better starter');
  if (!youBits.length) youBits.push('nets you more value than it costs');

  const themBits = [];
  if (theirFixes.length) themBits.push('fills their ' + theirFixes.join('/') + ' hole');
  if (other.mode === 'rebuild') {
    if (t.sk.length) themBits.push('they are rebuilding and bank future picks');
    else themBits.push('they are rebuilding and get the younger side of the deal');
  } else {
    themBits.push('they are contending and this makes their lineup better now');
  }

  const oldest = t.sp.concat(t.gp)
    .map(p => state.players[String(p)])
    .filter(p => p && p.age);

  let note = '';
  const risky = t.gp.filter(p => {
    const pl = state.players[String(p)];
    return pl && pl.injury_status;
  });
  if (risky.length) {
    note = ' Heads up: ' + risky.map(p =>
      playerDisplayName(p) + ' is listed ' + state.players[String(p)].injury_status).join(', ') + '.';
  }

  return `<b>Why you do it:</b> ${youBits.join('; ')}. <b>Why they say yes:</b> ${themBits.join('; ')}.${note}`;
}

function coachReport(rosterId) {
  const league = analyzeLeague();
  const M = league.M;
  const me = league.teams[String(rosterId)];

  if (!me) return '<div class="empty">No roster found</div>';

  const weak = weakestSpots(me);
  const counts = starterCounts();

  let html = `
    <div class="team-panel-top">
      <div class="team-with-avatar">
        ${avatarHtml(rosterId, 40)}
        <div>
          <h2>${teamName(rosterId)}</h2>
          <div class="record-line">
            <span class="verdict ${me.mode}">${me.mode === 'contend' ? 'Contending' : 'Rebuilding'}</span>
            &nbsp;avg age ${me.age.toFixed(1)} · ${me.picks.length} picks
          </div>
        </div>
      </div>
    </div>
  `;

  // Positional strength
  const maxStrength = Math.max.apply(null, ['QB','RB','WR','TE'].map(p => league.avg[p] * 1.6));

  html += `<div class="detail-box"><div class="detail-title">Starting Lineup Strength vs League</div>`;
  ['QB','RB','WR','TE'].forEach(pos => {
    const pct = Math.max(3, Math.min(100, (me.strength[pos] / maxStrength) * 100));
    const d = me.deficit[pos];
    const cls = d > 0.25 ? 'weak' : (d > 0.05 ? 'mid' : '');
    const note = d > 0.25 ? 'weak spot' : (d > 0.05 ? 'below avg' : 'strength');
    html += `
      <div class="need-bar-row">
        <span class="need-bar-label">${pos}</span>
        <span class="need-bar ${cls}"><span style="width:${pct}%"></span></span>
        <span class="need-bar-note">${note}</span>
      </div>
    `;
  });
  html += `</div>`;

  // Lineup check
  // Only compare the spots this model actually values — DEF/K aren't scored here.
  const setStarters = ((me.roster && me.roster.starters) || [])
    .map(String)
    .filter(p => p && p !== '0' && ['QB','RB','WR','TE'].indexOf(playerPositionOf(p)) !== -1);
  const optimal = me.lineup.picked.map(String);
  const shouldStart = optimal.filter(p => setStarters.indexOf(p) === -1);
  const shouldSit = setStarters.filter(p => optimal.indexOf(p) === -1);

  if (shouldStart.length && setStarters.length) {
    html += `<div class="detail-title">Lineup Check</div><div class="detail-box">`;
    html += `<div class="tx-line"><span class="tx-add">Start:</span> ${shouldStart.map(p => assetLabel(p, M)).join(', ')}</div>`;
    if (shouldSit.length) {
      html += `<div class="tx-line"><span class="tx-drop">Over:</span> ${shouldSit.map(p => assetLabel(p, M)).join(', ')}</div>`;
    }
    html += `<div class="trade-why">Based on current production value. In the offseason Sleeper often holds a stale lineup, so re-check once games start.</div>`;
    html += `</div>`;
  }

  // Trades
  const trades = findTrades(rosterId, league, 5);

  html += `<div class="detail-title">Trades Worth Offering</div>`;

  if (!trades.length) {
    html += `<div class="empty">No trade clears the fairness bar right now — every match either overpays or leaves one side's lineup worse.</div>`;
  } else {
    html += `<div class="list-stack">`;
    trades.forEach(t => {
      const other = league.teams[t.otherId];
      const otherWeak = weakestSpots(other);
      html += `
        <div class="trade-card">
          <div class="tx-top">
            <span class="tx-badge trade">with ${teamName(t.otherId)}</span>
            <span class="verdict ${other.mode}">${other.mode === 'contend' ? 'contending' : 'rebuilding'}</span>
            <span class="tx-date">${otherWeak.length ? 'needs ' + otherWeak.join('/') : 'needs depth'}</span>
          </div>
          <div class="trade-side">
            <span class="trade-arrow get">You get</span>
            <span class="trade-assets">${packageHtml(t.gp, t.gk, M)}</span>
          </div>
          <div class="trade-side">
            <span class="trade-arrow give">You send</span>
            <span class="trade-assets">${packageHtml(t.sp, t.sk, M)}</span>
          </div>
          <div class="trade-why">${tradeRationale(t, me, other, M)}</div>
        </div>
      `;
    });
    html += `</div>`;
  }

  // Sell-high / hold-risk: players about to fall off the dynasty age cliff
  const cliff = me.players
    .filter(p => {
      const pl = state.players[String(p)];
      if (!pl || !pl.age || M.baseValue(p) < 900) return false;
      const drop = M.dynValue(p) / M.baseValue(p);
      return drop < 0.92;
    })
    .sort((a,b) => M.baseValue(b) - M.baseValue(a))
    .slice(0, 5);

  if (cliff.length) {
    html += `<div class="detail-title">Sell Before the Cliff</div><div class="detail-box"><div class="roster-list">`;
    cliff.forEach(p => {
      const pl = state.players[String(p)];
      html += `
        <div class="roster-row">
          <span class="player-name">${pLink(p)}${playerInjuryTag(p)}</span>
          <span class="player-pos">${pl.position} · age ${pl.age} · still produces, dynasty value falling</span>
        </div>
      `;
    });
    html += `</div><div class="trade-why">These still carry real win-now value, which is exactly why a contender will pay for them. Value drops fastest in the next 12 months.</div></div>`;
  }

  // Free agents worth a look
  const rostered = {};
  state.rosters.forEach(r => (r.players || []).forEach(p => rostered[String(p)] = 1));

  // No value filter here on purpose: search_rank lags breaking news, so a spike in
  // adds is often the only signal that something just happened to this player.
  const fa = ((state.trending && state.trending.add) || [])
    .map(t => String(t.player_id))
    .filter(pid => {
      const p = state.players[pid];
      return !rostered[pid] && p && ['QB','RB','WR','TE'].indexOf(p.position) !== -1;
    })
    .slice(0, 6);

  if (fa.length) {
    html += `<div class="detail-title">Free Agents the Market Is Moving On</div><div class="detail-box"><div class="roster-list">`;
    fa.forEach(pid => {
      html += `
        <div class="roster-row">
          <span class="player-name">${pLink(pid)}${playerInjuryTag(pid)}</span>
          <span class="player-pos">${playerMeta(pid)}</span>
        </div>
      `;
    });
    html += `</div><div class="trade-why">Unrostered in your league and among the most-added players across Sleeper in the last 24 hours — the closest thing the API gives to a live news signal.</div></div>`;
  }

  return html;
}

/* ---------- coach: interactive trade builder ---------- */

function ownerOfPlayer(pid) {
  const r = state.rosters.find(x => (x.players || []).map(String).indexOf(String(pid)) !== -1);
  return r ? String(r.roster_id) : '';
}

function tbEnsureInit() {
  if (state.tb) return;
  state.tb = { teams: [], assets: [], search: '', pending: null };
  // Start with my team as the first side; a searched player's team joins as the other side.
  const mine = myRosterId();
  if (mine) state.tb.teams.push(String(mine));
}

function tbRender() {
  const body = document.getElementById('coachBody');
  if (!body) return;

  // Preserve the page scroll position across the re-render so adding/removing an asset
  // doesn't jump the view back to the top.
  const y = window.scrollY;
  const searchFocused = document.activeElement && document.activeElement.id === 'tbSearchInput';
  body.innerHTML = tradeBuilderHtml();

  if (searchFocused) {
    const inp = document.getElementById('tbSearchInput');
    if (inp) { inp.focus({ preventScroll: true }); inp.selectionStart = inp.selectionEnd = inp.value.length; }
  }
  window.scrollTo(0, y);
}

function tbAddTeam(rid) {
  rid = String(rid);
  if (!rid) return;
  if (state.tb.teams.indexOf(rid) === -1) state.tb.teams.push(rid);
  state.tb.pending = null;
  tbRender();
}

function tbRemoveTeam(rid) {
  rid = String(rid);
  state.tb.teams = state.tb.teams.filter(t => t !== rid);
  state.tb.assets = state.tb.assets.filter(a => a.to !== rid && a.from !== rid);
  state.tb.pending = null;
  tbRender();
}

function tbSetSearch(v) { state.tb.search = v; tbRender(); }

function tbHasPlayer(pid) {
  return state.tb.assets.some(a => a.kind === 'player' && a.pid === String(pid));
}
function tbHasPick(id) {
  return state.tb.assets.some(a => a.kind === 'pick' && a.pickId === id);
}

// Clicking an asset: with two teams the destination is simply the other team; with three
// or more we ask which team receives it (a player can't be added twice).
function tbPickPlayer(pid, from) {
  if (tbHasPlayer(pid)) return;
  from = String(from || ownerOfPlayer(pid) || '');
  // Search-to-start: pull the player's team into the trade if it isn't already in it.
  if (from && state.tb.teams.indexOf(from) === -1) state.tb.teams.push(from);
  const parts = state.tb.teams;
  if (parts.length === 2) tbAddPlayer(pid, from, parts.find(t => t !== from) || parts[0]);
  else { state.tb.pending = { kind:'player', pid:String(pid), from:from }; tbRender(); }
}
function tbPickPick(from, id, label, via, value) {
  if (tbHasPick(id)) return;
  const parts = state.tb.teams;
  if (parts.length === 2) tbAddPick(from, id, label, via, value, parts.find(t => t !== from) || parts[0]);
  else { state.tb.pending = { kind:'pick', from:String(from), id:id, label:label, via:via, value:Number(value) }; tbRender(); }
}
function tbChooseDest(to) {
  const pd = state.tb.pending;
  if (!pd) return;
  to = String(to);
  if (to && state.tb.teams.indexOf(to) === -1) state.tb.teams.push(to);  // bring in the receiving team if new
  state.tb.pending = null;
  if (pd.kind === 'player') tbAddPlayer(pd.pid, pd.from, to);
  else tbAddPick(pd.from, pd.id, pd.label, pd.via, pd.value, to);
}
function tbCancelPending() { state.tb.pending = null; tbRender(); }

function tbAddPlayer(pid, from, to) {
  if (!to || tbHasPlayer(pid)) { tbRender(); return; }
  state.tb.assets.push({ kind:'player', pid:String(pid), from:String(from || ''), to:String(to) });
  state.tb.search = '';   // clear the search box after adding a searched player
  tbRender();
}
function tbAddPick(from, id, label, via, value, to) {
  if (!to || tbHasPick(id)) { tbRender(); return; }
  state.tb.assets.push({ kind:'pick', pickId:id, label:label, via:via || '', value:Number(value) || 0, from:String(from), to:String(to) });
  tbRender();
}
function tbRemoveAsset(i) { state.tb.assets.splice(i, 1); tbRender(); }
function tbClear() { state.tb.assets = []; state.tb.pending = null; tbRender(); }

const POS_ORDER = { QB:0, RB:1, WR:2, TE:3, K:4, DEF:5 };

// Letter grade for one side, from how far short it came as a share of the larger package.
// Calibrated to DynastyCalc: a ~22%-imbalanced deal grades B, ~13% grades B+, even is A+.
function tbGrade(netPct) {
  if (netPct >= -0.05) return 'A+';
  if (netPct >= -0.15) return 'A';
  if (netPct >= -0.27) return 'B+';
  if (netPct >= -0.38) return 'B';
  if (netPct >= -0.50) return 'C';
  if (netPct >= -0.62) return 'D';
  return 'F';
}

// "Won by" percentage, the way DynastyCalc shows it: gap over the combined value.
function wonByPct(hi, lo) {
  return (hi + lo) > 0 ? (hi - lo) / (hi + lo) : 0;
}
function tbGradeClass(g) {
  if (g === 'A+' || g === 'A') return 'g-a';
  if (g === 'B+' || g === 'B') return 'g-b';
  if (g === 'C') return 'g-c';
  return 'g-d';
}

function tradeBuilderHtml() {
  const M = buildValueModel();
  const tb = state.tb;
  const parts = tb.teams;
  const multi = parts.length > 2;

  const assetVal = a => a.kind === 'pick' ? (a.value || 0) : M.dynValue(a.pid);
  const fmt = v => Math.round(v).toLocaleString();

  const recv = {}, give = {};
  parts.forEach(t => { recv[t] = 0; give[t] = 0; });
  tb.assets.forEach(a => {
    if (recv[a.to] !== undefined) recv[a.to] += assetVal(a);
    if (give[a.from] !== undefined) give[a.from] += assetVal(a);
  });

  // Participating teams + add-team control
  const notIn = state.rosters.map(r => String(r.roster_id)).filter(t => parts.indexOf(t) === -1)
    .sort((a,b) => teamName(a).localeCompare(teamName(b)));

  let html = `<div class="section-label" style="margin-top:0;">Trade Builder</div>`;
  html += `<div class="tb-teams">`;
  parts.forEach(t => {
    html += `<span class="tb-chip">${teamName(t)} <button title="Remove team" onclick="tbRemoveTeam('${t}')">&times;</button></span>`;
  });
  if (notIn.length) {
    html += `<select class="tb-addteam" onchange="if(this.value)tbAddTeam(this.value)">
      <option value="">${parts.length ? '+ Add team' : '+ Choose a team'}</option>
      ${notIn.map(t => `<option value="${t}">${teamName(t)}</option>`).join('')}
    </select>`;
  }
  html += `</div>`;

  // With one team (yours, by default) you can still start: search a player and their team
  // joins the trade automatically. Only bail out entirely if no team is present at all.
  if (parts.length < 2) {
    html += `<div class="tb-verdict close">${parts.length
      ? 'Search a player below to trade for — their team joins the deal automatically — or add a second team above.'
      : 'Add a team above, or search a player to start (their team joins the deal).'}</div>`;
  }

  // Pending destination chooser. Normally the other participating teams; if the giver is the
  // only team in the trade (e.g. adding your own player first), offer everyone else instead.
  if (tb.pending) {
    const label = tb.pending.kind === 'player' ? playerDisplayName(tb.pending.pid) : tb.pending.label;
    const dests = parts.filter(t => t !== tb.pending.from);
    const opts = dests.length ? dests : notIn;
    html += `<div class="tb-verdict close"><b>Send ${escHtml(label)} to:</b> ` +
      opts.map(t => `<button class="tb-add-btn" onclick="tbChooseDest('${t}')">${teamName(t)}</button>`).join(' ') +
      ` <button class="tb-remove" onclick="tbCancelPending()" title="Cancel">&times;</button></div>`;
  }

  // RESULT / evaluator
  if (tb.assets.length) {
    // Value Adjustment (zero-sum transfer): the side that consolidates (gives more pieces than
    // it gets) earns a premium; whoever GAVE it those consolidated pieces is charged the same.
    const givenPieces = {}, recvPieces = {}, credit = {}, charge = {};
    parts.forEach(t => {
      givenPieces[t] = tb.assets.filter(a => a.from === t).length;
      recvPieces[t] = tb.assets.filter(a => a.to === t).length;
      charge[t] = 0;
    });
    parts.forEach(t => { credit[t] = valueAdjustment(tb.assets.filter(a => a.to === t).map(assetVal), givenPieces[t]); });
    parts.forEach(j => {
      if (!credit[j] || !recvPieces[j]) return;
      const froms = {};
      tb.assets.filter(a => a.to === j).forEach(a => { froms[a.from] = (froms[a.from] || 0) + 1; });
      Object.keys(froms).forEach(i => { if (charge[i] != null) charge[i] += credit[j] * froms[i] / recvPieces[j]; });
    });
    const adj = {}, recvEff = {};
    parts.forEach(t => { adj[t] = Math.round(credit[t] - charge[t]); recvEff[t] = recv[t] + adj[t]; });

    const sides = parts.map(t => {
      // 2-team: compare the two effective "gets" totals directly (symmetric). Multi-team:
      // effective received vs raw given.
      let netPct;
      if (parts.length === 2) {
        const o = parts.find(x => x !== t);
        netPct = (recvEff[t] - recvEff[o]) / Math.max(recvEff[t], recvEff[o], 1);
      } else {
        netPct = (recvEff[t] >= give[t])
          ? (give[t] > 0 ? (recvEff[t] - give[t]) / Math.max(recvEff[t], give[t]) : (recvEff[t] > 0 ? 1 : 0))
          : (recvEff[t] - give[t]) / Math.max(recvEff[t], give[t], 1);
      }
      const g = tbGrade(netPct);
      const lab = Math.abs(netPct) < 0.05 ? 'Even' : (netPct > 0 ? 'Wins' : 'Overpays');
      return { t: t, netPct: netPct, g: g, lab: lab };
    });
    const worst = Math.min.apply(null, sides.map(s => s.netPct));
    const best = sides.slice().sort((a,b) => b.netPct - a.netPct)[0];
    const worstSide = sides.slice().sort((a,b) => a.netPct - b.netPct)[0];
    const totalsArr = parts.map(t => recvEff[t]);
    const wonBy = wonByPct(Math.max.apply(null, totalsArr), Math.min.apply(null, totalsArr));
    const evenGap = Math.round(Math.max.apply(null, totalsArr) - Math.min.apply(null, totalsArr));
    const overallGrade = tbGrade(worst);
    const overallMsg = wonBy <= 0.05 ? 'All teams got a fair deal'
      : teamName(best.t) + ' comes out ahead by ' + Math.round(wonBy * 100) + '%';

    html += `<div class="tb-result">
      <div class="tb-result-head">RESULT
        <span class="tb-grade ${tbGradeClass(overallGrade)}">${overallGrade}</span>
        <span class="tb-result-msg">${overallMsg}</span>
      </div>`;

    sides.forEach(s => {
      const gets = tb.assets.map((a,i) => ({a:a,i:i})).filter(x => x.a.to === s.t);
      const gives = tb.assets.map((a,i) => ({a:a,i:i})).filter(x => x.a.from === s.t);
      html += `<div class="tb-side">
        <div class="tb-side-head">${teamName(s.t)}
          <span class="tb-grade ${tbGradeClass(s.g)}">${s.g}</span>
          <span class="tb-meta">${s.lab}</span>
        </div>
        <div class="tb-side-cols">
          <div class="tb-getcol">
            <div class="tb-colhead"><span class="tx-add">Gets</span><span class="tb-val">${fmt(recvEff[s.t])}</span></div>
            ${gets.length ? gets.map(x => `<div class="tb-row"><span>${tbAssetName(x.a)}</span><span><span class="tb-val">${fmt(assetVal(x.a))}</span> <button class="tb-remove" onclick="tbRemoveAsset(${x.i})" title="Remove">&times;</button></span></div>`).join('') : '<div class="tb-meta">—</div>'}
            ${adj[s.t] ? `<div class="tb-row tb-adj${adj[s.t] < 0 ? ' neg' : ''}" title="Value Adjustment: consolidating into fewer, more elite pieces earns a premium; shedding a stud for a pile is charged that premium"><span>Value Adjustment <span class="va-info" onclick="event.stopPropagation();alert(VA_EXPLAIN)">?</span></span><span class="tb-val">${adj[s.t] > 0 ? '+' : '−'}${fmt(Math.abs(adj[s.t]))}</span></div>` : ''}
          </div>
          <div class="tb-getcol">
            <div class="tb-colhead"><span class="tx-drop">Sends</span><span class="tb-val">${fmt(give[s.t])}</span></div>
            ${gives.length ? gives.map(x => `<div class="tb-row" style="opacity:.8"><span>${tbAssetName(x.a)}</span><span class="tb-val">${fmt(assetVal(x.a))}</span></div>`).join('') : '<div class="tb-meta">—</div>'}
          </div>
        </div>
      </div>`;
    });

    if (wonBy > 0.05 && evenGap > 0) {
      html += `<div class="tb-even-hint">Add value worth <b>${fmt(evenGap)}</b> to ${teamName(worstSide.t)} to even it out.</div>`;
    }
    html += `<div style="margin-top:12px;"><button class="cancel-btn" onclick="tbClear()">Clear trade</button></div>`;
    html += `</div>`;
  }

  // Selector: search + one column per team
  html += `<div class="detail-title">Select players &amp; picks${multi ? " — you'll choose who receives each" : ''}</div>`;
  html += `<input class="settings-input" id="tbSearchInput" placeholder="Search any player to add…" value="${escHtml(tb.search || '')}" oninput="tbSetSearch(this.value)">`;

  const q = (tb.search || '').trim().toLowerCase();
  if (q.length >= 2) {
    const matches = Object.keys(state.players)
      .filter(pid => { const p = state.players[pid]; return p && ['QB','RB','WR','TE'].indexOf(p.position) !== -1 && String(p.full_name||'').toLowerCase().indexOf(q) !== -1; })
      .sort((a,b) => M.dynValue(b) - M.dynValue(a)).slice(0, 20);
    html += `<div class="tb-search-results">` +
      (matches.length ? matches.map(pid => tbCardHtml(pid, ownerOfPlayer(pid), M, tbHasPlayer(pid), true)).join('') : '<div class="tb-meta">No matches.</div>') +
      `</div>`;
  }

  html += `<div class="tb-cols">`;
  parts.forEach(t => {
    const roster = state.rosters.find(r => String(r.roster_id) === String(t));
    const rec = getTeamRecord(roster);
    const players = ((roster && roster.players) || []).map(String)
      .filter(pid => { const p = state.players[pid]; return p && ['QB','RB','WR','TE','K','DEF'].indexOf(p.position) !== -1; })
      .sort((a,b) => (POS_ORDER[playerPositionOf(a)] == null ? 9 : POS_ORDER[playerPositionOf(a)]) -
                     (POS_ORDER[playerPositionOf(b)] == null ? 9 : POS_ORDER[playerPositionOf(b)]) ||
                     M.dynValue(b) - M.dynValue(a));

    html += `<div class="tb-col">
      <div class="tb-col-head">${avatarHtml(t, 24)}<div><b>${teamName(t)}</b><div class="tb-meta">${formatRecord(rec)}</div></div></div>
      <div class="tb-col-body">`;
    players.forEach(pid => { html += tbCardHtml(pid, t, M, tbHasPlayer(pid), false); });
    coachPicks(t).forEach(pk => {
      const added = tbHasPick(pk.id);
      const viaTxt = pk.via ? ` <span class="tb-meta">via ${escHtml(pk.via)}</span>` : '';
      html += `<div class="tb-pcard ${added ? 'added' : ''}" ${added ? '' : `onclick="tbPickPick('${t}','${escJs(pk.id)}','${escJs(pk.label)}','${escJs(pk.via)}',${Math.round(pk.value)})"`}>
        <div class="tb-pcard-top"><span class="pos-badge pos-pick">PICK</span><span class="tb-val" style="margin-left:auto">${fmt(pk.value)}</span></div>
        <div class="tb-pcard-name">${pk.label}${viaTxt}${added ? ' <span class="tb-meta">✓ added</span>' : ''}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;

  return html;
}

function tbCardHtml(pid, from, M, added, isSearch) {
  const p = state.players[String(pid)] || {};

    <div class="tb-pcard-top"><span class="pos-badge pos-${pos.toLowerCase()}">${pos}</span><span class="tb-meta"> ${team}</span><span class="tb-val" style="margin-left:auto">${Math.round(M.dynValue(pid)).toLocaleString()}</span></div>

function tbAssetName(a) {
  if (a.kind === 'pick') {
    return `<b>${escHtml(a.label)}</b> <span class="tb-meta">pick${a.via ? ' · ' + escHtml(a.via) + '’s' : ''}${a.from ? ' · from ' + teamName(a.from) : ''}</span>`;

  return `<b>${pLink(a.pid)}</b>${playerInjuryTag(a.pid)} <span class="tb-meta">${meta}${fromTxt}</span>`;
}

function defaultCoachRoster() {
  return myRosterId();
}

// The Trade Calc tab: a mode toggle (Trade Builder / Team Analysis / Trade History) over
// a body that loads the FantasyCalc market once, then renders the chosen mode inline.
function renderCoachTab(rosterId, mode) {
  if (!state.rosters.length) {
    document.getElementById('mainContent').innerHTML =
      '<div class="status"><div class="spinner"></div><p>Loading league...</p></div>';
    return;
  }

  mode = mode || state.coachMode || 'build';
  state.coachMode = mode;
  if (rosterId !== undefined) state.coachRoster = (rosterId === '' ? '' : String(rosterId));
  // Team Analysis defaults to my team (still switchable to anyone).
  const sel = state.coachRoster || (mode === 'analyze' ? myRosterId() : '');

  const options = state.rosters
    .map(r => String(r.roster_id))
    .sort((a,b) => teamName(a).localeCompare(teamName(b)))
    .map(rid => `<option value="${rid}" ${rid === sel ? 'selected' : ''}>${teamName(rid)}</option>`)
    .join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="coach-modes">
      <button class="mode-btn ${mode === 'build' ? 'active' : ''}" onclick="renderCoachTab(undefined,'build')">Trade Builder</button>
      <button class="mode-btn ${mode === 'analyze' ? 'active' : ''}" onclick="renderCoachTab(undefined,'analyze')">Team Analysis</button>
      <button class="mode-btn ${mode === 'history' ? 'active' : ''}" onclick="renderCoachTab(undefined,'history')">Trade History</button>
    </div>
    ${mode === 'analyze' ? `
      <div class="year-selector">
        <span class="section-label" style="margin:0;">Analyze team</span>
        <select class="year-select" onchange="renderCoachTab(this.value,'analyze')">${options}</select>
      </div>` : ''}
    <div id="coachBody">
      <div class="status"><div class="spinner"></div><p>Loading market values...</p></div>
    </div>
  `;

  // Load the FantasyCalc market (once), then render the chosen mode.
  setTimeout(async () => {
    const body = document.getElementById('coachBody');
    if (!body) return;
    try {
      const v = await loadValues();
      if (v && v.ok === false) {
        body.innerHTML = '<div class="error-msg">Couldn\'t load live trade values (' +
          v.err + '). Try again in a moment.</div>';
        return;
      }
      if (state.activeTab !== 'coach' || document.getElementById('coachBody') !== body) return;

      if (mode === 'build') {
        tbEnsureInit();
        body.innerHTML = tradeBuilderHtml();
      } else if (mode === 'history') {
        body.innerHTML = '<div class="status"><div class="spinner"></div><p>Loading trades from your league history…</p></div>';
        await loadTradeHistory();
        await ensureFrozenGrades();
        if (state.activeTab !== 'coach' || state.coachMode !== 'history') return;
        body.innerHTML = tradeHistoryHtml();
      } else {
        if (!sel) {
          body.innerHTML = '<div class="tb-verdict close">Pick a team above to see its roster analysis and suggested trades.</div>';
          return;
        }
        // Team Analysis uses trending as its free-agent signal.
        if (!state.trending && !state.trendingLoading) await loadTrending();
        if (state.activeTab !== 'coach' || document.getElementById('coachBody') !== body) return;
        body.innerHTML = coachReport(sel);
      }
    } catch(e) {
      body.innerHTML = '<div class="error-msg">Something went wrong: ' + e.message + '</div>';
    }
  }, 30);
}

/* ---------- coach: trade history ---------- */

// Fetches completed trades across the whole dynasty chain (up to 3 seasons) plus the
// draft results needed to resolve what each traded pick became.
async function loadTradeHistory() {
  const s = state;
  if (s.tradeHistory) return s.tradeHistory;

  const chain = [];
  let lid = s.leagueId, lg = s.league;
  for (let i = 0; i < 3 && lid; i++) {
    if (!lg) { try { lg = await fetchJSON(API + '/league/' + lid); } catch(e) { break; } }
    chain.push(lg);
    lid = lg.previous_league_id && lg.previous_league_id !== '0' ? lg.previous_league_id : null;
    lg = null;
  }

  const nameByLeague = {};
  const ownerByLeague = {};  // leagueId -> { rosterId: owner_id } (stable person key)
  const seasonDraft = {};
  const trades = [];
  const txAll = [];          // every completed transaction (all types)
  const draftedBy = {};      // player_id -> {season, round, pick, rosterId, date, leagueId}
  const seen = {};

  await Promise.all(chain.map(async L => {
    const lgId = L.league_id;
    const [users, rosters, drafts] = await Promise.all([
      fetchJSON(API + '/league/' + lgId + '/users').catch(() => []),
      fetchJSON(API + '/league/' + lgId + '/rosters').catch(() => []),
      fetchJSON(API + '/league/' + lgId + '/drafts').catch(() => [])
    ]);

    const ubyid = {};
    (users || []).forEach(u => ubyid[u.user_id] = u);
    const nm = {};
    const owners = {};
    (rosters || []).forEach(r => {
      const u = ubyid[r.owner_id];
      const tn = getSleeperTeamName(u, r.roster_id);
      // Stable user id first (survives renames), then team-name alias, then the raw name.
      const byUser = r.owner_id && (REAL_NAME_BY_USER_ID[String(r.owner_id)] || state.personByUserId[String(r.owner_id)]);
      nm[String(r.roster_id)] = byUser || REAL_NAME_BY_SLEEPER_TEAM[normalizeName(tn)] || tn;
      if (r.owner_id) owners[String(r.roster_id)] = String(r.owner_id);
    });
    nameByLeague[lgId] = nm;
    ownerByLeague[lgId] = owners;

    const d = (drafts || [])[0];
    if (d && d.draft_id) {
      try {
        const detail = await fetchJSON(API + '/draft/' + d.draft_id);
        const picks = await fetchJSON(API + '/draft/' + d.draft_id + '/picks').catch(() => []);
        const dseason = String((detail && detail.season) || L.season);
        const ddate = (detail && detail.start_time) || 0;
        if (detail && detail.slot_to_roster_id) {
          const slots = Object.keys(detail.slot_to_roster_id).map(Number).sort((a,b) => a - b);
          const order = slots.map(x => String(detail.slot_to_roster_id[String(x)]));
          const byOverall = {};
          (picks || []).forEach(p => { if (p.pick_no) byOverall[p.pick_no] = p.player_id; });
          seasonDraft[dseason] = { order: order, picksByOverall: byOverall, type: detail.type, teams: order.length };
        }
        (picks || []).forEach(p => {
          if (p.player_id && !draftedBy[String(p.player_id)]) {
            draftedBy[String(p.player_id)] = {
              season: dseason, round: p.round, pick: p.pick_no, rosterId: String(p.roster_id),
              date: ddate, leagueId: lgId
            };
          }
        });
      } catch(e) {}
    }

    const weeks = [];
    for (let w = 1; w <= 18; w++) weeks.push(w);
    const txResults = await Promise.all(weeks.map(w =>
      fetchJSON(API + '/league/' + lgId + '/transactions/' + w).catch(() => [])));
    txResults.flat().forEach(t => {
      if (!t || t.status !== 'complete' || seen[t.transaction_id]) return;
      seen[t.transaction_id] = 1;
      const tx = {
        id: t.transaction_id, leagueId: lgId, season: String(L.season), type: t.type,
        date: t.status_updated || t.created || 0,
        rosterIds: t.roster_ids || [], adds: t.adds || {}, drops: t.drops || {},
        draft_picks: t.draft_picks || [],
        waiver_budget: Array.isArray(t.waiver_budget) ? t.waiver_budget : [],
        settings: t.settings || {}
      };
      txAll.push(tx);
      if (t.type === 'trade') trades.push(tx);
    });
  }));

  trades.sort((a,b) => b.date - a.date);
  s.tradeHistory = { trades: trades, txAll: txAll, draftedBy: draftedBy, nameByLeague: nameByLeague, ownerByLeague: ownerByLeague, seasonDraft: seasonDraft };
  return s.tradeHistory;
}

// Resolve a (league, roster) to the person's display name. Routes through the stable
// Sleeper user id first (survives team renames across seasons), then the name mapping.
function histName(th, leagueId, rid) {
  const owner = th.ownerByLeague && th.ownerByLeague[leagueId] && th.ownerByLeague[leagueId][String(rid)];
  if (owner) {
    if (REAL_NAME_BY_USER_ID[owner]) return REAL_NAME_BY_USER_ID[owner];
    if (state.personByUserId[owner]) return state.personByUserId[owner];
  }
  const nm = th.nameByLeague[leagueId];
  return (nm && nm[String(rid)]) || teamName(rid);
}

// Resolve a traded pick to its draft slot + the player it became (if the draft is done).
function resolveHistPick(th, season, round, origRoster) {
  const sd = th.seasonDraft[String(season)];
  if (!sd || !sd.order) return null;
  const teams = sd.order.length;
  let ord = sd.order;
  if (sd.type !== 'linear' && Number(round) % 2 === 0) ord = ord.slice().reverse();
  const idx = ord.indexOf(String(origRoster));
  if (idx < 0) return null;
  const overall = (Number(round) - 1) * teams + idx + 1;
  return {
    overall: overall,
    slot: round + '.' + String(idx + 1).padStart(2, '0'),
    teams: teams,
    playerId: sd.picksByOverall[overall] || null
  };
}

// Value of one side's incoming assets, with pick values shown as picks or (in became mode)
// as the players they turned into.
function histSide(tr, rid, th, becameMode, M) {
  const items = [];

  Object.keys(tr.adds).forEach(pid => {
    if (String(tr.adds[pid]) !== String(rid)) return;
    items.push({ pid: String(pid), label: playerDisplayName(pid), pos: playerPositionOf(pid), value: M.dynValue(pid) });
  });

  tr.draft_picks.forEach(p => {
    if (String(p.owner_id) !== String(rid)) return;
    const res = resolveHistPick(th, p.season, p.round, p.roster_id);
    const teams = res ? res.teams : (state.rosters.length || 12);
    let label = res && res.slot ? (p.season + ' ' + res.slot) : (p.season + ' Round ' + p.round);
    let pos = 'PICK';
    let value = pickValue(p.season, p.round, res ? res.overall : null, teams);
    let bpid = null;
    let via = '';
    if (becameMode && res && res.playerId) {
      bpid = String(res.playerId);
      via = res.slot ? (p.season + ' ' + res.slot) : (p.season + ' Round ' + p.round);
      label = playerDisplayName(res.playerId);
      pos = playerPositionOf(res.playerId);
      value = M.dynValue(res.playerId);
    }
    items.push({ pid: bpid, label: label, pos: pos, value: value, via: via });
  });

  (tr.waiver_budget || []).forEach(wb => {
    if (String(wb.receiver) === String(rid)) items.push({ label: '$' + wb.amount + ' FAAB', pos: '', value: 0 });
  });

  return { items: items, total: items.reduce((s,x) => s + x.value, 0) };
}

// Value a side sends away (mirror of what others receive from it), for net/grade.
function histSent(tr, rid, th, becameMode, M) {
  let total = 0;
  Object.keys(tr.drops).forEach(pid => {
    if (String(tr.drops[pid]) === String(rid)) total += M.dynValue(pid);
  });
  tr.draft_picks.forEach(p => {
    if (String(p.previous_owner_id) !== String(rid)) return;
    const res = resolveHistPick(th, p.season, p.round, p.roster_id);
    const teams = res ? res.teams : (state.rosters.length || 12);
    total += (becameMode && res && res.playerId)
      ? M.dynValue(res.playerId)
      : pickValue(p.season, p.round, res ? res.overall : null, teams);
  });
  return total;
}

/* ---------- frozen trade grades ---------------------------------------------
   Grades are graded ONCE and then frozen, so they never drift as player values
   change. A trade freezes as soon as it's "ready": no draft picks, or all of
   its picks have been drafted. At that point it's graded in "became" mode — a
   traded pick is valued as the player it turned into — and the snapshot (per-
   side values, net, grade, winner) is written to Firestore. Trades with picks
   that haven't drafted yet stay "pending": shown live, excluded from standings,
   and locked in later when the pick is used. ------------------------------- */

// Has this pick been drafted into a player yet?
function pickResolved(th, p) {
  const r = resolveHistPick(th, p.season, p.round, p.roster_id);
  return !!(r && r.playerId);
}
// A trade can be frozen once every pick it involves has been drafted.
function tradeReadyToFreeze(tr, th) {
  return (tr.draft_picks || []).every(p => pickResolved(th, p));
}
function tradePending(tr, th) {
  return (tr.draft_picks || []).some(p => !pickResolved(th, p));
}

// Compute the graded sides for a trade. net = (received + Value Adjustment) − sent, where the
// Value Adjustment credits the side taking the fewer, more elite pieces (KTC-style). Returns a
// plain object that can be rendered live OR persisted as a frozen snapshot.
function computeTradeSides(tr, becameMode, M, th) {
  th = th || state.tradeHistory;
  const ids = tr.rosterIds.map(String);

  // Who gave each received piece: recvFrom[receiver][giver] = # of pieces.
  const recvFrom = {}; ids.forEach(r => recvFrom[r] = {});
  Object.keys(tr.adds).forEach(pid => {
    const j = String(tr.adds[pid]), i = String(tr.drops[pid]);
    if (recvFrom[j]) recvFrom[j][i] = (recvFrom[j][i] || 0) + 1;
  });
  (tr.draft_picks || []).forEach(p => {
    const j = String(p.owner_id), i = String(p.previous_owner_id);
    if (recvFrom[j]) recvFrom[j][i] = (recvFrom[j][i] || 0) + 1;
  });

  // Base per side + the consolidation credit it earns (gap = pieces given − pieces got).
  const base = ids.map(rid => {
    const got = histSide(tr, rid, th, becameMode, M);
    const sent = histSent(tr, rid, th, becameMode, M);
    const sentPieces = Object.keys(tr.drops).filter(pid => String(tr.drops[pid]) === rid).length +
      (tr.draft_picks || []).filter(p => String(p.previous_owner_id) === rid).length;
    const credit = valueAdjustment(got.items.map(it => it.value), sentPieces);
    return { rid: rid, name: histName(th, tr.leagueId, rid), items: got.items, total: got.total, sent: sent, credit: credit };
  });
  const creditOf = {}; base.forEach(b => creditOf[b.rid] = b.credit);

  // Transfer: whoever GAVE the pieces a side consolidated pays that side's premium
  // (proportional to how many of the consolidated pieces they contributed). Zero-sum.
  const charge = {}; ids.forEach(r => charge[r] = 0);
  ids.forEach(j => {
    if (!creditOf[j]) return;
    const froms = recvFrom[j];
    const totalPieces = Object.keys(froms).reduce((a, k) => a + froms[k], 0);
    if (!totalPieces) return;
    Object.keys(froms).forEach(i => { if (charge[i] != null) charge[i] += creditOf[j] * froms[i] / totalPieces; });
  });

  const sides = base.map(b => {
    const adj = Math.round(b.credit - charge[b.rid]);   // net Value Adjustment (+ credit / − charge)
    const net = (b.total + adj) - b.sent;
    return { rid: b.rid, name: b.name, items: b.items, total: b.total, sent: b.sent,
      adj: adj, net: net, ownPct: net / Math.max(b.total, b.sent, 1) };
  });
  const totalRecv = sides.reduce((a, x) => a + x.total + Math.max(x.adj, 0), 0) || 1;
  const best = sides.slice().sort((a, b) => b.net - a.net)[0];
  const worstOwnPct = Math.min.apply(null, sides.map(x => x.ownPct));
  const wonBy = best ? best.net / totalRecv : 0;
  const grade = tbGrade(worstOwnPct);
  return {
    sides: sides, grade: grade, spineCls: 'spine-' + tbGradeClass(grade).slice(2),
    winnerRid: wonBy >= 0.05 ? best.rid : '', wonBy: wonBy
  };
}

// Read all frozen snapshots from Firestore into state (once, best-effort).
async function loadFrozenGrades() {
  if (state.frozenGradesLoaded) return state.frozenGrades;
  const map = {};
  try {
    const snap = await db.collection(TRADE_GRADES_COLLECTION).get();
    snap.docs.forEach(doc => { map[doc.id] = doc.data(); });
  } catch(e) { /* offline: fall back to live grading */ }
  state.frozenGrades = map;
  state.frozenGradesLoaded = true;
  return map;
}

// Build the persistable frozen snapshot for a trade at current values.
function buildFrozenSnapshot(tr, M, th) {
  const d = computeTradeSides(tr, true, M, th);
  return {
    tradeId: tr.id, leagueId: tr.leagueId, season: tr.season, date: tr.date || 0,
    grade: d.grade, spineCls: d.spineCls, winnerRid: d.winnerRid || '', wonBy: d.wonBy || 0,
    sides: d.sides.map(s => ({
      rid: s.rid, name: s.name,
      total: Math.round(s.total), sent: Math.round(s.sent), net: Math.round(s.net),
      adj: Math.round(s.adj || 0),
      items: (s.items || []).map(it => ({
        pid: it.pid || '', label: it.label || '', pos: it.pos || '',
        value: Math.round(it.value || 0), via: it.via || ''
      }))
    }))
  };
}

async function persistFrozen(snap) {
  try {
    await db.collection(TRADE_GRADES_COLLECTION).doc(snap.tradeId)
      .set(Object.assign({}, snap, { frozenAt: firebase.firestore.FieldValue.serverTimestamp() }));
    return true;
  } catch (e) { return false; }
}

// Freeze every ready-but-unfrozen trade at current values and persist it.
async function freezeReadyTrades(th, M) {
  if (!state.frozenGrades) state.frozenGrades = {};
  const pending = [];
  th.trades.forEach(tr => {
    if (state.frozenGrades[tr.id] || !tradeReadyToFreeze(tr, th)) return;
    const snap = buildFrozenSnapshot(tr, M, th);
    state.frozenGrades[tr.id] = snap;   // optimistic: usable even if the write fails
    pending.push(snap);
  });
  for (const snap of pending) await persistFrozen(snap);
}

// Admin: recompute and OVERWRITE every ready trade's frozen grade with current values
// (DynastyCalc picks + Value Adjustment). Triggered from the pin-protected Trade History gear.
async function refreezeAllTrades(th, M) {
  if (!state.frozenGrades) state.frozenGrades = {};
  const snaps = [];
  th.trades.forEach(tr => {
    if (!tradeReadyToFreeze(tr, th)) return;   // pending trades stay pending
    const snap = buildFrozenSnapshot(tr, M, th);
    state.frozenGrades[tr.id] = snap;
    snaps.push(snap);
  });
  for (const snap of snaps) await persistFrozen(snap);
  return snaps.length;
}

// Ensure frozen grades are loaded and any newly-ready trades are frozen.
// Safe to await before rendering any trade card. Needs values loaded to freeze.
async function ensureFrozenGrades() {
  const th = state.tradeHistory;
  if (!th) return;
  if (!state.frozenGradesLoaded) { try { await loadFrozenGrades(); } catch(e) {} }
  if (state.vals) { try { await freezeReadyTrades(th, buildValueModel()); } catch(e) {} }
}

// One trade rendered as a graded card. Uses the frozen snapshot when present,
// otherwise grades live (pending trades). opts: { M, highlightPid }.
function tradeCardHtml(tr, opts) {
  opts = opts || {};
  const th = state.tradeHistory;
  const M = opts.M || buildValueModel();
  const fmt = v => Math.round(v).toLocaleString();
  const hl = opts.highlightPid ? String(opts.highlightPid) : null;

  const frozen = state.frozenGrades && state.frozenGrades[tr.id];
  const pending = !frozen && tradePending(tr, th);
  const data = frozen || computeTradeSides(tr, true, M, th);
  const sides = data.sides;
  const grade = data.grade;
  const spineCls = data.spineCls;
  // A pending trade has no final winner yet, so don't crown one.
  const winner = (!pending && data.winnerRid) ? sides.find(s => String(s.rid) === String(data.winnerRid)) : null;
  const wonBy = data.wonBy || 0;

  // Resolve names live (by roster id) so person/name fixes apply even to already-frozen
  // cards; the frozen snapshot's stored name is only a fallback.
  const nameOf = s => histName(th, tr.leagueId, s.rid) || s.name;
  const date = tr.date ? new Date(tr.date).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : '';
  const matchup = sides.map(s => escHtml(nameOf(s))).join(' <span class="tx-x">&#8644;</span> ');
  const winPill = winner ? `<span class="tx-winner">${escHtml(nameOf(winner))} +${Math.round(wonBy * 100)}%</span>` : '';
  const statusBadge = frozen
    ? `<span class="tx-badge frozen" title="Grade locked at trade value — won't change">Final</span>`
    : (pending ? `<span class="tx-badge pending" title="Locks once the traded pick is drafted">Pending</span>` : '');

  let html = `<div class="tx-card tx-trade ${spineCls}${pending ? ' pending' : ''}">
    <div class="tx-head">
      <span class="tx-matchup">${matchup}</span>
      <span class="tx-date">${date}</span>
      ${statusBadge}
      ${pending ? '' : winPill}
      <span class="tb-grade ${tbGradeClass(grade)}">${grade}</span>
    </div>
    <div class="th-sides">`;

  sides.forEach(s => {
    const win = winner && String(winner.rid) === String(s.rid);
    html += `<div class="th-side">
      <div class="th-side-name">${escHtml(nameOf(s))}${win ? ' <span class="th-w">W</span>' : ''}</div>
      ${(s.items || []).map(it => {
        const nameHtml = it.pid ? pLink(it.pid) : escHtml(it.label);
        const rowCls = (hl && String(it.pid) === hl) ? ' pc-hl' : '';
        const via = it.via ? ` <span class="tb-via">via ${escHtml(it.via)}</span>` : '';
        return `<div class="tb-row${rowCls}"><span>${it.pos ? `<span class="pos-badge pos-${String(it.pos).toLowerCase()}">${it.pos}</span> ` : ''}${nameHtml}${via}</span><span class="tb-val">${fmt(it.value)}</span></div>`;
      }).join('') || '<div class="tb-meta">—</div>'}
      <div class="tb-side-total">Gets ${fmt(s.total)}${s.adj ? ` <span class="tb-adj-inline${s.adj < 0 ? ' neg' : ''}" title="Value Adjustment: consolidating into fewer, more elite pieces is worth a premium; shedding a stud for a pile is charged that premium">${s.adj > 0 ? '+' : '−'}${fmt(Math.abs(s.adj))} adj</span>` : ''} · Gave ${fmt(s.sent)} · Net <span class="tb-net ${s.net > 1 ? 'pos' : (s.net < -1 ? 'neg' : '')}">${s.net >= 0 ? '+' : ''}${fmt(s.net)}</span></div>
    </div>`;
  });

  html += `</div>`;

  const foot = pending
    ? `<span class="tx-verdict tx-pending">Not final — locks when the traded pick is drafted</span>`
    : (winner
        ? `<span class="tx-verdict">${escHtml(winner.name)} won by ${Math.round(wonBy * 100)}%</span>`
        : `<span class="tx-verdict tx-even">Even — fair deal</span>`);

  html += `<div class="tx-line th-foot">${foot}</div></div>`;
  return html;
}

// Net trade value per team (person), counting only FINAL (frozen) trades — a
// pending pick-trade doesn't move the standings until its grade locks. Seeds
// every current team so all 8 appear. Sorted best net first.
function tradeTeamStats(th, M) {
  const net = {}, cnt = {}, pend = {};
  const ensure = n => { if (!(n in net)) { net[n] = 0; cnt[n] = 0; pend[n] = 0; } };
  state.rosters.forEach(r => ensure(teamName(r.roster_id)));
  th.trades.forEach(tr => {
    const frozen = state.frozenGrades && state.frozenGrades[tr.id];
    tr.rosterIds.forEach(rid => {
      const n = histName(th, tr.leagueId, rid);
      ensure(n);
      if (frozen) {
        const side = (frozen.sides || []).find(s => String(s.rid) === String(rid));
        if (side) { net[n] += side.net; cnt[n] += 1; }
      } else {
        pend[n] += 1;   // pending — excluded from net until it locks
      }
    });
  });
  return Object.keys(net)
    .map(n => ({ name: n, net: net[n], count: cnt[n], pending: pend[n] }))
    .sort((a, b) => b.net - a.net || b.count - a.count || a.name.localeCompare(b.name));
}

function tradeLeaderboardHtml(stats, activeName) {
  const fmt = v => (v >= 0 ? '+' : '') + Math.round(v).toLocaleString();
  const anyPending = stats.some(t => t.pending);
  let h = `<div class="section-label" style="margin-top:0;">Trade Leaderboard</div>`;
  h += `<div class="coach-sub">Net value from every finalized trade — #1 is the best trader, #${stats.length} the worst. Grades lock in the day a trade is made${anyPending ? ' (pick trades lock once the pick is drafted, so pending ones aren\'t counted yet)' : ''}. Tap a team to filter the history below.</div>`;
  h += `<div class="tlb">`;
  stats.forEach((t, i) => {
    const rank = i + 1;
    const rcls = rank <= 3 ? ' r' + rank : '';
    const netcls = t.count ? (t.net > 1 ? 'pos' : (t.net < -1 ? 'neg' : '')) : '';
    const active = t.name === activeName ? ' active' : '';
    const pendTxt = t.pending ? ` · <span class="tlb-pend">${t.pending} pending</span>` : '';
    h += `<div class="tlb-row${active}" onclick="tradeHistFilterClick('${escJs(t.name)}')">
      <span class="tlb-rank${rcls}">${rank}</span>
      <div class="tlb-main">
        <span class="tlb-name">${escHtml(t.name)}</span>
        <span class="tlb-trades">${t.count} final${pendTxt}</span>
      </div>
      <span class="tlb-net ${netcls}">${t.count ? fmt(t.net) : '—'}</span>
    </div>`;
  });
  h += `</div>`;
  return h;
}

// Pin-protected: recompute and overwrite every saved frozen grade with current values
// (DynastyCalc picks + Value Adjustment). Pending pick-trades are left untouched.
async function tradeHistSettings() {
  const pin = prompt('Enter passcode to re-freeze all saved trade grades:');

  if (!confirm('Overwrite ALL saved trade grades with current values (DynastyCalc picks + Value Adjustment)? This replaces the frozen grades and can’t be undone.')) return;

function tradeHistoryHtml() {
  const th = state.tradeHistory;
  if (!th || !th.trades.length) {
    return '<div class="empty">No completed trades found in your league history.</div>';

  const M = buildValueModel();

    names.map(n => `<option value="${escHtml(n)}" ${n === filter ? 'selected' : ''}>${escHtml(n)}</option>`).join('');

  const shown = filter
    ? th.trades.filter(tr => tr.rosterIds.some(rid => histName(th, tr.leagueId, rid) === filter))

    html += `<div class="empty">No trades involving ${escHtml(filter)}.</div>`;

      lastSeason = tr.season;
    }
    html += tradeCardHtml(tr, { M: M });
  });

  return html;
}

const STARTUP_TS = 1722470400000; // ~Aug 2024, before the first Sleeper season

// Chronological ownership timeline: ESPN startup, Sleeper rookie drafts, and every
// add/drop/trade/waiver across the league history, with dates.
function playerHistory(pid) {
  pid = String(pid);
  const th = state.tradeHistory;
  const events = [];

  const su = startupByPid()[pid];
  if (su) events.push({ date: STARTUP_TS, dateText: '2024', sort: 1, kind: 'startup',
    tag: 'Startup Draft (ESPN)', text: 'Drafted by ' + su.t + ' — Round ' + su.r + ', Pick ' + su.p });

  if (th) {
    const db = th.draftedBy[pid];
    if (db) {
      const nm = (th.nameByLeague[db.leagueId] || {})[db.rosterId] || teamName(db.rosterId);
      const teams = (th.seasonDraft[db.season] && th.seasonDraft[db.season].teams) || 8;
      const slot = db.round + '.' + String((((db.pick || 1) - 1) % teams) + 1).padStart(2, '0');
      events.push({ date: db.date, sort: 2, kind: 'rookie', tag: db.season + ' Rookie Draft',
        text: 'Drafted by ' + nm + ' — Pick ' + slot });
    }

    th.txAll.forEach(t => {
      const nmMap = th.nameByLeague[t.leagueId] || {};
      const nameOf = rid => nmMap[String(rid)] || teamName(rid);
      if (t.type === 'trade') {
        if (t.adds[pid] != null || t.drops[pid] != null) {
          events.push({ date: t.date, sort: 3, isTrade: true, tr: t });
        }
      } else if (t.adds[pid] != null) {
        const bid = t.settings && t.settings.waiver_bid != null ? ' ($' + t.settings.waiver_bid + ')' : '';
        const label = t.type === 'waiver' ? 'Waiver' : (t.type === 'commissioner' ? 'Commissioner' : 'Added');
        const kind = t.type === 'waiver' ? 'waiver' : (t.type === 'commissioner' ? 'commissioner' : 'add');
        events.push({ date: t.date, sort: 3, kind: kind, tag: label, text: label + ' by ' + nameOf(t.adds[pid]) + bid });
      } else if (t.drops[pid] != null) {
        events.push({ date: t.date, sort: 3, kind: 'drop', tag: 'Dropped', text: 'Dropped by ' + nameOf(t.drops[pid]) });
      }
    });
  }

  events.sort((a,b) => (a.date - b.date) || (a.sort - b.sort));
  return events;
}
